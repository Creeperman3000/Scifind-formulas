angular_momentum_formula:
  latex: L = I \omega
  symbols:
    L: Angular momentum
    I: Moment of inertia
    \omega: Angular velocity
angular_momentum_gyroscope_precession:
  latex: \Omega = \frac{\tau}{L}
  symbols:
    \Omega: Precession angular velocity (Angular velocity)
    \tau: Applied [torque] (Torque)
    L: Spin angular momentum (Angular momentum)
angular_momentum_orbital:
  latex: L = m \left(v r\right)
  symbols:
