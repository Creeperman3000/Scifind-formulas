    S: Dimensionless
limit_one_minus_cos_over_x:
  latex: \lim_{x \to 0}{\frac{1 - \cos {x}}{x}} = 0
  symbols:
    x: '[dimensionless|variable] (Variable)'
    '0': Limit point (Dimensionless)
limit_power_rule:
  latex: \lim_{x \to a}{f(x)^{n}} = \left(\lim_{x \to a}{f(x)}\right)^{n}
  symbols:
    x: '[dimensionless|variable] (Variable)'
    a: Approach point (Dimensionless)
    f(x): Function f(x) (Dimensionless)
    n: Exponent n (Dimensionless)
limit_product_rule:
  latex: \lim_{x \to a}{f \cdot g} = \lim_{x \to a}{f} \lim_{x \to a}{g}
  symbols:
    x: '''[dimensionless|variable]'' (Variable)'
    a: Approach point (Dimensionless)
    f: Function f (Dimensionless)
    g: Function g (Dimensionless)
limit_quotient_rule:
  latex: \lim_{x \to a}{\frac{f}{g}} = \frac{\lim_{x \to a}{f}}{\lim_{x \to a}{g}}
  symbols:
    x: '''[dimensionless|variable]'' (Variable)'
    a: Approach point (Dimensionless)
    f: Numerator function f (Dimensionless)
    g: Denominator function g (Dimensionless)
limit_sin_over_x:
  latex: 1 = \frac{\sin {x}}{x}
  symbols:
    x: '[angle|variable] (Plane angle)'
limit_sum_rule:
  latex: \lim_{x \to a}{f + g} = \lim_{x \to a}{f} + \lim_{x \to a}{g}
  symbols:
    x: '''[dimensionless|variable]'' (Variable)'
    a: Approach point (Dimensionless)
    f: Function f (Dimensionless)
    g: Function g (Dimensionless)
limit_x_n_to_zero:
  latex: \lim_{x \to 0}{x^{n}} = 0
  symbols:
    x: '''[dimensionless|variable]'' (Variable)'
    '0': Zero (Dimensionless)
    n: Positive exponent (Dimensionless)
limiting_reactant_excess_mass_calc:
