    \infty: Infinity (Dimensionless)
limit_exponential_minus_one:
  latex: \lim_{x \to 0}{\frac{\exp {x} - 1}{x}} = 1
  symbols:
    x: '[dimensionless|variable] (Variable)'
    '0': Zero (Dimensionless)
limit_log_one_plus_x:
  latex: \lim_{x \to 0}{\frac{\ln{1 + x}}{x}} = 1
  symbols:
    e: Euler's number
    x: '[dimensionless|variable] (Variable)'
    '0': Limit point (Dimensionless)
limit_of_detection_formula:
  latex: LOD = \frac{3.3 σ}{S}
  symbols:
    LOD: Limit of detection (Concentration)
