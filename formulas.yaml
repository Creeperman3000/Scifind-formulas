law_of_sines_circumradius:
  latex: \frac{a}{\sin {A}} = \frac{b}{\sin {B}} = \frac{c}{\sin {C}} = 2R
  symbols:
    a: Side a (Length)
    A: Angle A (Plane angle)
    b: Side b (Length)
    B: Angle B (Plane angle)
    c: Side c (Length)
    C: Angle C (Plane angle)
    R: Circumradius (Length)
law_of_tangents:
  latex: \frac{a - b}{a + b} = \frac{\tan {\left(\frac{A - B}{2}\right)}}{\tan {\left(\frac{A
    + B}{2}\right)}}
  symbols:
    a: Length
    b: Length
    A: Plane angle
    B: Plane angle
law_of_total_probability:
  latex: P(B) = \sum{P(B|A₁)} P(A₁)
  symbols:
    P(B): Total probability of event B (Dimensionless)
    P(B|A₁): Conditional probability given A₁ (Dimensionless)
    P(A₁): Probability of A₁ (Dimensionless)
laws_of_sines_projection_formula:
  latex: a = b \left(\cos {C}\right) + c \cos {B}
  symbols:
    a: Side a (Length)
    b: Side b (Length)
    C: Angle C (Plane angle)
    c: Side c (Length)
    B: Angle B (Plane angle)
lc_resonance:
