absolute_pressure:
  latex: P_{abs} = P_{atm} + P_{gauge}
  symbols:
    P_{abs}: Absolute [pressure] (Pressure)
    P_{atm}: Atmospheric [pressure] (Pressure)
    P_{gauge}: Gauge [pressure] (Pressure)
absorbance_transmittance:
  latex: A = -\log_{10}{T}
  symbols:
    A: Absorbance
    T: Transmittance (Dimensionless)
absorbed_dose_formula:
  latex: D = \frac{E}{m}
  symbols:
    D: Absorbed dose
    E: '[energy] imparted by ionizing radiation (Energy)'
    m: '[mass] of the absorbing material (Mass)'
absorbed_dose_rate_formula:
  latex: \dot{D} = \frac{D}{t}
  symbols:
    \dot{D}: Absorbed dose rate
    D: Absorbed dose
    t: Time
absorption_coefficient_optical:
  latex: \alpha = \frac{2.303A}{t}
  symbols:
    \alpha: Absorption coefficient (Wavenumber)
    A: Absorbance (Dimensionless)
    t: Sample thickness (Length)
absorptivity_molar:
  latex: \varepsilon = \frac{A}{c l}
  symbols:
    \varepsilon: Molar absorptivity (Molar absorptivity)
    A: Absorbance
    c: Concentration
    l: Path [length] (Length)
ac_circuit_power_factor:
  latex: PF = \frac{P}{V_{rms} I_{rms}}
  symbols:
    PF: Power factor (Dimensionless)
    P: Real [power] (Power)
    V_{rms}: RMS voltage (Electric potential)
    I_{rms}: RMS [current] (Electric current)
ac_power_average_resistive:
  latex: P_{avg} = \frac{I_0 V_0}{2}
  symbols:
    P_{avg}: Average [power] (Power)
    I_0: Peak current (Electric current)
    V_0: Peak voltage (Electric potential)
acceleration_atwood_machine:
  latex: a = g_0 \left(\frac{m_1 - m_2}{m_1 + m_2}\right)
  symbols:
    g_0: Standard gravity
    a: '[acceleration] (Acceleration)'
    m_1: '[mass] 1 (Mass)'
    m_2: '[mass] 2 (Mass)'
acceleration_from_net_force:
  latex: a = \frac{F}{m}
  symbols:
    a: Acceleration
    F: Net [force] (Force)
    m: Mass
acid_dissociation_constant:
  latex: K_a = \frac{[H⁺] [A⁻]}{[HA]}
  symbols:
    K_a: Equilibrium constant
    '[H⁺]': Hydronium [concentration] (Concentration)
    '[A⁻]': Conjugate base [concentration] (Concentration)
    '[HA]': Acid [concentration] (Concentration)
acid_dissociation_percent_ionization:
  latex: \% ionization = 100\,\frac{[H⁺]}{[HA]_0}
  symbols:
    \% ionization: Percent ionization (Dimensionless)
    '[H⁺]': Hydronium ion concentration (Dimensionless)
    '[HA]_0': Initial acid [concentration] (Concentration)
activity_from_decay_constant:
  latex: A = f N
  symbols:
    A: Activity
    f: Decay constant (Frequency)
    N: Number of radioactive nuclei (Amount of substance)
activity_time:
  latex: A(t) = A_0 \exp {\left(-\left(\lambda t\right)\right)}
  symbols:
    A(t): '[activity] at time t (Activity)'
    A_0: Initial [activity] (Activity)
    \lambda: Decay constant (Frequency)
    t: Time
adiabatic_process:
  latex: P V^{\gamma} = C
  symbols:
    P: '[pressure] (Pressure)'
    V: '[volume] (Volume)'
    \gamma: Heat capacity ratio (Dimensionless)
    C: Constant (Dimensionless)
adiabatic_temp_volume:
  latex: T V^{\gamma - 1} = K
  symbols:
    T: '[temperature] (Temperature)'
    V: '[volume] (Volume)'
    \gamma: Heat capacity ratio (Dimensionless)
    K: Constant (Dimensionless)
adiabatic_work:
  latex: E = \frac{\left(P_1 V_1\right) - P_2 V_2}{\gamma - 1}
  symbols:
    E: Adiabatic work (Energy)
    P_1: Initial [pressure] (Pressure)
    V_1: Initial [volume] (Volume)
    P_2: Final [pressure] (Pressure)
    V_2: Final [volume] (Volume)
    \gamma: Heat capacity ratio (Dimensionless)
amperes_law:
  latex: \oint{B \cdot \mathrm{d} {l}} = \mu_0 I_{enc}
  symbols:
    \mu_0: Vacuum permeability
    B: Field (Magnetic flux density)
    l: Path [length] (Length)
    I_{enc}: Enclosed current (Electric current)
amphere_maxwell_law:
  latex: \oint{B \cdot \mathrm{d} {l}} = \mu_0 \left(I + \varepsilon_0 \left(\frac{\mathrm{d}
    {\left(\int{E \cdot \mathrm{d} {A}}\right)}}{\mathrm{d} {t}}\right)\right)
  symbols:
    \mu_0: Vacuum permeability
    \varepsilon_0: Vacuum permittivity
    B: Magnetic flux density
    l: Path [length] (Length)
    I: Conduction [current] (Electric current)
    E: Electric field (Electric field strength)
    A: Surface [area] (Area)
    t: Time
amplitude_modulation_wave_equation:
  latex: y(t) = A_c \left(1 + m \cos {\left(\left(2\,\pi\right) \left(f_m t\right)\right)}\right)
    \cos {\left(\left(2\,\pi\right) \left(f_c t\right)\right)}
  symbols:
    \pi: Pi
    y(t): Modulated signal (Dimensionless)
    A_c: Carrier amplitude (Dimensionless)
    m: Modulation index (Dimensionless)
    f_m: Modulating frequency (Dimensionless)
    t: Time
    f_c: Carrier [frequency] (Frequency)
analytical_sensitivity:
  latex: S = \frac{\Delta signal}{c}
  symbols:
    S: Sensitivity (Dimensionless)
    \Delta signal: Change in signal (Dimensionless)
    c: Concentration
angle_diff_cosine:
  latex: \cos {\left(A - B\right)} = \left(\cos {A} \cos {B}\right) + \sin {A} \sin
    {B}
  symbols:
    A: Angle A (Plane angle)
    B: Angle B (Plane angle)
angle_diff_sine:
  latex: \sin {\left(A - B\right)} = \left(\sin {A} \cos {B}\right) - \cos {A} \sin
    {B}
  symbols:
    A: Angle A (Plane angle)
    B: Angle B (Plane angle)
angle_diff_tangent:
  latex: \tan {\left(A - B\right)} = \frac{\tan {A} - \tan {B}}{1 + \tan {A} \tan
    {B}}
  symbols:
    A: Angle A (Plane angle)
    B: Angle B (Plane angle)
angle_of_deviation_mirror:
  latex: \delta = \pi - 2\,\theta
  symbols:
    \pi: Pi
    \delta: Angle of deviation (Plane angle)
    \theta: Angle of incidence (Plane angle)
angle_of_repose:
  latex: \theta = \arctan {\mu_s}
  symbols:
    \theta: Angle of repose (Plane angle)
    \mu_s: Coefficient of static friction (Coefficient of friction)
angle_sum_cosine:
  latex: \cos {\left(A + B\right)} = \left(\cos {A} \cos {B}\right) - \sin {A} \sin
    {B}
  symbols:
    A: Angle A (Plane angle)
    B: Angle B (Plane angle)
angle_sum_sine:
  latex: \sin {\left(A + B\right)} = \sin {A} \left(\cos {B}\right) + \cos {A} \sin
    {B}
  symbols:
    A: Angle A (Plane angle)
    B: Angle B (Plane angle)
angle_sum_tangent:
  latex: \tan {\left(A + B\right)} = \frac{\tan {A} + \tan {B}}{1 - \tan {A} \tan
    {B}}
  symbols:
    A: Angle A (Plane angle)
    B: Angle B (Plane angle)
angular_acceleration_from_torque:
  latex: \alpha = \frac{\tau}{I}
  symbols:
    \alpha: Angular acceleration
    \tau: Torque
    I: Moment of inertia
angular_displacement_constant_acceleration:
  latex: \theta = \omega_0 t + \frac{1}{2} \alpha t^{2}
  symbols:
    \theta: Angle (Plane angle)
    \omega_0: Initial angular velocity (Angular velocity)
    t: Time
    '1': One (Dimensionless)
    '2': Two (Dimensionless)
    \alpha: Angular acceleration (Angular acceleration)
angular_displacement_definition:
  latex: \theta = \frac{s}{r}
  symbols:
    \theta: Angular displacement (Plane angle)
    s: Arc [length] (Length)
    r: Radius (Length)
angular_frequency:
  latex: \omega = \left(\pi\,2\right) f
  symbols:
    \pi: Pi
    \omega: Angular frequency (Angular velocity)
    f: Frequency
angular_frequency_pendulum:
  latex: \omega = \sqrt{\frac{g_0}{L}}
  symbols:
    g_0: Standard gravity
    \omega: Angular frequency (Angular velocity)
    L: Pendulum [length] (Length)
angular_frequency_spring:
  latex: \omega = \sqrt{\frac{k}{m}}
  symbols:
    \omega: Angular frequency (Angular velocity)
