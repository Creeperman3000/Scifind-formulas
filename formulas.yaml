    \nu_B: Stoichiometric coefficient of B (Dimensionless)
limiting_reactant_mass_comparison:
  latex: m_{B,\text{from }A} = \frac{\frac{m_A}{M_A}}{\nu_A} \left(\nu_B M_B\right)
