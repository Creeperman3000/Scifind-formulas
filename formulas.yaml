    d_l: Load arm (Length)
limit_constant_rule:
  latex: \lim_{x \to a}{c} = c
  symbols:
    x: Variable (Variable)
    a: Approach point (Dimensionless)
    c: Constant c (Dimensionless)
limit_derivative_definition:
  latex: f'(x) = \lim_{h \to 0}{\frac{f(x+h) - f(x)}{h}}
  symbols:
    f'(x): Derivative (Variable)
    h: Increment (Dimensionless)
    '0': Limit value (Dimensionless)
    f(x+h): Shifted function (Dimensionless)
    f(x): Original function (Dimensionless)
limit_e_definition:
  latex: e = \lim_{n \to \infty}{\left(1 + \frac{1}{n}\right)^{n}}
  symbols:
