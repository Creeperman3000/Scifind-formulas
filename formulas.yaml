    f: Focal [length] (Length)
lensmaker_equation_thick_lens:
  latex: \tilde{\nu} = \left(n - 1\right) \left(\left(\frac{1}{R_1}\right) - \left(\frac{1}{R_2}\right)
    + \left(n - 1\right) \left(\frac{d}{n \left(R_1 R_2\right)}\right)\right)
  symbols:
    \tilde{\nu}: Optical power (Wavenumber)
    n: Lens refractive index (Refractive index)
    R_1: First radius of curvature (Length)
    R_2: Second radius of curvature (Length)
    d: Lens thickness (Length)
lensmakers_equation:
  latex: \tilde{\nu} = \left(n - 1\right) \left(\left(\frac{1}{R_1}\right) - \frac{1}{R_2}\right)
  symbols:
