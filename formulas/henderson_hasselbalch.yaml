description: The Henderson-Hasselbalch equation relates the pH of a buffer solution
  to the acid dissociation constant of the weak acid and the ratio of the concentrations
  of its conjugate base and the acid itself. It is derived from the acid dissociation
  equilibrium and applies in the buffer region where the concentrations of conjugate
  base and acid are both larger than the dissociated hydrogen ion concentration.
