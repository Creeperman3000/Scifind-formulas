description: "The standard error of the mean (SE) is the standard deviation of the sampling distribution of the sample mean, measuring how precisely the sample mean estimates the population mean. It equals the population standard deviation divided by the square root of the sample size, shrinking as more observations are collected. It is widely used to construct confidence intervals and to quantify the uncertainty of an estimated mean."
