description: "Water self-ionizes to a small extent into hydronium and hydroxide ions, with the equilibrium constant for this process known as the ion product of water, Kw. At 25 degrees Celsius Kw has the value 1.0 times ten to the negative fourteenth, and pKw plus pH plus pOH sums to 14; Kw depends strongly on temperature, pressure, and ionic strength."
