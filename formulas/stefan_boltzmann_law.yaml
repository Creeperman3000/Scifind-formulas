description: The Stefan–Boltzmann law states that the total thermal power radiated
  by a blackbody is proportional to the fourth power of its absolute temperature.
  Real (grey) surfaces emit less by a factor equal to their emissivity ε, so the general
  form is P = εσAT⁴.
