description: "Relates the pressure-based equilibrium constant Kp to the concentration-based equilibrium constant Kc for a gas-phase reaction. The exponent Δn is the change in the number of moles of gas between products and reactants, so the conversion factor depends on temperature and the stoichiometry of the gaseous species."
