description: Gives the slope of the inverse sine function on its principal branch,
  where the graph rises steeply near the endpoints. The slope is always positive and
  grows without bound as the input approaches -1 or 1; the formula holds for inputs
  strictly between those limits and follows from implicit differentiation of the sine
  relation.
