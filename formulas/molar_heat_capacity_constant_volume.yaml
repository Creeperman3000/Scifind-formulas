description: Molar heat capacity at constant volume (isochoric) is the heat required
  to raise the temperature of one mole of a substance by one kelvin at fixed volume,
  and equals the change in internal energy per mole per kelvin. It is smaller than
  the constant-pressure value because no expansion work is done.
