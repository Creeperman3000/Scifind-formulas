description: "Hess's law states that the total enthalpy change for a chemical reaction is independent of the pathway taken and equals the sum of the enthalpy changes of the individual steps. Because enthalpy is a state function, intermediate-step enthalpies can be added (with appropriate signs) to obtain the overall reaction enthalpy, which is the basis for tabulating and using standard enthalpies of formation."
