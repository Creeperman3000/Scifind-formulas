description: "The radioactive decay law states that for a sample of a single radionuclide, the number of radioactive nuclei remaining after time t follows an exponential decay governed by a characteristic decay constant lambda. Each species of unstable nucleus has its own decay constant, related to its half-life by t_{1/2} = ln(2)/lambda. The law underpins radiometric dating, nuclear medicine dosimetry, and reactor physics."
