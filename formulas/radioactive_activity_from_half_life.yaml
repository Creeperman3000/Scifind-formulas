description: "The activity of a radioactive sample is the number of nuclear decays per unit time. It equals the decay constant lambda times the number of remaining nuclei, and since the decay constant is related to the half-life by t_{1/2} = ln(2)/lambda, the activity can be written directly in terms of the half-life and the number of parent nuclei. This relation is used to compute activities from known half-lives, particularly in radiometric dating and radioactive-equilibrium problems."
