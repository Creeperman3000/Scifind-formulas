description: "The standard Gibbs energy change of a chemical reaction is obtained by combining the standard Gibbs energies of formation of the products and reactants, each weighted by its stoichiometric coefficient. Tabulated values of standard Gibbs energies of formation at 1 bar and a specified temperature are used to predict reaction spontaneity under standard conditions."
