description: "The one-sample t-statistic measures how many standard errors the sample mean lies from a hypothesized population mean, and under the null hypothesis it follows Student's t-distribution with n−1 degrees of freedom. It is the basis of t-tests used to assess whether an observed mean is consistent with a reference value when the population standard deviation is unknown."
