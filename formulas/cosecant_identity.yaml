description: "The cosecant is one of the six trigonometric functions and is defined as the reciprocal of the sine, so it equals the ratio of the hypotenuse to the opposite side in a right triangle. It is undefined wherever the sine vanishes (at integer multiples of pi). This identity is used to rewrite expressions and prove other trigonometric relations."
