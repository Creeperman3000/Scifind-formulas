description: "The path length difference is the difference in distances from two coherent wave sources to a given observation point, and it controls whether the waves arrive in or out of phase. Combined with the wavelength, it determines the type of interference (constructive when the path difference is an integer multiple of the wavelength and destructive when it is a half-integer multiple)."
