name: Rankine to Fahrenheit conversion
id: temperature_rankine_conversion
topic: temperature
difficulty: 5
links:
  - https://en.wikipedia.org/wiki/Rankine_scale
  - https://en.wikipedia.org/wiki/Fahrenheit
  - https://www.thoughtco.com/absolute-temperature-scales-609226
