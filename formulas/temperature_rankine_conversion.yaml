description: "Converts a temperature expressed on the absolute Rankine scale to the equivalent reading on the Fahrenheit scale. Rankine degrees are defined equal in size to Fahrenheit degrees, so the conversion is simply a zero-point shift of 459.67 degrees, since absolute zero (0 °R) corresponds to −459.67 °F."
equation: temperature eq temperature sub 459.67
symbol_overrides:
- temperature: °F
- temperature: °R
name_overrides:
- temperature: Fahrenheit
- temperature: Rankine
