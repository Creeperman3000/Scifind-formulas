description: "Normality is the equivalent concentration of a solution, defined as the number of equivalents of solute per liter of solution. It is obtained from the molar concentration by multiplying by an equivalence (n-)factor that depends on the reaction of interest: number of H+ or OH- in acid-base chemistry, electrons transferred in redox reactions, or ions exchanged in precipitation."
