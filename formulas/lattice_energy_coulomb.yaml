description: This is the purely Coulombic (Madelung) contribution to the lattice energy of an ionic crystal, summing the electrostatic interaction of every ion with all the others via the Madelung constant, which encodes the geometry of the lattice. It forms the attractive component of the Born-Landé equation, paired with a short-range repulsive term to yield the equilibrium lattice energy.
