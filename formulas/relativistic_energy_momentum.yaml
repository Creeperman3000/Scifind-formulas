description: "The energy-momentum relation of special relativity relates a free particle's total energy, invariant (rest) mass, and the magnitude of its relativistic momentum. In flat (Minkowski) spacetime it follows from the Lorentz-invariant norm of the four-momentum and reduces to mass-energy equivalence in the rest frame."
equation: energy pow 2 eq ((momentum mul speed_of_light) pow 2) add (mass mul speed_of_light
  pow 2) pow 2
