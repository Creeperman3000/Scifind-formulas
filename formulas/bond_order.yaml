description: 'In molecular orbital theory, bond order measures the net bonding between
  two atoms from the electron populations of the bonding and antibonding orbitals.
  It serves as an index of bond strength and stability: bond orders of one, two, and
  three correspond to single, double, and triple bonds, while a value of zero predicts
  that the species will not exist.'
