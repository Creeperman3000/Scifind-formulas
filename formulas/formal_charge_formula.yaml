description: 'Formal charge is a bookkeeping tool for evaluating Lewis structures:
  each atom in a molecule is assigned a hypothetical charge equal to its group valence
  electrons minus the electrons assigned to it in the structure (its lone-pair electrons
  plus half of its shared bonding electrons). Structures in which the formal charges
  on all atoms are closest to zero (and any nonzero charges reside on the most electronegative
  atoms) are considered the best Lewis representation of the molecule.'
