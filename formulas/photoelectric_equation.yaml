description: "Einstein's 1905 photoelectric equation relates the maximum kinetic energy of electrons ejected from a metal to the frequency of the incident light. Below the threshold frequency (hν < φ) no electrons are emitted, regardless of light intensity, supporting the quantum nature of light."
