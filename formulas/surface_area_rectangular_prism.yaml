description: "A rectangular prism has three pairs of congruent rectangular faces, so its total surface area is twice the sum of the areas of the three distinct face types. \nThe formula holds for any right box (orthogonal parallelepiped) and is the generalisation of which the cube's formula is the special case where all three edge lengths are equal."
