description: "In an ideal-gas mixture, the partial pressure exerted by any component equals its mole fraction multiplied by the total pressure of the mixture. This is a direct consequence of Dalton's law of partial pressures and follows from the fact that each gas in an ideal mixture behaves independently of the others."
