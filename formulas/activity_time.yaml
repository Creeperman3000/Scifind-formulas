description: "Because radioactive decay is a first-order process, the activity of a sample falls off exponentially: it drops by half after each half-life. This law predicts the decay rate of a source at any elapsed time from its initial activity and the nuclide's decay constant, and is used in radiometric dating, nuclear medicine dosing, and source calibration."
