description: The Bohr magneton is a physical constant serving as the natural unit
  for the magnetic dipole moment of an electron caused by its orbital or spin angular
  momentum. It is used throughout atomic physics and quantum chemistry to express
  electron magnetic moments and to analyze paramagnetic and Zeeman-effect behavior.
