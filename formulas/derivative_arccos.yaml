description: Gives the slope of the inverse cosine function on its principal branch.
  The slope is always negative because arccosine decreases over its domain, and it
  is undefined at the endpoints, where the graph becomes vertical. It is the mirror
  image of the arcsine slope and follows from implicit differentiation of the cosine
  relation.
equation: (rmd acos angle frac rmd angle) eq (0 sub (1 frac ((1 sub angle pow
  2) sqrt 2)))
