description: "For a dataset containing an odd number of values, the median is the single middle observation once the data are arranged in order. Equivalently, it is the order statistic at position (n+1)/2, where n is the sample size, making it the 2-quantile of the empirical distribution. This definition of the median is robust to outliers, since it depends only on the rank of the central value rather than its magnitude."
