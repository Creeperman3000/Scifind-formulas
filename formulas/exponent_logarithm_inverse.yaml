description: "States the inverse property connecting exponentials and logarithms with the same base: taking a logarithm and then exponentiating undoes itself, returning the original number. It holds for any valid logarithm base (positive and not equal to one) acting on a positive argument, and underpins solving exponential equations by taking logarithms."
