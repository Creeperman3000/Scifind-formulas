description: "A spherical zone (or spherical frustum) is the curved surface of a sphere bounded by two parallel planes. Its lateral area depends only on the sphere's radius and the distance between the two planes, and equals the area of a cylinder of the same radius and height."
equation: area eq (pi mul 2) mul (length) mul length
