description: "Faraday's laws of electrolysis combined into one working relation: the mass of a substance transformed at an electrode is proportional to the electric charge passed through the cell and to the substance's molar mass divided by the number of electrons exchanged per ion. It is used for electroplating calculations, coulometry, and battery capacity estimates."
