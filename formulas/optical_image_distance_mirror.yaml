description: "The Gaussian mirror equation relates the object distance, image distance, and focal length of a spherical mirror. Using the Cartesian sign convention (real-is-positive, virtual-is-negative) the same algebraic form applies to concave and convex mirrors, with the focal length negative for a diverging (convex) mirror so that its image is always virtual and located behind the reflecting surface."
