description: "Relates the velocity of a body in one reference frame to its velocity in another frame moving uniformly with respect to the first, an addition rule valid in the Newtonian (non-relativistic) limit where relative speeds are much smaller than the speed of light. It is the classical counterpart of the relativistic velocity-addition formula and embodies the assumption of absolute time shared by all inertial observers."
