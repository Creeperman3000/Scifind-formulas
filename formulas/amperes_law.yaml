description: Relates the circulation of the magnetic field around a closed loop to
  the total electric current passing through any surface bounded by that loop. It
  is one of Maxwell's equations and is the standard tool for computing magnetic fields
  in configurations with high symmetry, such as straight wires, solenoids, and toroids.
  The steady-current form shown here neglects displacement current.
equation: oint drop drop (magnetic_flux_density cdot rmd length ) eq vacuum_permeability
  mul current
