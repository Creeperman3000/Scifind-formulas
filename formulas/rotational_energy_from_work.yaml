description: The mechanical work done on a rigid body rotating about a fixed axis equals the integral of the net torque over the angular displacement, the rotational analog of the linear work integral. Equivalently, the net rotational work performed on the body equals its change in rotational kinetic energy, a result known as the work-energy theorem for rotation.
