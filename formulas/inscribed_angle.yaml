description: "The inscribed angle theorem states that the measure of an angle inscribed in a circle is exactly half of the central angle that subtends the same arc. As a result, every inscribed angle that intercepts a given arc has the same measure, regardless of where its vertex lies on the circle. The corollary includes Thales' theorem, that any angle inscribed in a semicircle is a right angle."
