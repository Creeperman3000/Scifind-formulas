description: Percentage difference expresses how far apart two values are as a fraction
  of their average size, so the order of a and b does not affect the result. It is
  widely used in science and engineering to compare an experimental measurement to
  a reference value or to quantify the discrepancy between two measurements of the
  same quantity. The conventional form uses absolute values in the denominator to
  keep the result defined for numbers of mixed sign.
