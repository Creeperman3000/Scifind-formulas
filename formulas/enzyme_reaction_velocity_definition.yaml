description: Defines the velocity of an enzyme-catalyzed reaction as the instantaneous
  rate at which substrate is consumed (equivalently, the rate at which product appears
  for one-to-one stoichiometry). Initial velocities measured this way are the raw
  data on which enzyme kinetics, including Michaelis–Menten analysis, is built.
