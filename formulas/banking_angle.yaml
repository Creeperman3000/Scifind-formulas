description: For a curve banked at the ideal angle, the horizontal component of the
  normal force alone supplies the required centripetal force, so a vehicle can round
  the turn without relying on friction. The tangent of that banking angle depends
  only on the travel speed, the radius of curvature, and gravitational acceleration;
  it is used in highway and racetrack design and in analyzing aircraft banked turns.
