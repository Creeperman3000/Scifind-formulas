description: The Pearson correlation coefficient measures the strength and direction
  of the linear relationship between two variables. It is a normalized, unitless version
  of the covariance, always falling between -1 and +1. Values near the extremes indicate
  strong linear association, while values near zero indicate little or no linear relationship;
  it captures only linear dependence.
