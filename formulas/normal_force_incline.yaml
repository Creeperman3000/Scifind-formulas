name: 'Dynamics: normal force on incline'
id: normal_force_incline
topic: forces
difficulty: 5
links:
  - https://en.wikipedia.org/wiki/Normal_force
  - https://phys.libretexts.org/Bookshelves/University_Physics/University_Physics_(OpenStax)/Book%3A_University_Physics_I_-_Mechanics_Sound_Oscillations_and_Waves_(OpenStax)/06:_Applications_of_Newton's_Laws
  - https://www.physicsclassroom.com/class/newtlaws/Lesson-2/Inclined-Planes
  - https://courses.lumenlearning.com/suny-osuniversityphysics/chapter/6-3-inclined-planes/
description: The normal force on a body resting on an inclined surface is the contact force perpendicular to the surface. Its magnitude adjusts so that the body neither sinks into nor lifts off the surface, balancing the component of gravity normal to the plane.
equation: force eq mass mul (acceleration) mul cos angle
symbol_overrides:
  - force: N
  - acceleration: g
  - angle: θ
name_overrides:
  - force: Normal [force]
  - mass: '[mass]'
  - acceleration: Gravitational [acceleration]
  - angle: Incline angle
