description: Gives the straight-line (Euclidean) distance between two points in the
  Cartesian plane, derived by applying the Pythagorean theorem to a right triangle
  whose hypotenuse joins the two points. It is one of the most widely used formulas
  in coordinate geometry.
equation: length eq sqrt (((dimensionless sub dimensionless) pow 2) add (dimensionless
  sub dimensionless) pow 2 ) 2
