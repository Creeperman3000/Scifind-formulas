description: "Covariance measures how two random variables vary together: positive values indicate the variables tend to move in the same direction, negative values indicate opposite movement, and zero indicates no linear association. This computational form follows from expanding the definitional expectation of the product of deviations and is widely used in deriving correlations and portfolio variance."
