description: Resolution measures how completely two adjacent chromatographic peaks
  are separated, comparing the gap between their retention times with their baseline
  widths. It is used as a system-suitability and method-development criterion in chromatography;
  values of about 1.5 or greater indicate baseline separation. Widths here are measured
  at the baseline (other conventions use half-height widths with a different prefactor).
