description: An equivalent form of the law of cosines solved for the cosine of an
  unknown angle. This form is convenient because cosine is sign-sensitive, distinguishing
  acute from obtuse angles without ambiguity, in contrast to the law of sines.
equation: angle eq acos (((length pow 2) add (length pow 2) sub length pow 2 ) frac
  2 mul length mul length )
