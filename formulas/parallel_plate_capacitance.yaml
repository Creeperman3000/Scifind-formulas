description: "An ideal parallel-plate capacitor consists of two equal conducting plates of area A separated by a small distance d. Its capacitance is directly proportional to the plate area and inversely proportional to the separation, with the proportionality constant set by the permittivity of the dielectric between the plates (vacuum permittivity in the free-space case)."
