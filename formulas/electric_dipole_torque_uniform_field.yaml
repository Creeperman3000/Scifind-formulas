description: "In a uniform electric field, an electric dipole feels equal and opposite forces on its two charges, giving no net force but a couple that twists the dipole toward alignment with the field. The turning effect grows with charge, separation, and field strength, and depends on orientation: it vanishes when the dipole is aligned with the field and is maximal when the dipole is perpendicular to it. In non-uniform fields the dipole also experiences a net translational force."
