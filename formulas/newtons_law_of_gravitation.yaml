description: Every point mass attracts every other point mass with a force directed
  along the line joining them, proportional to the product of the masses and inversely
  proportional to the square of the separation. Spherically symmetric bodies behave
  as if all their mass were concentrated at their centers (shell theorem), and the
  law is the classical limit of general relativity.
