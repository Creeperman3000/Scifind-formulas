description: 'This gives the thinnest layer of a transparent material that suppresses
  reflection from a surface by destructive thin-film interference: light reflected
  from the top and bottom of the coating emerges half a wavelength out of phase and
  cancels. The result assumes normal incidence, a design wavelength in vacuum, and
  a coating whose refractive index lies between those of air and the substrate. Such
  quarter-wave coatings, typically magnesium fluoride on glass, are used on camera
  lenses, eyeglasses, and solar cells.'
