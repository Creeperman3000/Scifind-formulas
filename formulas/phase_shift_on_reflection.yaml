description: "When a wave reflects off a boundary where the wave speed decreases (e.g., light entering a medium of higher refractive index), the reflected wave is inverted, acquiring a π radian (180°) phase shift. Waves reflecting from a faster medium back into a slower one experience no such shift."
equation: dimensionless eq pi
