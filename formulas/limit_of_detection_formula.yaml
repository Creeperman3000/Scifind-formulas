description: "The limit of detection is the lowest concentration of an analyte that can be reliably distinguished from a blank measurement, typically defined as the analyte concentration producing a signal three (or 3.3) standard deviations of the blank above the blank mean. The factor 3.3 arises from the one-sided t-distribution at 99% confidence for a small number of replicate blank measurements, and the slope of the calibration curve converts the signal-based definition into a concentration."
