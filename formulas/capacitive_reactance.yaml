description: "Capacitive reactance is the opposition a capacitor offers to alternating current, arising from its repeated storage and release of charge. Measured in ohms, it decreases as the signal frequency or capacitance increases, which is why capacitors block DC but pass high-frequency AC readily. It is used in AC circuit analysis, filter design, and impedance calculations."
