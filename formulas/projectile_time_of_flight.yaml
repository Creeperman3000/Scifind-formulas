description: "The total time a projectile spends in the air, from launch until it returns to its original elevation, is twice the time to reach the apex. It depends on the initial vertical velocity component and the gravitational acceleration. Applies in vacuum with uniform gravity."
equation: time eq 2 mul (velocity mul sin angle ) frac standard_gravity
