description: "The mechanical advantage of a lever is the ratio of the load force to the applied effort force, equal to the ratio of the effort-arm length to the load-arm length. A longer effort arm relative to the load arm allows a small effort to lift a larger load, with the trade-off being a greater distance moved by the effort."
