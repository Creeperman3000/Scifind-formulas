description: For main-group elements the number of valence electrons equals the group number in groups 1–2 and 13–18 (using the units digit for the latter); the relationship is less clean for transition metals where d-electrons also contribute. This rule is widely used as a teaching shortcut for predicting bonding behavior and oxidation states.
