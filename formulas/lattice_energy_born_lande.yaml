description: Calculates the lattice energy of an ionic crystal from the Madelung constant
  (set by the lattice geometry), the ionic charges, the nearest-neighbor distance,
  and the Born exponent (set by the electron configurations of the ions). The factor
  (1 − 1/n) accounts for short-range repulsion between ions, reducing the purely electrostatic
  Madelung energy by a small amount.
