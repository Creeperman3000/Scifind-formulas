description: Coulomb's law in vacuum gives the electrostatic force between two stationary
  point charges. The force acts along the line joining the charges, is repulsive for
  like charges and attractive for opposite ones, and weakens with the square of their
  separation. It applies exactly to point (or spherically symmetric) charges at rest
  in free space.
