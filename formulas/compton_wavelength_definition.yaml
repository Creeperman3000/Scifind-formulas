description: The Compton wavelength is a fundamental length scale associated with
  a massive particle, defined as the wavelength of a photon whose energy equals the
  particle's rest energy. It sets the scale for the wavelength shift in Compton scattering
  and marks the regime below which relativistic quantum effects become essential.
  For the electron it is about 2.43 picometers.
