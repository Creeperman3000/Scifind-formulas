description: "The magnitude of a projectile's velocity at any point along its trajectory is found by combining its independent horizontal and vertical components under the Pythagorean theorem. Since horizontal velocity is constant and vertical velocity changes linearly under gravity, the resultant gives the projectile's instantaneous speed and direction."
equation: velocity eq ( ( velocity pow 2 add velocity pow 2 ) sqrt 2 )
