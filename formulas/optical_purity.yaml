description: Optical purity is a measure of chiral purity expressed as the ratio of
  the observed specific rotation of a sample to the specific rotation of the enantiopure
  compound, usually given as a percentage. When the optical rotation of each enantiomer
  is proportional to its mole fraction, optical purity is numerically equal to the
  enantiomeric excess, although the two can diverge in cases such as concentration-dependent
  rotation or aggregation effects.
