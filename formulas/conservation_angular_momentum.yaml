description: "The total angular momentum of a system stays constant when no net external torque acts on it. Individual parts of the system may exchange rotational motion, but the total about the given axis cannot change. This law explains effects such as a figure skater spinning faster by pulling in their arms and governs rotating collisions and orbital motion."
