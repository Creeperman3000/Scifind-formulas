description: "Quadratic drag law giving the resistive force a fluid exerts on a body moving through it at relatively high speed, where pressure (form) drag dominates over viscous drag. The resistance grows with the square of the relative speed and also depends on the fluid density, the reference area of the body, and a dimensionless drag coefficient determined by shape and surface roughness. Used for aircraft, vehicles, and falling objects; at very low Reynolds numbers Stokes' linear drag applies instead."
