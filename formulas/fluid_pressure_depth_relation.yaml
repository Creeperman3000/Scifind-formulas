description: "The pressure in a static fluid increases linearly with depth, as the weight of the overlying fluid adds to the pressure at the surface. This hydrostatic relation holds for an incompressible fluid in a gravitational field and is the basis of manometers, barometers, and the calculation of forces on submerged surfaces."
