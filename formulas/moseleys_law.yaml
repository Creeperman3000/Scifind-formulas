description: "Moseley's law is an empirical relationship discovered by Henry Moseley in 1913 that links the frequency of characteristic X-ray emission lines of an element to its atomic number. The square root of the X-ray frequency increases approximately linearly with the atomic number, offset by a screening constant. It provided the first physical justification for ordering the elements by atomic number rather than atomic weight and resolved several inconsistencies in the periodic table."
