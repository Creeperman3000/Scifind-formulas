description: A Pythagorean trigonometric identity obtained by dividing the fundamental
  identity sin²θ + cos²θ = 1 by cos²θ. It expresses the secant function in terms of
  the tangent and is valid wherever cos θ is nonzero. It is frequently used in calculus
  for integrating secant-based expressions and in derivations of integration formulas.
