description: "Mayer's relation states that for an ideal gas the difference between the molar heat capacity at constant pressure and the molar heat capacity at constant volume is exactly the gas constant. It is a direct consequence of the first law of thermodynamics applied to a constant-pressure process and links the two principal specific heats of an ideal gas."
