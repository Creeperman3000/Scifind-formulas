description: The total relativistic energy of a free particle is the positive square
  root of the rest-energy squared plus the momentum-times-c squared. It is the time
  component of the particle's four-momentum and is used throughout particle and high-energy
  physics to label states by their energy and momentum.
equation: energy eq sqrt ( (momentum pow 2 mul speed_of_light pow 2) add mass pow
  2 mul speed_of_light pow 4 ) 2
