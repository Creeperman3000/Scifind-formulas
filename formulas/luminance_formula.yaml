description: Luminance is the photometric measure of luminous intensity per unit projected
  area of a surface, in a specified direction. It determines how bright a surface
  will appear to an observer, and is invariant along rays in lossless optical systems.
  The SI unit is the candela per square metre (cd/m²), also called the nit.
