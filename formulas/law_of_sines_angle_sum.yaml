description: The full form of the law of sines expresses all three side-length-to-opposite-angle-sine
  ratios at once, making it clear that each ratio is equal to a common constant equal
  to the diameter of the triangle's circumscribed circle. This is the form most often
  quoted in textbooks and used in derivations.
