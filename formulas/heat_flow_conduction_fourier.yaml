description: Fourier's law of heat conduction states that the time rate of heat flow
  through a homogeneous material is proportional to the cross-sectional area, the
  temperature difference between the two sides, and the material's thermal conductivity,
  and inversely proportional to the thickness of the material. It is a constitutive
  law for heat conduction under steady-state conditions and assumes the material is
  homogeneous and isotropic; a more general differential form uses the temperature
  gradient.
