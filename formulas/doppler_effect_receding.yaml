description: "Gives the frequency heard by a stationary observer when a wave source moves directly away from them. Because each wavefront is emitted from farther away, successive crests arrive later and the observed pitch drops below the emitted one; the shift grows with the source speed. Assumes a non-relativistic source moving in a uniform medium, such as sound in air."
