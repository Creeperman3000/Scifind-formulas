description: Gives the electric field at a point on the symmetry axis of a thin ring
  carrying charge uniformly distributed around it, found by integrating the contributions
  of all charge elements; transverse components cancel by symmetry, leaving only the
  axial component. The field is zero at the ring's center and reduces to that of a
  point charge far from the ring; off the axis the distribution requires a more general
  treatment.
equation: electric_field_strength eq coulomb_constant mul (charge mul length) frac
  ((length pow 2) add length pow 2 ) pow 1.5
