description: "In a quasi-static, reversible adiabatic process an ideal gas expands or compresses with no heat exchanged with the surroundings, so pressure and volume are constrained to vary along a steeper curve than an isotherm. The exponent is the heat capacity ratio of the gas (about 1.4 for air). This condition is used to relate the states of a gas in engines, compressors, and atmospheric processes."
