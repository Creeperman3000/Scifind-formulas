description: The saponification value (SV) of a fat or oil is the number of milligrams
  of KOH required to saponify one gram of the sample, inversely related to the average
  molecular weight of the constituent triglycerides. For a pure triglyceride it can
  be computed from the molar mass of the fat, since each triglyceride consumes three
  equivalents of KOH (molar mass 56.1 g/mol).
