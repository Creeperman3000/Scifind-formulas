description: The forced damped harmonic oscillator is a mass–spring system with viscous
  damping acted on by a sinusoidal driving force. Its equation of motion combines
  inertia, the velocity-proportional damping term 2γẋ, the restoring force ω₀²x, and
  the external drive F₀cos(ωt), and is the basis of resonance, AC circuits, and many
  models in physics and engineering. The form shown uses the normalization in which
  the driving amplitude is written directly (so it corresponds to F₀/m when written
  per unit mass).
