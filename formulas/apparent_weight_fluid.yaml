description: "An object submerged in a fluid weighs less on a scale than it does in air, because the fluid exerts an upward buoyant force (Archimedes' principle). The apparent weight is what a scale reads while the object is immersed, and comparing it with the true weight is a standard way to measure an object's volume or density."
