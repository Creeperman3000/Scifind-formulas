description: "A kite is a quadrilateral with two pairs of adjacent equal sides, whose diagonals intersect at right angles. Its area equals half the product of the diagonal lengths; the same relation also holds for any orthodiagonal quadrilateral, including the rhombus."
equation: area eq length mul (length) frac 2
