description: "The angular momentum of a point particle about a chosen origin is the moment of its linear momentum, given by the magnitude of the cross product of the particle's position vector and its momentum. Only the component of momentum perpendicular to the position vector contributes, so a particle moving along a line through the origin carries no angular momentum about it."
