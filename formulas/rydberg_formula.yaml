description: The Rydberg formula gives the wavenumber of spectral lines emitted in
  atomic electron transitions of hydrogen, expressed as a constant times the difference
  of reciprocals of squared principal quantum numbers. It generalizes the Balmer series
  and applies to hydrogen-like ions, providing the empirical basis later explained
  by the Bohr model.
