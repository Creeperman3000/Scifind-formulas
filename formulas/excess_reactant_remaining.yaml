description: "Gives the amount of substance of the excess reactant left over after a reaction stops when the limiting reactant is used up. The consumed amount is found from the limiting reactant using the stoichiometric mole ratio, then subtracted from the initial amount. It assumes a complete reaction and a balanced chemical equation."
