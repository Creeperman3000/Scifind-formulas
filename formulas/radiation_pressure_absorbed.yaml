description: "Radiation pressure is the mechanical pressure exerted when electromagnetic radiation transfers momentum to a surface. On a perfect (black-body) absorber at normal incidence, the pressure equals the incident irradiance divided by the speed of light, in agreement with Maxwell's theory and confirmed experimentally by Lebedev. The effect is small in everyday settings but governs solar-sail propulsion, dust dynamics in the solar system, and stellar-interior physics."
