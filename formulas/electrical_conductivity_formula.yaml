description: "Electrical conductivity measures how well a material conducts electric current and is defined as the reciprocal of its resistivity. It is an intrinsic material property, measured in siemens per meter, commonly denoted by sigma; good conductors such as copper have high conductivity, while insulators have very low conductivity."
equation: conductance eq resistance pow (drop 1 sub)
symbol_overrides:
- conductance: σ
- resistance: ρ
