description: "For motion with constant acceleration, the average velocity over an interval equals the arithmetic mean of the initial and final velocities. This shortcut is valid only when acceleration is uniform; with varying acceleration the average must be computed from displacement and time instead."
equation: velocity eq (velocity add velocity ) frac 2
