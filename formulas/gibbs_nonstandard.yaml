description: "The Gibbs free energy change of a chemical reaction at arbitrary composition is given by the standard Gibbs energy change plus a temperature-dependent correction involving the reaction quotient. This expression, which is the thermodynamic form of the Nernst equation, lets one compute the spontaneity of a reaction away from standard state and reduces to the standard change when all activities are unity."
