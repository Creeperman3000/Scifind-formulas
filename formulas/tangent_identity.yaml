description: "The tangent of an angle equals the sine of that angle divided by the cosine of the same angle, with cos(θ) ≠ 0. This quotient identity is fundamental and is consistent with the right-triangle definition since sin/cos = (opposite/hypotenuse)/(adjacent/hypotenuse) = opposite/adjacent."
