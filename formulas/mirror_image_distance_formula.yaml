description: A rearrangement of the Gaussian mirror equation that solves for the image distance of a spherical mirror from the object distance and the focal length. Valid for paraxial rays under the real-is-positive sign convention; for a plane mirror the focal length is infinite and the formula yields equal magnitude but opposite-signed object and image distances.
