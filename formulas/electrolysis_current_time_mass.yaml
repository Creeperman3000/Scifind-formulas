description: "Faraday's first law of electrolysis: the mass of a substance deposited or liberated at an electrode is proportional to the electric charge passed through the electrolyte. With constant current, charge is current times time, and the result also depends on the molar mass of the substance and on how many electrons its ions exchange in the electrode reaction."
