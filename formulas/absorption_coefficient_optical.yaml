description: "Relates the decadic absorbance measured for a uniform sample to the absorption coefficient, the quantity that measures how strongly a medium attenuates light per unit distance. Because absorbance is base-10 logarithmic while the absorption coefficient enters an exponential (base-e) attenuation law, the factor ln(10) ≈ 2.303 converts between the two. Assumes a homogeneous, non-scattering medium."
