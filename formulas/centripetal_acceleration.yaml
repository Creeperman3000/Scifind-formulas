description: "Magnitude of the acceleration of an object in uniform circular motion, directed toward the center of the circular path. It arises because the velocity's direction changes even while the speed stays constant, and it is perpendicular to the instantaneous velocity. Larger speeds and tighter turns demand greater centripetal acceleration."
equation: acceleration eq frac (velocity pow 2) length
