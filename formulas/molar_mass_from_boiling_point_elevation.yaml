description: Boiling-point elevation is a colligative property, so a measured rise in boiling point of a solvent (with a known ebullioscopic constant Kb) can be inverted to obtain the molar mass of a dissolved solute. The technique, called ebullioscopy, requires careful temperature measurement to avoid superheating and is used in classical molecular-weight determination.
