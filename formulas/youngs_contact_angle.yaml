description: "Young's equation relates the equilibrium contact angle of a liquid drop on a solid surface to the three interfacial surface tensions (solid-gas, solid-liquid, and liquid-gas). The contact angle quantifies the wettability of a surface; it applies to an ideal smooth, homogeneous, rigid surface in thermodynamic equilibrium."
equation: angle eq acos ((surface_tension sub surface_tension ) frac surface_tension sub surface_tension )
