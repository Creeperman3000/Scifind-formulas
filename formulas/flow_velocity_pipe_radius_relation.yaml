description: "For an incompressible fluid flowing through a pipe whose cross-section changes, mass conservation (the continuity equation) requires the product of cross-sectional area and flow speed to remain constant. For a circular pipe, this yields the relation between downstream and upstream velocities and the corresponding radii, and is the basis of the Venturi effect."
