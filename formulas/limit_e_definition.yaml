description: Euler's number e is defined as the limit of (1 + 1/n)^n as n approaches
  infinity, a value approximately equal to 2.71828. This limit arises naturally in
  compound interest when the compounding interval becomes infinitesimally small, and
  provides one of several equivalent characterizations of the natural exponential
  function.
