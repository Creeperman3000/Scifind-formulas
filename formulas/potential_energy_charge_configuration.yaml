description: "This is the electrostatic potential energy associated with bringing two point charges from infinite separation to a fixed distance apart, equal to the work an external agent must do against the repulsive (or attractive) Coulomb force. For a general configuration of N charges the total energy is one half the sum over all distinct pairs to avoid double counting."
