description: A convex mirror diverges light, so its focal point lies behind the reflecting
  surface. Under the real-is-positive sign convention this makes its focal length
  negative, with magnitude equal to half the radius of curvature. This sign matters
  when applying the mirror equation to locate virtual, upright, diminished images.
