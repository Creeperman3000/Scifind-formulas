description: "Newton's third law states that for every action there is an equal and opposite reaction: the force exerted by body 1 on body 2 is equal in magnitude and opposite in direction to the force exerted by body 2 on body 1. The two forces act on different bodies, so they do not cancel; the law is the microscopic origin of conservation of linear momentum."
