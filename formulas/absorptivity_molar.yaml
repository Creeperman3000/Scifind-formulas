description: Molar absorptivity (also called molar extinction or molar attenuation coefficient) measures how strongly a chemical species absorbs light of a given wavelength per molar concentration. It is characteristic of the species and wavelength, and underlies quantitative absorption spectroscopy, allowing unknown concentrations to be determined from measured absorbance. The Beer-Lambert relation assumes dilute, homogeneous solutions and monochromatic light.
