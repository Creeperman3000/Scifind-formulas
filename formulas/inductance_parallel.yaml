description: "For two non-coupled inductors connected in parallel, the equivalent inductance is the product of the individual inductances divided by their sum. This is the 'product over sum' rule and applies only when there is no mutual coupling between the coils; mutual inductance terms must be added when magnetic fields link the two inductors."
