description: "On a frictionless inclined plane making an angle θ with the horizontal, the component of the object's weight perpendicular to the surface is balanced by the normal force, giving N = mg cos θ. This relation is used together with the parallel component mg sin θ to analyze static and sliding motion on a slope."
equation: force eq mass mul (standard_gravity) mul cos angle
