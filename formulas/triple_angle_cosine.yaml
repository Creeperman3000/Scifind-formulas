description: "This triple-angle identity expresses the cosine of three times an angle as a polynomial in the cosine of that angle. It is derived from the angle-addition formulas and is the Chebyshev polynomial T_3 evaluated at cos θ. The identity is used in simplifying cubic expressions in cos θ and in solving trigonometric equations of degree three."
equation: cos (angle mul 3) eq 4 mul (cos angle pow 3) sub 3 mul cos angle
