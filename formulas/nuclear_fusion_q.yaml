description: The Q-value of a nuclear reaction is the energy released or absorbed, given by the mass difference between initial and final states times c². For fusion a positive Q means the reaction is exothermic, releasing energy when light nuclei combine into heavier ones.
equation: energy eq (mass add (mass) sub mass ) mul speed_of_light pow 2
