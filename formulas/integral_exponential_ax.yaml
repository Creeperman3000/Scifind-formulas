description: The antiderivative of e^(a x) for a constant nonzero coefficient a. It
  is most easily obtained via the substitution u = a x, after which the standard integral
  of e^u applies; a scaling factor 1/a then emerges from the differential du = a dx.
  This generalises the natural exponential rule to any constant scaling of the argument.
