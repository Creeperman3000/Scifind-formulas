description: "A charged capacitor stores electrical potential energy in the electric field between its plates; the amount grows with both the capacitance and the square of the voltage across it. This energy equals half the work done by the source during charging, since the capacitor voltage rises gradually from zero. It is used to size energy-storage elements, camera flash circuits, and defibrillators."
