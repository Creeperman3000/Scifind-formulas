description: In an octahedral transition-metal complex, the electrostatic field of
  six surrounding ligands splits the five d orbitals into a lower t2g set and a higher
  eg set. The octahedral crystal field splitting energy is the gap between these two
  sets; by convention it equals ten times the ligand-field parameter Dq. Its size
  relative to the pairing energy decides whether a complex is high-spin or low-spin
  and largely determines its color.
