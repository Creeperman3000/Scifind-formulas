description: "The self-inductance of an air-core solenoid (long, tightly wound helical coil) depends only on its geometry and the number of turns. Fringe effects are neglected and the magnetic field inside the coil is treated as uniform, so the inductance scales with the square of the turn count and the cross-sectional area, and inversely with the length."
