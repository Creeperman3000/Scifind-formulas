description: "Newton's second law states that the net force on a body equals its mass times its acceleration. It is the defining dynamical relation of Newtonian mechanics, applies in inertial reference frames, and reduces to the constant-mass form F = m a; for systems with changing mass the momentum form F = dp/dt is required."
