description: "When kinetic friction acts on a sliding object, mechanical energy is not conserved: the work done by friction is negative and removes energy from the system. Equivalently, the final mechanical energy equals the initial mechanical energy (kinetic plus potential) plus the work done by friction, illustrating the conversion of mechanical energy into heat via dissipative forces."
