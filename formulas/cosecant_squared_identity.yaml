description: This Pythagorean identity relates the square of the cosecant to the square
  of the cotangent. It follows from dividing the fundamental identity sin²θ + cos²θ
  = 1 by sin²θ and holds wherever both functions are defined (sin θ ≠ 0). It is frequently
  used to simplify trigonometric expressions and to evaluate integrals involving cosecant.
equation: ( ( 1 frac sin angle ) ) pow 2 eq 1 add ( cos angle frac sin angle ) pow 2
