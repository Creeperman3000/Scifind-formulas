description: The Born rule identifies the squared magnitude of a quantum-mechanical
  wave function as a probability density, so the integral of that density over all
  space must equal one. This normalization condition, together with the Schrodinger
  equation, fixes the allowed scale of the wave function and underpins the probabilistic
  interpretation of quantum mechanics.
