description: Expresses the sine of the difference of two angles in terms of the sines
  and cosines of the individual angles, with the same sign between terms as the sign
  between the angles. Valid for all real angles, it is one of the fundamental sum-and-difference
  identities and is used for exact-value computations and derivations throughout trigonometry
  and calculus.
equation: sin (angle sub angle) eq (sin angle mul cos angle) sub cos angle mul sin
  angle
