description: "The Bayes factor quantifies the relative evidence that observed data provide for one hypothesis or model over another, expressed as the ratio of their marginal likelihoods. It acts as the Bayesian alternative to the p-value in hypothesis testing and model comparison: values above 1 support the hypothesis in the numerator, values below 1 support the denominator hypothesis."
