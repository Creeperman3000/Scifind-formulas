description: Converts the difference of two cosines into a product, expressing it
  in terms of half-angle sines. The identity follows from the cosine addition and
  subtraction formulas and is useful for combining or simplifying trigonometric expressions
  and solving certain trigonometric equations.
equation: cos angle sub cos angle eq drop dimensionless mul (sin ((angle add angle)
  frac 2) mul sin ((angle sub angle) frac 2) ) sub
