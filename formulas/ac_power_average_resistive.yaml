description: "In a purely resistive AC circuit, voltage and current are in phase, so instantaneous power is always positive and oscillates at twice the line frequency. The average power delivered over a cycle equals half the product of the peak values, which is identical to using RMS values as in DC power calculations. This relation applies only to resistive loads; reactive elements contribute zero average power."
equation: power eq (current mul electric_potential) frac 2
symbol_overrides:
- power: P_{avg}
- current: I_0
- electric_potential: V_0
name_overrides:
- power: Average [power]
- current: Peak current
- electric_potential: Peak voltage
