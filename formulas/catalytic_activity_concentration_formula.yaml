description: "This quantity expresses how much catalytic power — most often enzyme activity — is present per unit volume of a system, and is the standard way of reporting enzyme levels in clinical chemistry. Its SI-coherent unit is the katal per litre, though enzyme units per litre are also common. Reported values depend on the assay conditions such as temperature, pH, and substrate, which should be stated alongside the result."
