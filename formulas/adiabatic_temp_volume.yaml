description: 'For a quasi-static adiabatic process (no heat exchange) of an ideal
  gas, the temperature and volume are not independent: the product of the temperature
  and the volume raised to the heat capacity ratio minus one stays constant along
  the process. It follows from combining the first law of thermodynamics with the
  ideal gas law and is used to find the temperature after an adiabatic compression
  or expansion.'
