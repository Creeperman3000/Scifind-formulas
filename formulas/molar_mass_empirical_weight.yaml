description: Once the empirical formula of a compound is known, multiplying its empirical formula weight (EFW) by an integer n gives the molar mass of the molecular compound. The integer n is the ratio of the molecular mass to the empirical formula mass, and is used to convert an empirical formula into the true molecular formula.
