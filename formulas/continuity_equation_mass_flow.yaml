description: "The mass of fluid crossing any cross-section of a stream tube per unit time is the same at every station along a steady flow, a direct statement of conservation of mass. Unlike the volume-based form, this version keeps the density explicit, so it applies to compressible gases as well as liquids. It is fundamental to nozzle, turbine, and duct analysis in aerodynamics and engineering."
