description: The angle of deviation is the angle between the original direction of
  an incident ray and its direction after reflection by a plane mirror. Because the
  law of reflection makes the angles of incidence and reflection equal, a single reflection
  turns the ray through this deviation, which is largest (a full reversal) at normal
  incidence and shrinks as the ray strikes more obliquely.
