description: "Gives the potential energy stored in a pair of point charges as a function of their separation, with zero taken at infinite separation. The sign follows the product of the charges: positive (repulsive) for like charges and negative (attractive) for opposite charges; summing over pairs extends it to systems of many charges."
equation: energy eq ( ( coulomb_constant mul charge mul charge ) frac length )
