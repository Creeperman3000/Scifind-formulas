description: The total mechanical energy of a bound two-body Keplerian orbit is negative
  and equal to minus the product of the gravitational constant, the two masses, divided
  by twice the semi-major axis. This constant combines the kinetic energy of orbital
  motion with the negative gravitational potential energy and is conserved throughout
  the orbit.
