description: 'The eccentricity measures how strongly an ellipse deviates from a circle,
  computed from its semi-major axis a and semi-minor axis b. It is a dimensionless
  number between 0 and 1: a circle has eccentricity 0, while values approaching 1
  indicate a long, thin ellipse. It is widely used in conic-section geometry and in
  orbital mechanics to characterize planetary and satellite orbits.'
