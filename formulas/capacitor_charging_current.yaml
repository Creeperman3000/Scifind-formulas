description: When an uncharged capacitor charges through a resistor from a constant
  voltage source, the current is largest the instant the switch closes and then decays
  exponentially toward zero, governed by the RC time constant. This relation is used
  to analyze transient response in RC circuits and in timing and filter applications.
  It assumes an ideal source, an initially uncharged capacitor, and negligible inductance.
equation: ((current) eq ((electric_potential frac resistance) mul (exp ((drop sub
  time) frac (resistance mul capacitance)))))
symbol_overrides:
- current: I(t)
