description: When only the masses of the components in a binary mixture are known,
  the mole fraction can be computed by converting each mass to moles through its molar
  mass, then taking the ratio of one component's moles to the total moles. This is
  the practical form used in laboratory work where balances measure mass rather than
  moles.
