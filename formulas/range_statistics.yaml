description: "The range is the simplest measure of statistical dispersion of a data set, defined as the difference between the largest and smallest observed values. Although it conveys only the extremes of the sample and is sensitive to outliers, it gives a quick sense of data spread in exploratory data analysis and is closely related to the distribution of order statistics."
