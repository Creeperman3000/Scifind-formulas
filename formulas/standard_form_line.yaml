description: "The standard form of a line expresses a linear equation in two variables as a sum of the variables each multiplied by a coefficient, equated to a constant, with at least one coefficient nonzero. It is convenient for quickly reading off the x- and y-intercepts and for solving systems of linear equations by elimination. Special cases include vertical and horizontal lines where one of the variable coefficients is zero."
