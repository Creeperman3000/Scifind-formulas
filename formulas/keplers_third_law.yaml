description: Kepler's third law states that the square of a planet's orbital period
  is proportional to the cube of the semi-major axis of its orbit. In its Newtonian
  form it relates the period to the mass of the central body and the gravitational
  constant, and underlies calculations of planetary and satellite orbits.
equation: time pow 2 eq ((2 mul pi) pow 2) mul ((length pow 3) frac gravitational_constant
  mul mass )
