description: The Lineweaver-Burk equation (double-reciprocal plot) is a linearized
  form of the Michaelis-Menten equation obtained by taking reciprocals. It is widely
  used to determine the Michaelis constant K_m and the limiting rate V_max graphically,
  although non-linear regression is now preferred for parameter estimation.
