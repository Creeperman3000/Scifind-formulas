description: "Torricelli's theorem states that the speed of fluid flowing out of an orifice equals the speed a body would attain in free fall from the same height above the orifice. It applies under the idealized conditions of an incompressible, non-viscous fluid and an orifice that is small compared to the container's cross-section, and is a special case of Bernoulli's principle."
