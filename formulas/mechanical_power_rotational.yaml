description: "For a rigid body rotating about a fixed axis, the instantaneous mechanical power delivered by a torque equals the scalar product of the torque and the angular velocity. This is the rotational analogue of the linear relation P = F·v and gives the rate at which rotational work is done on the shaft."
equation: power eq torque mul angular_velocity
