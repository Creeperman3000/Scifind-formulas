description: "Describes how the surface area of a flat solid plate increases when heated. For an isotropic material the coefficient of area expansion equals twice the linear expansion coefficient, so the change in area can be computed directly from tabulated linear values. The relation is an approximation valid for small temperature changes."
equation: area eq (coefficient_of_linear_expansion mul 2) mul area mul Delta temperature
