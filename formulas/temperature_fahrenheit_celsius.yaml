description: Linear conversion between temperatures expressed on the Fahrenheit and
  Celsius scales. The Fahrenheit value is first shifted by −32 to align the two scales'
  zero points, then scaled by 5/9 to convert from Fahrenheit-sized to Celsius-sized
  degrees.
equation: temperature eq (temperature sub 32) mul 5 frac 9
symbol_overrides:
- temperature: °C
- temperature: °F
name_overrides:
- temperature: '[temperature] in Celsius'
- temperature: '[temperature] in Fahrenheit'
