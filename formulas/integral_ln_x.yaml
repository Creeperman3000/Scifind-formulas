description: The antiderivative of the natural logarithm ln(x). It is typically derived
  by integration by parts, choosing u = ln(x) and dv = dx, which yields x ln(x) -
  x plus an arbitrary constant. The result is the standard starting point for many
  integrals involving logarithmic factors.
