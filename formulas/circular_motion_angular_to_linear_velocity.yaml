description: "Relates the tangential (linear) speed of a point moving on a circular path to how fast the angle is swept, through the radius of the path. The linear speed grows in proportion to both the rotation rate and the distance from the axis. It assumes the point stays at a fixed radius and the angle is measured in radians."
