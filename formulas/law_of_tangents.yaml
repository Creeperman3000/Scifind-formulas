description: "The law of tangents relates the tangent of half the sum and difference of two angles of a triangle to the corresponding opposite side lengths. Historically useful before calculators for solving triangles from two sides and the included angle, since it avoids the square root needed by the law of cosines and offers better numerical stability when two sides are nearly equal."
equation: (length sub length ) frac length add length eq tan ((angle sub angle ) frac 2) frac tan ((angle add angle ) frac 2)
