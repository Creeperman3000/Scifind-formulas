description: "Efficiency measures how well a device or process converts input energy into useful output, expressed as a dimensionless ratio between zero and one (often quoted as a percentage). Because real machines inevitably dissipate some energy as heat, sound, or other waste forms, no real device can reach perfect efficiency; the concept is central to comparing engines, motors, and power systems."
