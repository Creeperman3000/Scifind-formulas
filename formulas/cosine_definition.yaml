description: "In a right triangle, the cosine of an acute angle is defined as the ratio of the length of the side adjacent to that angle to the length of the hypotenuse. This ratio depends only on the angle, not on the triangle's size, which makes it the basis for solving right triangles. It is the 'CAH' part of the SOH-CAH-TOA mnemonic."
