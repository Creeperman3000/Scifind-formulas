description: Parts per billion (ppb) is a dimensionless quantity expressing a mass
  (or mole) ratio as a fraction of 10⁻⁹. It is commonly used to report trace concentrations
  of dissolved substances, pollutants, or impurities, with the ratio of solute mass
  to total solution mass multiplied by 10⁹.
