description: The factorial of a non-negative integer n is the product of all positive
  integers less than or equal to n, with the empty product for n=0 defined as 1 by
  convention. Factorials count permutations of n distinct objects, underlie the binomial
  coefficients, and admit a continuous extension to the gamma function for non-integer
  arguments.
