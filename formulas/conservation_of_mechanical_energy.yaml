description: "The total mechanical energy of a system — kinetic plus potential — remains constant between two states when only conservative forces (gravity, spring forces) do work. Energy may shift form, but none is lost to friction or drag. This principle is the workhorse of mechanics problems such as falling bodies, pendulums, and roller coasters, where it relates speeds to heights without needing force details."
