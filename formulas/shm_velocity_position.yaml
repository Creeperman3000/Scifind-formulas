description: "Relates the speed of a simple harmonic oscillator to its current position, derived from energy conservation (kinetic plus potential equals the total mechanical energy set by the amplitude). The expression under the square root vanishes at the turning points where the speed is zero, and reaches its maximum at the equilibrium position where displacement vanishes."
equation: velocity eq angular_velocity mul ( ( ( length pow 2 ) sub length pow 2 ) sqrt 2 )
symbol_overrides:
  - angular_velocity: ω
  - length: A
  - length: x
  - velocity: ''
name_overrides:
