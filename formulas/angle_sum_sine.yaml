description: "This trigonometric identity, known as the sine addition formula, expresses the sine of a compound angle as a combination of the sines and cosines of its two component angles. It holds for all real angles and is used to evaluate sines of angles not on the unit circle, and to derive double-angle and product-to-sum formulas."
