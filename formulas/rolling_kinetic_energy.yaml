description: The total kinetic energy of a rigid body rolling without slipping is the sum of its translational kinetic energy (motion of the center of mass) and its rotational kinetic energy (spin about that center). The pure-rolling constraint v_cm = rω links the two terms, and the combined expression is widely used in analyzing wheels, cylinders, and spheres.
equation: energy eq (mass mul (velocity pow 2) frac 2) add moment_of_inertia mul (angular_velocity pow 2) frac 2
symbol_overrides:
