description: The antiderivative of the reciprocal function 1/x. Unlike most power
  functions, x^n integrates to x^(n+1)/(n+1), but the case n = -1 must be treated
  separately, yielding the natural logarithm. The absolute value is required so the
  result is valid on both sides of the singularity at x = 0.
