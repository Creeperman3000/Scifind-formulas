description: Volume of a right circular conical frustum with parallel circular bases
  of radii and perpendicular height. The formula follows from subtracting the small
  cone removed at the apex from the full cone. It is one of the oldest known volume
  formulas, appearing in the ancient Egyptian Moscow Mathematical Papyrus.
equation: volume eq (pi mul length) mul ((length pow 2) add (length mul length) add
  length pow 2 ) frac 3
