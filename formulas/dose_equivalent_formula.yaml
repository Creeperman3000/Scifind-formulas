description: "Dose (equivalent) is a radiation-protection quantity that scales the absorbed dose by a weighting factor accounting for how biologically damaging the radiation type is; photons and electrons have a factor of one while alpha particles have about twenty. It is measured in sieverts (Sv) and is used to compare the stochastic biological risk of different radiation exposures. Strictly, the ICRP applies this weighting when averaging over an organ or tissue."
