description: "Measures how efficiently a refrigerator moves heat, defined as the heat removed from the cold space per unit of net work supplied to the cycle, typically by the compressor. Unlike a heat-engine efficiency it can exceed one, since it compares useful heat moved rather than converted energy. Real values depend strongly on the temperature difference between reservoirs."
