description: "The difference in electronegativity between two bonded atoms gauges how unevenly the bonding electrons are shared and helps classify the bond. A near-zero difference indicates a nonpolar covalent bond, an intermediate value a polar covalent bond, and a large difference (roughly above 1.8-2.0 on the Pauling scale) an ionic bond. It is a rule of thumb, not an exact criterion."
