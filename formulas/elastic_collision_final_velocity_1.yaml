description: Gives the post-collision velocity of the first object in a head-on, perfectly
  elastic one-dimensional collision between two bodies, in terms of both initial velocities
  and the two masses. It follows from solving conservation of momentum together with
  conservation of kinetic energy, and it correctly reproduces limiting cases such
  as equal-mass objects exchanging velocities.
