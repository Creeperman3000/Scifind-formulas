description: 'Formal charge is a bookkeeping tool for evaluating Lewis structures:
  it assigns to each atom a hypothetical charge equal to its group valence electrons
  minus the electrons assigned to it in the structure (its lone-pair electrons plus
  half of its bonding electrons). Structures whose atoms have formal charges closest
  to zero are typically the best representation of the molecule.'
