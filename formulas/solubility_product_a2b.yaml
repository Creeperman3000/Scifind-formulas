description: "The solubility product K_sp expresses the equilibrium between a sparingly soluble ionic salt and its saturated solution, written as the product of the dissolved ion concentrations each raised to the power of its stoichiometric coefficient in the dissociation reaction. For a salt of stoichiometry A₂B that dissociates into 2 A ions and 1 B ion, K_sp governs solubility and the common-ion effect."
equation: dimensionless eq (concentration pow 2) mul concentration
