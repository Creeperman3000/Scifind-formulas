description: "The thermodynamic definition of temperature arises from the second law of thermodynamics and is grounded in the Carnot cycle. In differential form, 1/T equals the partial derivative of entropy with respect to internal energy at constant volume and particle number; the discrete ratio shown here is a useful approximation for finite reversible heat transfers and entropy changes."
