description: "Average velocity is defined as the displacement of an object divided by the elapsed time during which that displacement occurs. It is a vector, so it carries direction and can be negative or zero even when motion occurred; it differs from average speed, which uses total path distance."
equation: velocity eq length frac time
symbol_overrides:
- velocity: v_{avg}
- length: \Delta x
- time: \Delta t
