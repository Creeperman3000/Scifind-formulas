description: "Dalton's law states that the total pressure exerted by a mixture of non-reacting gases equals the sum of the partial pressures of its components, where each partial pressure is what that gas would exert if it occupied the container alone. It follows from the ideal gas model, in which gas molecules act independently, and is used to analyze gas mixtures such as air and collected-over-water gas samples."
