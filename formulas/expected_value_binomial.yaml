description: "The mean (expected value) of a binomial random variable, i.e. the average number of successes expected in a fixed number of independent yes/no trials with a constant success probability. It follows from linearity of expectation applied to the sum of the individual Bernoulli trials, and is used to find average outcomes in repeated-trial experiments."
