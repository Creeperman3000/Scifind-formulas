description: "Measures how efficiently a heat pump delivers heating, defined as the useful heat supplied to the warm space per unit of net work put into the cycle. Because the device moves existing thermal energy rather than generating it, this ratio can exceed one and is largest when the two reservoir temperatures are close. It is bounded above by the Carnot limit set by those temperatures."
