description: "The Born rule links the quantum wavefunction to measurable outcomes: the probability density for finding a particle at a given position equals the squared magnitude of the normalized wavefunction at that point. It was formulated by Max Born in 1926 and underlies nearly all probabilistic predictions of quantum mechanics."
