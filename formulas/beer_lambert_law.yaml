description: "The Beer-Lambert law states that the absorbance of monochromatic light by a solution is directly proportional to the concentration of the absorbing species and the optical path length through the sample. It is the basis of quantitative spectrophotometry and colorimetric analysis. The linear relation holds for dilute, homogeneous, non-scattering samples and breaks down at high concentrations."
equation: absorbance eq molar_absorptivity mul (concentration) mul length
