description: When two point charges interact inside an insulating (dielectric) material,
  the surrounding medium polarizes and weakens their mutual electrostatic force. The
  force is reduced relative to vacuum by the medium's relative permittivity (dielectric
  constant). This form of Coulomb's law applies to point charges at rest in a homogeneous,
  linear dielectric.
