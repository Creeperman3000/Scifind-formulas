description: "Angular frequency measures how quickly a periodic process advances through its cycle, expressed as an angle covered per unit time in radians per second rather than cycles per second. It is used throughout oscillation, wave, and circular-motion analysis because sinusoidal expressions become compact when written in terms of it."
equation: angular_velocity eq (pi mul 2) mul frequency
