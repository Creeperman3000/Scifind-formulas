description: 'One of Vieta''s formulas: for the quadratic ax²+bx+c=0 with leading
  coefficient a ≠ 0, the sum of its two roots equals −b/a. Combined with the product-of-roots
  formula, this lets the quadratic be reconstructed from its roots without solving
  it.'
