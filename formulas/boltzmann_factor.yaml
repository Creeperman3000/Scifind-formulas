description: 'Gives the relative probability that a system in thermal equilibrium
  at a given temperature occupies a state of a given energy: states of higher energy
  are exponentially less populated. This unnormalized weight is the building block
  of the Boltzmann distribution and the partition function in statistical mechanics.'
