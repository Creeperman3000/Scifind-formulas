description: "The f-number (also called focal ratio or f-stop) of a lens is the dimensionless ratio of its focal length to the diameter of its entrance pupil. A lower f-number means a wider aperture that admits more light, while a higher f-number gives a smaller aperture, greater depth of field, and more diffraction."
