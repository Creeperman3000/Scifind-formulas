description: "Locates the center of mass of a system of particles along the x-axis as the mass-weighted average of the particles' x-coordinates. Each particle contributes in proportion to its share of the total mass, so the point lies closer to the heavier particles. This coordinate is used to reduce a multi-particle system to a single equivalent point for dynamics and collision problems."
