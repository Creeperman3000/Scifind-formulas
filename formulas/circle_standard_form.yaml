description: "The standard (center-radius) form of a circle's equation states that a point lies on the circle exactly when its squared horizontal and vertical offsets from the center sum to the squared radius. It follows from the Pythagorean theorem applied to the distance from the center to any point on the circle. Reading off the center and radius from this form is the usual first step for graphing a circle or converting from its expanded equation."
