description: "The Nernst equation relates the reduction potential of an electrochemical half-cell or full cell to its standard electrode potential, temperature, number of transferred electrons, and the activities of the chemical species. It is fundamental to electrochemistry, governing how cell potentials shift away from standard conditions."
