description: The Stefan-Boltzmann law gives the thermal radiation power emitted by
  a surface of area A and emissivity ε as the product of ε, the Stefan-Boltzmann constant
  σ, the area, and the absolute temperature raised to the fourth power. It applies
  to grey bodies in local thermodynamic equilibrium, where emissivity captures the
  deviation from ideal black-body behavior.
