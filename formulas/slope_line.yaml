description: The slope of a line in the Cartesian plane is the ratio of its vertical
  change to its horizontal change between any two distinct points on the line. It
  is commonly denoted m and equals the tangent of the angle the line makes with the
  positive x-axis; horizontal lines have slope 0 and vertical lines have undefined
  slope.
