description: "The volume enclosed by a sphere of radius r is four-thirds times pi times the cube of the radius. Archimedes first derived this result by showing that the volume of a sphere equals two-thirds the volume of its circumscribing cylinder. It is equivalent to the volume obtained by integrating circular cross-sections from one pole to the other."
