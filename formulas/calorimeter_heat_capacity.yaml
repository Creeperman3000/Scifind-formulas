description: "The calorimeter constant is the amount of heat needed to raise the temperature of the entire calorimeter (hardware plus contents) by one degree, with units of energy per degree. It is determined by calibration, e.g. by adding a known quantity of heat and measuring the resulting temperature rise, and it corrects measured heat flows for heat absorbed by the apparatus itself."
