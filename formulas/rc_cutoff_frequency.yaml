description: "For a first-order RC filter, the cutoff (or corner) frequency is the frequency at which the output power falls to half its passband value, corresponding to a -3 dB gain. It is the reciprocal of the time constant and marks the boundary between a filter's passband and transition band."
equation: frequency eq 1 frac ((2 mul pi) mul resistance mul capacitance )
