description: "Kinetic theory shows that the mean translational kinetic energy of a single molecule in an ideal gas is fixed solely by the absolute temperature, with each of the three translational degrees of freedom contributing half of Boltzmann constant times temperature (equipartition). Notably it does not depend on the molecule's mass or identity."
