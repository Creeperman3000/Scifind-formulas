description: For a process at constant pressure and constant temperature, the heat
  absorbed by the surroundings equals the enthalpy change the system releases, so
  the surroundings' entropy change follows directly from tabulated reaction enthalpies.
  This relation is the bridge used to derive the Gibbs free energy spontaneity criterion.
