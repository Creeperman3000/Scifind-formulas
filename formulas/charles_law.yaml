description: "Charles's law (the law of volumes) states that for a fixed amount of gas held at constant pressure, the volume is directly proportional to the absolute temperature. The two-state form lets you predict how a gas sample's volume changes between an initial and a final temperature. Temperatures must be expressed in kelvin, and the law holds only approximately for real gases."
