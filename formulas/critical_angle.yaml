description: "The critical angle is the angle of incidence, measured from the normal, at which the refracted ray grazes along the boundary between two media. At incidence angles above it, light is completely reflected back into the incident medium (total internal reflection), which only occurs going from an optically denser to a rarer medium; this principle underlies optical fibers and prism binoculars."
