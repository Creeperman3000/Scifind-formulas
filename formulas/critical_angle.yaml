name: Critical angle for total internal reflection
id: critical_angle
topic: refraction
difficulty: 6
links:
  - https://en.wikipedia.org/wiki/Total_internal_reflection
  - https://phys.libretexts.org/Bookshelves/College_Physics/College_Physics_1e_%28OpenStax%29/25%3A_Geometric_Optics/25.04%3A_Total_Internal_Reflection
