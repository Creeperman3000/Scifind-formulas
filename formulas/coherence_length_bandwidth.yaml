description: "The coherence length is the propagation distance over which a light wave maintains a fixed phase relationship with itself. It is inversely proportional to the source's spectral bandwidth, so narrow-linewidth lasers stay coherent over kilometers while broadband sources such as LEDs lose coherence within micrometers. This relation sets the maximum path-length difference usable in interferometry, coherent communications, and OCT imaging."
