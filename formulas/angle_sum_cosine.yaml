description: Expresses the cosine of the sum of two angles in terms of the sines and
  cosines of the individual angles, with a minus sign between the terms that is opposite
  to the plus sign between the angles. Valid for all real angles, this fundamental
  identity underlies exact-value calculations, wave addition, and derivations of the
  other sum-and-difference formulas.
equation: cos (angle add angle) eq (cos angle mul cos angle) sub sin angle mul sin
  angle
