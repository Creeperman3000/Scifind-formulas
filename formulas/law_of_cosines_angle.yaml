description: This rearrangement of the law of cosines solves for an unknown angle
  of a triangle when all three side lengths are known. Taking the inverse cosine of
  the rearranged expression avoids the angle ambiguity that arises when using the
  law of sines, since cosine distinguishes acute from obtuse angles by sign.
equation: angle eq acos (((length pow 2) add (length pow 2) sub length pow 2 ) frac
  2 mul length mul length )
