description: 'The power rule for integration: the antiderivative of x^n is x^(n+1)/(n+1),
  valid for any real n except n = -1 (which is handled by the logarithm rule). The
  exponent is increased by one and the result is divided by the new exponent. Combined
  with the constant multiple and sum rules, it lets one integrate any polynomial.'
