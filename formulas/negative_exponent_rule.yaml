description: The negative exponent rule states that any nonzero base raised to a negative
  integer power equals the reciprocal of that base raised to the corresponding positive
  power. It is a defining identity that extends exponentiation beyond non-negative
  integers and is consistent with the multiplication rule b^m · b^n = b^(m+n).
