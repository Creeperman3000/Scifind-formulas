description: The second-order linear differential equation governing undamped simple
  harmonic motion. Its solutions are sinusoidal with angular frequency equal to the
  coefficient under the square root of the restoring-force-to-mass ratio, and it is
  the limiting case of the damped harmonic oscillator when the damping coefficient
  vanishes.
equation: frac rmd rmd dimensionless (rmd time pow 2) add (angular_velocity pow 2)
  mul dimensionless eq 0
