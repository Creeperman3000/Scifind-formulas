description: "The stopping (or cut-off) potential is the retarding voltage at which the photoelectric current vanishes, equal to the maximum kinetic energy of the emitted photoelectrons divided by the elementary charge. It is the experimental quantity used in Millikan-type tests of Einstein's photoelectric law and provides a direct measure of the work function when the light frequency is known."
