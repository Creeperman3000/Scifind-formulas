description: 'Newton''s law of universal gravitation gives the attractive force between
  two masses as a central force: its magnitude depends only on the separation and
  it always acts along the line joining the two centers of mass. It applies exactly
  to point masses (and spherically symmetric bodies) and governs satellite and planetary
  orbits. The force is attractive, mutual, and weakens with the square of the distance.'
