description: The signal-to-noise ratio compares the level of a desired signal to the
  level of background noise in a measurement or transmission channel. It is a key
  figure of merit in communications, imaging, spectroscopy, and audio engineering,
  and is often quoted in decibels; the Shannon–Hartley theorem sets the maximum reliable
  data rate over a channel as a function of bandwidth and SNR.
