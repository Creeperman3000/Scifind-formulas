description: "Elastic potential energy is the energy stored in a deformed elastic object such as a stretched or compressed spring. It equals the work done to produce the deformation and is fully recoverable when the object returns to its undeformed shape, provided the deformation stays within the linear (Hooke's law) regime. It is used in energy conservation problems involving springs, strings, and other elastic elements."
