description: "Flux linkage is the total magnetic flux linked with a coil of N turns, assuming the same flux passes through every turn. Since each turn contributes its own flux, the linkage grows in proportion to the number of turns; it is this quantity whose rate of change determines the induced EMF in a coil under Faraday's law."
