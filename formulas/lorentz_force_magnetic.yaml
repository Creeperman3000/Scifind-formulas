description: "The magnitude of the force on a charge q moving with velocity v through a magnetic field B, equal to qvB sinθ where θ is the angle between v and B. The force is always perpendicular to both v and B, does no work, and produces circular or helical motion in uniform fields."
equation: force eq charge mul (velocity) mul (magnetic_flux_density) mul sin angle
