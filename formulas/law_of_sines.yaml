description: The law of sines relates the side lengths of a triangle to the sines
  of their opposite angles. It is used for triangulation when two angles and a side
  (AAS/ASA) or two sides and a non-included angle (the ambiguous SSA case) are known,
  and the common ratio equals the diameter of the triangle's circumscribed circle.
