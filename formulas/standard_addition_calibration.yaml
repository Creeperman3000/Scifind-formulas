description: "The standard addition (known addition) method determines an unknown analyte concentration by spiking the sample with a known quantity of the analyte. For a single-point addition, the unknown concentration is recovered from the ratio of the unspiked signal, the spiked signal, and the concentration of the standard added. The technique minimizes matrix-effect bias by ensuring the calibration standards experience the same matrix as the unknown."
