description: "In ideal projectile motion under constant gravitational acceleration, the vertical component of velocity decreases linearly with time because gravity acts only along the vertical direction. The horizontal component remains constant, while the vertical component determines when the projectile reaches its peak and returns to launch height."
equation: velocity eq velocity mul (sin angle ) sub acceleration mul time
