description: The binomial probability mass function gives the probability of observing
  exactly a specified number of successes in a fixed number of independent trials,
  each with the same success probability and only two possible outcomes. It applies
  when the trials are binary, independent, fixed in number, and identically distributed
  (the BINS conditions), and is used in quality control, survey sampling, and genetics.
