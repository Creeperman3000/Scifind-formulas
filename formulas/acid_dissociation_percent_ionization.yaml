description: Percent ionization expresses what fraction of a weak acid's molecules
  have dissociated into ions at equilibrium, stated as a percentage. Unlike the ionization
  constant, it depends on how concentrated the solution is, generally decreasing as
  the solution becomes more concentrated and increasing upon dilution. It provides
  an intuitive measure of acid strength in a given solution.
