description: 'Describes the standard single-tone amplitude-modulated signal: the envelope
  of a high-frequency carrier wave varies in proportion to a lower-frequency message
  signal, with the modulation index controlling the depth of that variation. It is
  the basic model of AM radio transmission and is used to analyze carrier and sideband
  content; overmodulation occurs when the index exceeds one.'
