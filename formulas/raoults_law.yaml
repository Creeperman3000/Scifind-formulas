description: "Raoult's law states that the partial vapor pressure of each component of an ideal solution is equal to the vapor pressure of the pure component multiplied by its mole fraction. It serves as the defining characteristic of an ideal solution and provides the basis for understanding vapor–liquid equilibrium, distillation, and the colligative lowering of vapor pressure when a nonvolatile solute is dissolved in a solvent."
