description: "This gives the capacitance of a parallel-plate capacitor whose gap is completely filled by an insulating dielectric material: larger plate area and higher relative permittivity raise the capacitance, while wider plate separation lowers it. The formula neglects edge effects, so it is accurate when the plates are close together compared with their size."
