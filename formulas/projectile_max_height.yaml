description: The maximum height reached by a projectile occurs when the vertical component
  of its velocity becomes zero. It depends on the initial speed, the launch angle,
  and the local gravitational acceleration, and is independent of the projectile's
  mass. Applies in the idealized case of no air resistance and uniform gravity.
equation: length eq (velocity pow 2) mul (sin angle pow 2) frac 2 mul standard_gravity
symbol_overrides:
- length: h_{max}
- velocity: v_0
- angle: θ
