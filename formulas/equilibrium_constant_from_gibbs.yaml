description: "Relates the thermodynamic spontaneity of a reaction to its equilibrium position: the standard Gibbs free energy change determines how far a reaction proceeds toward products at equilibrium. A negative standard free energy change gives an equilibrium constant greater than one (products favored), while a positive value gives less than one. Assumes standard-state free energy data and ideal behavior at the given absolute temperature."
