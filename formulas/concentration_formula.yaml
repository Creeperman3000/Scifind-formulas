description: "Molar concentration (molarity) quantifies how much solute is dissolved in a given volume of solution. It is the central quantity for solution stoichiometry, allowing conversion between moles of reactants/products and measurable solution volumes. It assumes a homogeneous solution and is usually reported in mol/L (molar, M)."
