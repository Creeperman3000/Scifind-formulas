description: "The magnetic component of the Lorentz force is the sideways force experienced by a moving charge in a magnetic field, perpendicular to both the velocity and the field. It is responsible for circular and helical motion of charged particles in magnetic fields and underlies devices such as cyclotrons and mass spectrometers."
