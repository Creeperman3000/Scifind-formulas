description: "Specific rotation is an intensive property of a chiral compound that quantifies how much plane-polarized light is rotated per unit path length and per unit concentration. It is reported in units of deg·mL·g⁻¹·dm⁻¹ and depends on the wavelength, temperature, and solvent of the measurement."
