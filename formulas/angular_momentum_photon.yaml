description: Each photon carries an intrinsic (spin) angular momentum whose magnitude
  is one reduced quantum of action, with sign set by its circular polarization (helicity).
  This quantized value underlies phenomena such as optical torque on birefringent
  particles and spin-to-orbital angular momentum conversion.
