description: "The molar gas constant is the Avogadro constant multiplied by the Boltzmann constant. It converts between the per-particle energy scale of statistical mechanics and the per-mole energy scale used in macroscopic thermodynamics and chemistry, appearing in the ideal gas law and many other fundamental equations."
