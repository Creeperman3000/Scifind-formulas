description: "The coefficient of performance (COP) of a refrigerator is the ratio of the heat removed from the cold reservoir to the net work input to the refrigerator. By the first law of thermodynamics, the work input equals the heat rejected to the hot reservoir minus the heat absorbed from the cold reservoir, so the COP can equivalently be written as the cold-reservoir heat divided by that difference. COP values greater than one are common because refrigeration requires moving heat rather than generating it."
