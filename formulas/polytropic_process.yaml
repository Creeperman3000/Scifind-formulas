description: "A polytropic process is a thermodynamic expansion or compression of a gas that obeys PV^n = constant, where n is the polytropic index. It unifies the standard ideal-gas processes as special cases: isobaric (n=0), isothermal (n=1), isentropic (n=γ), and isochoric (n→∞)."
