description: "The impedance of a series combination of a resistor and a capacitor is the magnitude of the vector sum of the resistance and the (negative) capacitive reactance. This expression governs the magnitude of the AC current drawn from the source and underlies the cutoff frequency of an RC filter."
equation: resistance eq ( ( resistance pow 2 add resistance pow 2 ) sqrt 2 )
