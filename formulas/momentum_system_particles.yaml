description: "The total linear momentum of a system of particles equals the vector sum of the individual particle momenta, each computed as the product of mass and velocity. This result is the basis for the conservation of total momentum in isolated systems and connects the system momentum directly to the motion of the center of mass. It applies to any collection of particles, whether or not internal forces act between them."
