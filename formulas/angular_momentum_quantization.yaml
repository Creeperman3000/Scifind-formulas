description: 'In quantum mechanics the orbital angular momentum of a particle (such
  as an electron in an atom) is quantized: its magnitude can only take discrete values
  determined by the azimuthal quantum number l. This result explains the shapes of
  atomic orbitals and underlies selection rules in atomic spectroscopy.'
