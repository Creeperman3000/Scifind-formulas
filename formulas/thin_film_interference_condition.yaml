description: General condition for constructive interference in a thin film at normal
  incidence when the reflections at both film boundaries undergo equal phase shifts
  (or no net phase shift). The optical path difference between light reflected from
  the top and bottom surfaces must equal an integer multiple of the wavelength in
  vacuum.
