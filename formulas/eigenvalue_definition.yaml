description: "The defining relation of the eigenvalue problem: an eigenvector of a square matrix is a nonzero vector whose direction is unchanged when the matrix is applied to it, being merely stretched or shrunk by a scalar factor called the eigenvalue. Finding these pairs underlies matrix diagonalization and applications from vibration analysis and stability theory to quantum mechanics."
