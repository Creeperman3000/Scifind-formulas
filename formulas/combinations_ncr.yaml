description: The binomial coefficient, or n choose r, counts how many distinct subsets
  of r items can be selected from a set of n distinguishable items when the order
  of selection does not matter. It is central to combinatorics and probability, appearing
  in counting arguments, lottery odds, and the binomial theorem, and applies for whole
  numbers with zero up to r equal to n without repetition.
