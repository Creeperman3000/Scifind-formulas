description: 'The power rule is the workhorse of differentiation: to differentiate
  a variable raised to a constant exponent, bring the exponent down as a factor and
  reduce the exponent by one. It holds for any real exponent, including negative and
  fractional values, wherever the resulting expression is defined.'
