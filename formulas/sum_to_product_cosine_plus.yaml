description: Converts the sum of two cosines into a product, expressed in terms of
  half-angle cosines. The identity follows from the cosine addition and subtraction
  formulas and is useful for combining or simplifying trigonometric expressions and
  solving certain trigonometric equations.
equation: cos angle add cos angle eq dimensionless mul (cos ((angle add angle) frac
  2) mul cos ((angle sub angle) frac 2) )
