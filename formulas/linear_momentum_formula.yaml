description: "Linear momentum is the product of an object's mass and its velocity, defined for a single particle in classical mechanics. It is a vector quantity that points in the direction of motion and is central to Newton's second law, where the net force equals the time derivative of momentum."
equation: momentum eq mass mul velocity
