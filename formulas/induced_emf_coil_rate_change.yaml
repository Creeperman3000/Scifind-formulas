description: Faraday's flux rule (Faraday-Lenz law) states that the electromotive
  force induced in a closed conducting loop equals the negative time-rate-of-change
  of the magnetic flux through the loop. The negative sign (Lenz's law) ensures the
  induced emf opposes the change that produced it.
