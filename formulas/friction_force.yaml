description: "The Coulomb/Amontons friction law relates the magnitude of dry friction to the normal force pressing two surfaces together via an empirical coefficient of friction. For kinetic (sliding) friction the magnitude is approximately constant and independent of the apparent contact area and sliding speed, in the simple Amontons-Coulomb model."
