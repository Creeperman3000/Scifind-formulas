description: "Henry's law states that at constant temperature, the amount (or concentration) of a dissolved gas in a liquid is directly proportional to the partial pressure of that gas above the liquid. The proportionality factor is Henry's law constant, which depends on the gas, the solvent, and the temperature. The relation holds only for dilute solutions and gases that do not react chemically with the solvent; it underlies gas-solubility phenomena from carbonated beverages to decompression sickness in divers."
