description: Newton's law of cooling states that the rate of heat loss of a body is
  proportional to the temperature difference between the body and its surroundings.
  The proportionality constant is the heat transfer coefficient, and the law is most
  accurate for forced convection, conduction, and small temperature differences; it
  fails for buoyancy-driven convection and thermal radiation, which require a fourth-power
  (Stefan–Boltzmann) treatment.
