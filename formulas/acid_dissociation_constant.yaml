description: "The acid dissociation constant Ka quantifies the strength of a weak acid HA in water, where HA partially dissociates into a proton and its conjugate base. A larger Ka means the equilibrium lies further toward the products, i.e. a stronger acid; values are commonly reported on the logarithmic pKa scale. Strictly it should be written with activities rather than concentrations and depends on temperature and ionic strength."
