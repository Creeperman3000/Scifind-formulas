description: "The thrust generated by a rocket equals the rate at which propellant mass is expelled multiplied by the exhaust velocity relative to the vehicle, a direct consequence of Newton's third law. The simplified form omits a pressure-thrust correction term and assumes optimal expansion of the exhaust."
equation: force eq density mul velocity
