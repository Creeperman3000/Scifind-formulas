description: "Enantiomeric excess quantifies the optical purity of a chiral mixture by expressing how much one enantiomer outweighs its mirror image, as a percentage of the total. It runs from zero for a racemic mixture to one hundred percent for a pure enantiomer. The quantities used may be moles, concentrations, percentages, or chromatographic peak areas, provided both are in the same units."
