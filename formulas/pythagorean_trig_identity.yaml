description: "The Pythagorean identity states that for any real angle, the sum of the squares of its sine and cosine equals one. It follows directly from the unit-circle equation x² + y² = 1, since (cos θ, sin θ) is a point on that circle. This identity is the foundation for the angle-addition formulas, the double- and half-angle identities, and many calculus simplifications."
