description: "In a right triangle, the tangent of an acute angle is the ratio of the length of the side opposite that angle to the length of the side adjacent to it (and not the hypotenuse). This right-triangle definition is the most elementary one and underpins the standard mnemonic SOH-CAH-TOA used in trigonometry."
