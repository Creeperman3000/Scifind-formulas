description: "Gives the electric field of a thin, infinitely extended sheet carrying uniform surface charge density, directed perpendicular to the sheet and away from it if positively charged. A key result of Gauss's law is that this field is uniform, with a magnitude independent of the distance from the sheet; it also underlies the parallel-plate capacitor field."
