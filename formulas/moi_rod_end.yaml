description: "The moment of inertia of a thin uniform rod of length L and mass m about an axis through one of its ends and perpendicular to the rod gives the rotational analog of mass for pivoting about that endpoint. The result scales with the square of the length because mass farther from the pivot contributes more to rotational inertia."
equation: moment_of_inertia eq mass mul (length pow 2) frac 3
symbol_overrides:
- mass: M
- length: L
- moment_of_inertia: ''
