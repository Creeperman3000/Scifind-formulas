description: "This condition locates the principal maxima produced when monochromatic light hits a diffraction grating at normal incidence: bright orders appear where the path difference between adjacent slits is a whole number of wavelengths. It is the working equation of grating spectrometers, used to measure wavelengths and analyze spectra, and assumes plane waves and slits much smaller than the distance to the observer."
