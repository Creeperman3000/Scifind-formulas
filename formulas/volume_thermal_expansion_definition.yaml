description: For a solid undergoing a small temperature change, the new volume equals
  the initial volume times one plus three times the linear expansion coefficient times
  the change in temperature. This expansion is an isotropic volume change that reflects
  the cumulative effect of linear expansion in three independent directions.
equation: volume eq volume mul 1 add 3 mul (coefficient_of_linear_expansion) mul temperature
  sub temperature
