name: 'Bernoulli: pressure-velocity relation (horizontal)'
id: bernoulli_pressure_velocity_horizontal
topic: bernoulli_equation
difficulty: 7
links:
- https://en.wikipedia.org/wiki/Bernoulli%27s_principle
- https://phys.libretexts.org/Bookshelves/College_Physics/College_Physics_1e_(OpenStax)/12%3A_Fluid_Dynamics_and_Its_Biological_and_Medical_Applications/12.02%3A_Bernoullis_Equation
- https://www.engineeringtoolbox.com/bernouilli-equation-d_183.html
description: 'For steady, inviscid, incompressible flow along a horizontal streamline,
  this rearranged form of Bernoulli''s equation links the static-pressure drop between
  two points to the increase in flow speed between them. It quantifies Bernoulli''s
  principle: faster flow occurs where pressure is lower. It assumes equal elevation
  at both points and no viscous losses.'
equation: pressure sub pressure eq density mul ((velocity pow 2) sub velocity pow
  2 ) frac 2
symbol_overrides:
- pressure: P_1
- pressure: P_2
- density: ρ
- velocity: v_2
- velocity: v_1
name_overrides:
- pressure: '[pressure] at point 1'
- pressure: '[pressure] at point 2'
- density: Fluid [density]
- velocity: '[velocity] at point 2'
- velocity: '[velocity] at point 1'
