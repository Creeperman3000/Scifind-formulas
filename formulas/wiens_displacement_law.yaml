description: "States that the wavelength at which a blackbody's spectral radiance is maximum is inversely proportional to its absolute temperature, with the proportionality given by Wien's displacement constant. This explains why hot objects shift from red to blue as their temperature rises, and underlies stellar color-temperature relations and infrared applications."
