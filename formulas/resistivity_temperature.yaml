description: The resistance of a conductor varies approximately linearly with temperature over a limited range, expressed as the resistance at a reference temperature multiplied by one plus the temperature coefficient times the temperature change. This linear approximation is widely used for metals near room temperature, where the temperature coefficient of resistance is small and positive.
