description: "In a reaction with a limiting reactant, this gives the amount of the excess reactant left over once the reaction stops. The moles consumed are found from the limiting reactant via the stoichiometric mole ratio, converted to mass with the molar mass, and subtracted from what was present initially. It assumes the reaction goes to completion."
