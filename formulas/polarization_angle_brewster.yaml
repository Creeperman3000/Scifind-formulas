description: Brewster's angle, also known as the polarization angle, is the angle
  of incidence at which light with a particular polarization is perfectly transmitted
  through a transparent dielectric surface with no reflection. Brewster's law relates
  this angle to the ratio of the refractive indices of the two media at the interface.
