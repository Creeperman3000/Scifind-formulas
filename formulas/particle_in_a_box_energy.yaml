description: "A particle confined to a one-dimensional box with infinitely high walls can only occupy discrete energy levels, which scale with the square of an integer quantum number. This simple model, sometimes called the infinite square well, is the standard pedagogical example used to introduce quantization in quantum mechanics and illustrates how wave-like boundary conditions restrict the allowed energies of a bound particle."
