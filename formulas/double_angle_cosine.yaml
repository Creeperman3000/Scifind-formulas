description: "Trigonometric identity that expresses the cosine of twice an angle in terms of the sine and cosine of the angle itself. It follows from the cosine addition formula by taking both angles equal, and it has equivalent forms written using only cosine or only sine via the Pythagorean identity. Used for simplifying expressions, evaluating exact values, and deriving power-reduction and half-angle formulas."
equation: cos (angle mul 2) eq (cos angle pow 2) sub sin angle pow 2
