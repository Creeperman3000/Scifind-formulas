description: "Each electron shell with principal quantum number n can hold at most 2n² electrons, a result that follows from the Pauli exclusion principle and the number of distinct orbitals in a shell (1, 4, 9, 16, ...). The first four shells (K, L, M, N) reach this maximum in known elements; higher shells never fill completely because of the aufbau filling order. The periodic table of elements is organized so that each row corresponds to the filling of a successive shell."
