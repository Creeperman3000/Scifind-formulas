description: "The Rayleigh criterion is the conventional diffraction-limited angular resolution for a circular aperture, defining the minimum angular separation at which two point sources can be distinguished. Two incoherent point sources are regarded as just resolved when the principal diffraction maximum of one image coincides with the first minimum of the Airy pattern of the other."
