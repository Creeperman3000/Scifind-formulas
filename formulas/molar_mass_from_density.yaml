description: "Combining the ideal gas law with the definition of density (ρ = m/V) gives a direct route to the molar mass of a gas from its measured density at a known temperature and pressure. This relation underlies the classical vapour-density method of determining molecular weights, and is exact for an ideal gas and a good approximation for real gases at low pressure."
