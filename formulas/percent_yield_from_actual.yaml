description: Percent yield compares the actual mass of product isolated from a laboratory
  reaction to the maximum mass predicted by stoichiometry (the theoretical yield)
  and expresses the result as a percentage. The theoretical yield assumes the limiting
  reagent is fully converted with no losses, so a percent yield below 100% reflects
  incomplete reaction, side products, and material lost during isolation and purification.
  It is the most commonly reported measure of reaction efficiency in synthetic chemistry.
