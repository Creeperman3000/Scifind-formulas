description: "The cyclotron frequency is the rate at which a charged particle completes circular orbits in a plane perpendicular to a uniform magnetic field, with the magnetic force supplying the centripetal force. Remarkably, it depends only on the particle's charge-to-mass ratio and the field strength — not on its speed or orbit radius — which is the property that makes cyclotron accelerators work; relativistic speeds cause the simple formula to break down."
