description: "The canonical commutation relation states how the quantum-mechanical position and momentum operators fail to commute, their commutator being defined as the difference of the two operator products. It is a cornerstone postulate of quantum mechanics, encoding that position and momentum are incompatible observables, and it directly implies the Heisenberg uncertainty principle."
