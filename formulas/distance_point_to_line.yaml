description: Gives the shortest (perpendicular) distance from a fixed point to an
  infinite line in the plane written as Ax + By + C = 0. The absolute value makes
  the distance nonnegative regardless of which side of the line the point lies on,
  and it is used in analytic geometry and in measuring scatter about a fitted line.
