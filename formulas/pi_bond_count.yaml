description: "The number of pi bonds in a multiple bond equals the bond order minus the number of sigma bonds, since each multiple bond consists of one sigma bond plus additional pi bonds (e.g. one pi bond in a double bond, two in a triple bond). The relation is used to count pi bonds from a Lewis structure when determining molecular geometry, hybridization, and reactivity."
