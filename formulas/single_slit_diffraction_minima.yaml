description: "When a wave passes through a single narrow slit, the far-field intensity pattern has destructive-interference minima where the path-length difference across the slit equals an integer number of wavelengths. The condition sets the angles of the dark fringes observed on a distant screen and is fundamental to understanding resolution limits of optical instruments."
