description: "Steady-state heat conduction through a composite wall made of two layers in series is analogous to a thermal circuit in which the layer thermal resistances add. The rate of heat flow equals the temperature difference between the hot and cold sides divided by the sum of the per-layer thermal resistances, with the area appearing in the resistance definitions."
