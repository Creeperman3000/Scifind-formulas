description: "This rotational kinematic relation gives the angular speed of a spinning body after a known time interval when its angular acceleration is constant. It is the exact rotational analogue of the straight-line motion equation for final velocity, obtained by replacing displacement, velocity, and acceleration with their angular counterparts. Commonly used for wheels, turbines, and other objects spun up or braked at a steady rate."
