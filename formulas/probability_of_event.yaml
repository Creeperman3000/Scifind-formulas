description: "Classical (theoretical) probability assigns to an event the ratio of the number of favorable outcomes to the total number of equally likely outcomes in the sample space. The result is a dimensionless number between 0 and 1, and is the foundation of the frequentist interpretation of probability used in combinatorics and elementary statistics."
