description: The index of hydrogen deficiency (also called the degree of unsaturation
  or double bond equivalent) gives the total number of rings plus π bonds in an organic
  molecule from its molecular formula. Oxygen and other divalent atoms do not affect
  the count because they require no additional hydrogens relative to a saturated acyclic
  hydrocarbon skeleton.
