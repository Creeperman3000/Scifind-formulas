description: The tangent addition formula gives the tangent of a compound angle in
  terms of the tangents of its two component angles. It follows from the sine and
  cosine addition formulas and holds whenever the tangents are defined; it is used
  to find exact values such as the tangent of 75 degrees and to derive double-angle
  formulas.
equation: tan (angle add angle ) eq (tan angle add tan angle ) frac 1 sub tan angle
  mul tan angle
