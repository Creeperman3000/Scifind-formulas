description: "Henry's law states that at constant temperature the amount of a gas dissolved in a liquid is proportional to its equilibrium partial pressure above the solution. The proportionality factor, called Henry's law constant, is tabulated for many gas-solvent pairs and is widely used in chemical engineering, environmental chemistry, and decompression physiology."
