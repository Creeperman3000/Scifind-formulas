description: "Thermal stress is the mechanical stress induced in a material when a temperature change is prevented from producing free thermal expansion, such as when the body is rigidly constrained. The stress is the product of Young's modulus, the linear thermal expansion coefficient, and the temperature change, and it is a key consideration in the design of bridges, rails, pipelines, and bimetallic strips."
equation: pressure eq pressure mul (coefficient_of_linear_expansion) mul temperature
