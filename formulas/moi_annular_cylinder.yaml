description: The moment of inertia of a hollow cylindrical tube (thick-walled annular
  cylinder) about its longitudinal central axis equals one-half the total mass times
  the sum of the squares of the inner and outer radii. It is the standard result for
  tubes, pipes, and bearings, and reduces to the solid cylinder (R₁=0) or thin shell
  (R₁=R₂) cases in the appropriate limits.
