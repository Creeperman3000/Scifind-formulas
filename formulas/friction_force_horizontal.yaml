description: On a flat horizontal surface, with no other vertical forces, the normal
  force on an object equals its weight, so the kinetic friction force reduces to the
  kinetic coefficient times the object's weight. The formula assumes no applied vertical
  forces and a level surface, so that the normal force equals the gravitational force.
