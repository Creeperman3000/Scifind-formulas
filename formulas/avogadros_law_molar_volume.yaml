description: "By Avogadro's law, gas volume is proportional to the number of moles at fixed temperature and pressure, so the volume occupied by one mole of any ideal gas is a universal quantity. At standard temperature and pressure this molar volume is essentially identical for all ideal gases (about 22.4 L/mol), which makes it a staple conversion factor in gas stoichiometry."
