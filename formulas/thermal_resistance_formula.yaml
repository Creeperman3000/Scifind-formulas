description: "Thermal resistance (the R-value used in building insulation) is the thickness of a material divided by its thermal conductivity, giving a measure of how well the material resists conductive heat flow per unit area. It assumes one-dimensional steady-state conduction and is most useful for comparing insulating layers of different materials and thicknesses."
