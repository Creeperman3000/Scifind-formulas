description: Also called the specificity constant, this second-order rate parameter
  measures how effectively an enzyme converts its substrate into product when substrate
  is scarce, and how strongly the enzyme discriminates between competing substrates.
  For the fastest enzymes it approaches the diffusion-controlled limit of roughly
  one hundred million to a billion per molar per second. It is a standard benchmark
  for comparing enzyme performance across substrates and mutants.
