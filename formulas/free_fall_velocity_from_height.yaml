description: "For an object falling from rest through a height h in a uniform gravitational field with negligible air resistance, the speed reached is the square root of 2gh, independent of mass. It follows from energy conservation or from the constant-acceleration kinematic relation v² = u² + 2as."
equation: velocity eq sqrt (acceleration mul (length) mul 2) 2
