description: Converts the difference of two sines into a product, expressed in terms
  of a half-angle cosine and a half-angle sine. The identity follows from the sine
  and cosine addition and subtraction formulas and is useful for combining or simplifying
  trigonometric expressions and solving certain trigonometric equations.
equation: sin angle sub sin angle eq dimensionless mul (cos ((angle add angle) frac
  2) mul sin ((angle sub angle) frac 2) )
