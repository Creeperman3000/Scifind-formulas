description: "The angular wavenumber measures how rapidly a wave's phase changes with position: it gives the number of radians contained in one metre of propagation path. It appears as the spatial factor kx in the sinusoidal expression of a travelling wave, plays the role of spatial frequency in the wave equation, and is proportional to photon momentum in quantum mechanics. It should not be confused with the spectroscopic wavenumber, which counts full cycles per unit distance instead of radians."
