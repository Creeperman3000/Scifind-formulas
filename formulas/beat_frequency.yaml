description: "When two waves of slightly different frequencies overlap, their superposition produces a periodic rise and fall in amplitude called beats. The beat frequency counts how many amplitude maxima occur per second and equals the magnitude of the difference between the two wave frequencies, which is why the result must be non-negative. It is commonly used for tuning musical instruments and comparing nearby frequencies."
