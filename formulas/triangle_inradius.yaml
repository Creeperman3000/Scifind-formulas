description: "The inradius is the radius of the incircle, the largest circle that fits inside a triangle and is tangent to all three sides. It equals the triangle's area divided by its semiperimeter, a relationship that follows from the incircle splitting the triangle into three sub-triangles of heights equal to the inradius."
