description: "In coordination chemistry, the coordination number of a central metal atom or ion is the count of ligand donor atoms directly bonded to it. For monodentate ligands this equals the number of ligands, while chelating (polydentate) ligands contribute one attachment point per donor atom. It determines the geometry of the complex, with values of 2, 4, and 6 being most common for transition metals."
