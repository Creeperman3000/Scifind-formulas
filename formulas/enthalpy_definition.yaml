description: "Enthalpy is a thermodynamic state function that combines a system's internal energy with the pressure-volume product of its surroundings. Because many chemical and physical processes occur at constant atmospheric pressure, enthalpy changes are more convenient to measure than internal energy changes, making this quantity central to thermochemistry. It is an extensive property measured in joules."
