description: 'Predicts the theoretical yield of a reaction: once the limiting reactant
  is identified, its mass fixes the maximum amount of product that can form. The calculation
  converts the limiting reactant''s mass to moles, scales by the mole ratio from the
  balanced chemical equation, and converts back to product mass. It assumes complete
  conversion and no side reactions, so real yields are typically lower.'
