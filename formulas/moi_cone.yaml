description: The moment of inertia of a uniform solid right circular cone about its
  central axis equals three-tenths of the total mass times the square of the base
  radius. The height does not appear, so cones with the same base radius and mass
  have the same rotational inertia regardless of how tall or squat they are.
equation: moment_of_inertia eq 3 mul (mass mul length pow 2 ) frac 10
