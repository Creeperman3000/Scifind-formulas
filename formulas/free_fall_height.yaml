description: "For an object released from rest in a uniform gravitational field with negligible air resistance, the vertical distance fallen is half the gravitational acceleration times the square of the elapsed time. The result is the standard kinematic relation obtained by integrating the constant downward acceleration."
equation: length eq acceleration mul (time pow 2 ) frac 2
