description: "The law of mass action states that for a reversible reaction at equilibrium and constant temperature, the ratio of product concentrations to reactant concentrations is constant. Each concentration is raised to the power of its stoichiometric coefficient in the balanced equation; only gaseous and aqueous species are included, since pure solids and liquids have effectively constant concentration."
