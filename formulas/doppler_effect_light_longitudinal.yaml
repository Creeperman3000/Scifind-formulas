description: Gives the frequency of light measured by an observer when the source
  moves directly away along the line of sight at a relativistic speed, combining the
  classical wave-front bunching with relativistic time dilation. The result is the
  redshift used to interpret recession speeds of stars and galaxies; it involves no
  medium, unlike the sound Doppler effect.
