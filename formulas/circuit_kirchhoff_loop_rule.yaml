description: "Kirchhoff's loop rule (also called Kirchhoff's voltage law) states that the algebraic sum of all voltage changes around any closed loop in a circuit equals zero, reflecting conservation of energy. Sources count as rises and loads as drops relative to the chosen traversal direction. It is used together with the junction rule to analyze multi-loop circuits."
