description: The F-statistic for a multiple linear regression tests whether the model
  explains a significant portion of the response variance. It compares the mean square
  due to regression to the mean square of the residuals; under the null hypothesis
  that all slope coefficients are zero it follows an F-distribution with (p, n-p-1)
  degrees of freedom.
