description: Also known as R-squared, this statistic measures the proportion of the
  variance in the dependent variable that is explained by a regression model. It is
  computed from the unexplained variability left after fitting relative to the total
  variability around the mean, and ranges from 0 to 1 for models fitted by least squares.
  It is widely used to judge and compare goodness of fit.
