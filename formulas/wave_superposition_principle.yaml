description: The principle of superposition states that when two or more waves of the same type occupy the same region of a linear medium, the resulting displacement at any point is the algebraic sum of the individual wave displacements. It holds exactly in linear systems and approximately in weakly nonlinear media for small-amplitude waves, and is the basis for interference, diffraction, and Fourier analysis.
