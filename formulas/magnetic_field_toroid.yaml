description: Gives the magnetic flux density inside a toroidal coil of N turns carrying
  current I, where r is the radius of the circular Amperian loop threading the toroid.
  Derived by applying Ampère's law to the symmetry of the toroid, assuming a tightly
  wound, air-core coil of large mean radius compared with its cross-section.
