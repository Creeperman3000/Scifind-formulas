description: "Gives the perimeter of a circle — the total distance around its boundary — from its radius. It follows directly from the definition of pi as the ratio of circumference to diameter. This relation is exact for any circle and is the basis for computing arc lengths, wheel travel distances, and rotational-to-linear motion conversions."
