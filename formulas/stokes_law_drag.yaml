description: "Stokes's law gives the viscous drag force on a small sphere moving at very low Reynolds number through a fluid, assuming laminar flow, spherical shape, homogeneous material, and smooth non-interacting particles. It underlies falling-sphere viscometry and the derivation of the terminal velocity of microscopic particles settling in air or liquid."
