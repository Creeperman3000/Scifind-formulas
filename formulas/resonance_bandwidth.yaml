description: The bandwidth of a resonant system is inversely proportional to its quality factor, with higher Q producing narrower resonances and greater frequency selectivity. It is typically defined as the full width at half maximum of the resonance peak, governing how sharply a tuned circuit or filter responds around its center frequency.
