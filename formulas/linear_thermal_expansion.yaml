description: "Linear thermal expansion describes the change in length of a solid object when its temperature changes, assuming the body is free to expand. The relationship holds for small, uniform temperature changes and is widely used in engineering to design bridges, rails, bimetallic strips, and other structures that must accommodate dimensional changes."
