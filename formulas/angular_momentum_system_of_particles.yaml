description: The total angular momentum of a system of particles about a chosen origin
  is the vector sum of the angular momenta of the individual particles. Internal torques
  cancel in pairs, so this total changes only under net external torque, which makes
  it the conserved quantity behind the law of conservation of angular momentum.
