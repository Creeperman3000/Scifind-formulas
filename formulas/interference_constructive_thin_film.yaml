description: "For light at normal incidence on a thin film, constructive interference of the reflected beams occurs when twice the optical path through the film equals an integer number of wavelengths. This assumes no net phase shift on reflection; if a half-wavelength phase shift occurs at one boundary, the condition is shifted by a half-integer."
