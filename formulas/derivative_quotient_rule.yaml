- https://instruct.math.lsa.umich.edu/tutorial/derivative/quotient.html
description: The quotient rule gives the derivative of a ratio of two differentiable
  functions as the derivative of the numerator times the denominator minus the numerator
  times the derivative of the denominator, all over the square of the denominator.
  It requires the denominator to be nonzero and is often derived from the product
  rule.
