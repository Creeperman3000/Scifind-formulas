description: "The orbital angular momentum of a body circling a central point is the rotational analogue of linear momentum, obtained from mass, orbital speed, and orbit radius. For circular orbits it stays constant because gravity exerts no torque — the basis of Kepler's second law and of analyses of satellites, planets, and orbiting electrons."
