description: "A green-chemistry metric, introduced by Barry Trost, that measures what fraction of the reactant mass ends up incorporated into the desired product rather than waste by-products. Unlike percentage yield, it can be assessed from the balanced equation alone and is used to compare alternative synthetic routes for sustainability."
