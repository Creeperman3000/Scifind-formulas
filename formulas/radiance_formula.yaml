description: Radiance is the radiant flux emitted, reflected, transmitted, or received
  by a surface per unit solid angle per unit projected area. It is a directional quantity
  used to characterize how much power a surface delivers to an optical system observing
  it from a given direction, and is conserved by ideal lossless optical systems.
