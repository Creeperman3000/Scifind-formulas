description: "The root-mean-square speed characterizes the typical speed of molecules in an ideal gas in thermal equilibrium, derived from the Maxwell–Boltzmann distribution. It depends on the absolute temperature and the molar mass of the gas, increasing with temperature and decreasing for heavier molecules."
