description: Kepler's second law states that the line joining a planet to the Sun
  sweeps out equal areas in equal times, so the areal velocity is constant. Equivalently,
  the orbital angular momentum per unit mass is twice the rate at which area is swept
  out by the radius vector, a direct consequence of conservation of angular momentum
  in a central force field.
equation: area div time eq angular_momentum div mass mul 2
