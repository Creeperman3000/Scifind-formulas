description: "Gives the angular frequency at which the magnetic moment of a particle (such as an electron or nucleus) precesses about an external magnetic field. It is central to nuclear magnetic resonance, electron paramagnetic resonance, and magnetic resonance imaging, and depends only on the field magnitude and the particle's gyromagnetic ratio, not on the orientation of the moment."
