description: "In a hydraulic system based on Pascal's principle, the incompressibility of the fluid requires the volume displaced by one piston to equal the volume gained by the other. Combined with equal pressure, this yields the mechanical advantage that makes hydraulic lifts, brakes, and presses possible."
