description: "Engineering (Cauchy) strain is the ratio of an axial elongation to the original length of a material element, used in the small-deformation analysis of metals, concrete, and other structural materials. For large deformations of elastomers and polymers, alternative strain measures such as logarithmic, Green, or Almansi strain must be used."
