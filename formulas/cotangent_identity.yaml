description: "This quotient identity defines the cotangent as the ratio of the cosine to the sine of the same angle, equivalently the reciprocal of the tangent. In a right triangle it equals the adjacent side divided by the opposite side. It is undefined wherever the sine vanishes (at integer multiples of pi) and is used to rewrite expressions in terms of sine and cosine."
