description: "Any simple polygon can be divided into non-overlapping triangles whose vertices are vertices of the polygon (a triangulation), and the polygon's total area is the sum of the areas of those triangles. This decomposition reduces general polygon area computation to repeated triangle area calculations and is the conceptual basis of many computational geometry algorithms."
