description: The zero-order special case of the destructive-interference condition
  for a thin film whose reflections at both boundaries undergo a 180° phase shift,
  such as a single-layer anti-reflection coating. The required film thickness is one
  quarter of the in-film wavelength, the standard quarter-wave coating thickness.
