description: "Pascal's principle applied to a hydraulic press: when an input force is applied to a small piston, the transmitted pressure acts on the larger output piston, producing a proportionally larger output force equal to the input force times the area ratio. Energy is conserved because the larger piston moves a correspondingly smaller distance."
