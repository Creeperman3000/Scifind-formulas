description: "Expresses the escape velocity of a uniform spherical body in terms of its average density and radius instead of its mass. Substituting the mass of a uniform sphere into the standard escape-velocity formula shows that escape speed grows linearly with radius and with the square root of the density. Assumes the body has a spherically symmetric, uniform mass distribution."
