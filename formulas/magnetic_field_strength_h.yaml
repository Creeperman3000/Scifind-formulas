description: "The H-field (magnetic field strength or magnetic field intensity) is the auxiliary magnetic vector whose curl equals the free current density in Ampère's law. It is related to the magnetic flux density B and the permeability of the medium by H = B/μ, so in free space H = B/μ₀. H is measured in amperes per metre."
