description: 'The first-order differential equation defining exponential decay: a
  quantity changes at a rate proportional to its own current value, with the negative
  sign meaning the quantity decreases. It models processes such as radioactive disintegration,
  capacitor discharge, and first-order chemical reactions; solving it yields the familiar
  exponential decay law with time constant set by the decay constant.'
