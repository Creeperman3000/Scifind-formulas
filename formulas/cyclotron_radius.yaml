description: "The cyclotron radius (also called Larmor radius or gyroradius) is the radius of the circular orbit traced by a charged particle moving perpendicular to a uniform magnetic field, where the magnetic Lorentz force supplies the centripetal force. The orbit grows with particle momentum and tightens with stronger fields or greater charge; it underlies mass spectrometer separation and cyclotron beam dynamics."
