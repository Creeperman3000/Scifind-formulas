description: "Current density is the amount of electric current flowing through a unit cross-sectional area of a conductor, measured in amperes per square meter. It characterizes how concentrated the charge flow is at a point and is used to size wires and analyze current distribution; the full quantity is a vector pointing along the motion of positive charge."
