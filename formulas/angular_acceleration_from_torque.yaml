description: "This relation is Newton's second law for rotation: the net torque acting on a rigid body about a fixed axis equals its moment of inertia times the resulting angular acceleration. The moment of inertia plays the role that mass plays in linear motion, so a larger moment of inertia means less angular acceleration for the same applied torque."
