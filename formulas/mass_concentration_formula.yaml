description: "Mass concentration (also called mass density of a component) expresses the mass of a constituent solute per unit volume of the mixture. It is widely used in chemistry, biology, and medicine, where the percent notation m/v is common for aqueous solutions. For a pure substance the mass concentration equals the bulk density."
