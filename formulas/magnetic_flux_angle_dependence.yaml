description: "The magnetic flux through a planar surface of area A in a uniform magnetic field B depends on the angle θ between the field direction and the surface normal, reaching its maximum when the field is perpendicular to the surface and falling to zero when the field lies in the plane. This cosine dependence is the basis of Faraday's law of induction."
