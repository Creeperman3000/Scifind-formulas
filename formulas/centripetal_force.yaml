description: Net force required to keep a body of given mass moving on a circular
  path, directed toward the center of curvature. It is not a new kind of force but
  the name for whatever real force (tension, gravity, friction, a normal force) supplies
  the radial acceleration. Used in designing banked roads, centrifuges, and orbits;
  a larger required force means a tighter turn.
