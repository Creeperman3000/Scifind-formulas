description: Standing waves form on a string (or in a column) only at discrete resonant
  frequencies, each an integer multiple of a fundamental determined by the wave speed
  and twice the length of the medium for two-fixed-end boundary conditions. The integer
  n labels the harmonic or mode number, and the corresponding standing-wave pattern
  has n antinodes. These resonant frequencies underpin musical instruments and acoustic
  resonators.
