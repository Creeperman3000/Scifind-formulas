description: "States the tangent-to-a-circle theorem from Euclidean geometry: at the point where a tangent line touches a circle, the radius drawn to that point makes a right angle with the tangent. The converse also holds, so a line perpendicular to a radius at its endpoint on the circle is necessarily a tangent. This fact is the basis for many circle proofs and for tangent-length constructions."
