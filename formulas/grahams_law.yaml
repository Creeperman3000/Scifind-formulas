description: Graham's law relates the rates at which two gases effuse through a small
  hole to the square roots of their molar masses. The empirical law follows from kinetic
  theory, which gives the rms speed of gas molecules as inversely proportional to
  the square root of their molar mass, and is widely used to separate isotopes and
  to estimate molecular weights from measured effusion rates.
equation: ((velocity frac velocity) eq ((molar_mass frac molar_mass) sqrt 2))
