description: "The maximum horizontal range of a projectile launched from and landing at the same elevation is reached at a 45° launch angle and equals the square of the initial speed divided by the gravitational acceleration. Assumes vacuum, uniform gravity, and launch and landing heights equal."
equation: length eq velocity mul (velocity) frac acceleration
