description: 'The coefficient of static friction, typically denoted \mu_s, is an empirical, dimensionless quantity that characterizes the ratio of the maximum static friction force between two surfaces to the normal force pressing them together. It sets the threshold at which an applied force will cause an object to begin sliding, with \mu_s usually larger than the corresponding kinetic coefficient.'
