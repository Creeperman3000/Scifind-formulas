description: The kinetic energy of a rigid body rotating about a fixed axis is half the product of its moment of inertia and the square of its angular velocity, the rotational analog of the linear formula. Moment of inertia plays the role of mass, and the expression underpins the analysis of flywheels, gyroscopes, and rolling motion.
equation: energy eq moment_of_inertia mul (angular_velocity pow 2) frac 2
