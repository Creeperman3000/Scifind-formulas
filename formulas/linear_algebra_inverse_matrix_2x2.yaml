description: The inverse of an invertible 2-by-2 matrix is the matrix's adjugate (with
  diagonal entries swapped and off-diagonal entries sign-flipped) divided by the determinant,
  which equals the difference of the diagonal products of the original matrix. This
  closed form requires the determinant to be nonzero and is widely used in analytic
  and numerical work.
