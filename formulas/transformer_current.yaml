description: "Derived from conservation of power in an ideal transformer, equating the apparent electrical power in the primary and secondary windings. Combined with the turns-ratio relationship it links primary and secondary currents to primary and secondary voltages. It underpins the design of step-up and step-down power transformers used in AC power distribution."
