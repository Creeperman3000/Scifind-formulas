description: Stagnation pressure (total pressure) is the pressure a flowing fluid
  reaches when it is brought to rest, converting its kinetic energy into pressure.
  It equals the sum of the static pressure and the dynamic pressure of the stream.
  Valid for steady, incompressible, inviscid flow along a streamline with negligible
  height change; measured by pitot tubes.
