description: "For a rigid body rotating about a fixed axis, the angular momentum equals the product of its moment of inertia about that axis and its angular velocity. It is the rotational analogue of linear momentum and is conserved when no net external torque acts — the principle behind a figure skater spinning faster when pulling in their arms."
equation: angular_momentum eq moment_of_inertia mul angular_velocity
