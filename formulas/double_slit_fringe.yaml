description: "Gives the distance between adjacent bright (or adjacent dark) fringes in a Young's double-slit pattern on a screen. Derived from the constructive-interference condition using the small-angle approximation, valid when the screen is much farther from the slits than the slit separation. The spacing grows with wavelength and screen distance and shrinks as the slits are moved apart, which is how the experiment reveals wave behavior of light."
