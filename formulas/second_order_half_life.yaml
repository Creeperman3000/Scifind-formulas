description: For a second-order chemical reaction, the half-life (the time required
  for a reactant's concentration to fall to half its initial value) is inversely proportional
  to both the initial concentration and the rate constant. Unlike first-order reactions,
  the half-life grows shorter as the reaction proceeds because the rate depends on
  concentration.
