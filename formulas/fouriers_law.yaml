description: "Fourier's law of heat conduction states that the time rate of heat flow through a material is proportional to the cross-sectional area normal to the flow and to the temperature difference across it, and inversely proportional to the thickness. It is the foundational constitutive relation for conductive heat transfer and the starting point for deriving the heat equation."
