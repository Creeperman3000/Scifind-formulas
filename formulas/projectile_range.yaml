description: "The horizontal range of a projectile launched and landing at the same height equals the square of the initial speed times the sine of twice the launch angle, divided by gravitational acceleration. This is the canonical relation for ideal projectile motion in vacuum."
equation: length eq (velocity pow 2) mul sin ((angle) mul 2) frac standard_gravity
