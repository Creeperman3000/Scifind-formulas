description: 'Gives the higher pitch heard when a wave source moves directly toward
  a stationary observer through a medium: wavefronts bunch up ahead of the source,
  shortening the wavelength and raising the received frequency above the emitted one.
  It assumes the observer is at rest relative to the medium and that the source speed
  is less than the wave speed.'
