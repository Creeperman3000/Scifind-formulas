description: When the surroundings behave as a large constant-temperature reservoir,
  any heat released by the system is absorbed reversibly by the surroundings, so their
  entropy change follows from the heat exchanged at that reservoir temperature. This
  lets the surroundings' contribution to the total entropy change be computed from
  calorimetric data, usually assuming constant pressure.
