description: "Matrix addition is performed entrywise and is only defined for matrices of the same dimensions. For two m-by-n matrices A and B, the (i,j) entry of A+B is the sum of the corresponding entries A_{i,j} and B_{i,j}. The operation is commutative and associative, and a zero matrix of the same size acts as the additive identity."
