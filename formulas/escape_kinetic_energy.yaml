description: "The minimum kinetic energy an object of a given mass must be given to escape from a celestial body's gravitational field starting at distance r from its center. It exactly balances the magnitude of the gravitational potential energy at that distance, so the object reaches infinity with zero speed. Assumes a spherical body, no atmosphere, and no other forces acting on the object."
