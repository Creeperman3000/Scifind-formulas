description: "The power of a point P with respect to a circle is the real number obtained by squaring the distance from P to the circle's center minus the square of the radius. For any chord, secant, or tangent through P meeting the circle at points A and B, the signed product PA·PB is constant and equals this value, which lies inside, on, or outside the circle depending on its sign."
