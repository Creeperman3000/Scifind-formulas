description: "Gives the area enclosed by a trapezoid, a quadrilateral with one pair of parallel sides called the bases. It can be interpreted as the average length of the two parallel sides taken over their perpendicular separation. Applies to any trapezoid (right, isosceles, or scalene) and underlies the trapezoidal rule used to approximate areas under curves."
