description: The Schwarzschild radius is the radius of the event horizon of a non-rotating,
  uncharged black hole, arising as a scale parameter in the Schwarzschild solution
  to Einstein's field equations. Any mass compressed below this radius undergoes gravitational
  collapse to a black hole, so it sets the size of a static black hole for a given
  mass.
