description: The gravitational acceleration at a height above the surface of a spherical
  body of mass M and radius R is obtained by applying Newton's law of universal gravitation
  at a distance R plus that height from the body's center. The result falls off as
  the inverse square of the radial distance and is widely used in geophysics and orbital
  mechanics.
