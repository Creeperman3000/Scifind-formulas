description: "A spherical bubble of gas in a liquid has an internal pressure higher than the surrounding liquid due to surface tension acting on its two interfaces (inner and outer surfaces). The excess pressure is inversely proportional to the bubble radius, so smaller bubbles require larger pressures to maintain equilibrium; this follows from the Young-Laplace equation."
