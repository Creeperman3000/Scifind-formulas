description: "The sum of the first n terms of a geometric progression with first term a and common ratio r (with r not equal to 1) equals a times the quantity one minus r to the n over one minus r. The formula follows from multiplying the sum by r and subtracting it from itself, which cancels all interior terms and leaves only the endpoints."
