description: The residual standard error is the square root of the residual sum of
  squares divided by the residual degrees of freedom, used to estimate the standard
  deviation of the unobserved errors in a linear regression. It serves as a goodness-of-fit
  measure, with smaller values indicating that observations lie closer to the fitted
  regression line.
