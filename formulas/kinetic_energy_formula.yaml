description: Kinetic energy is the energy a body possesses by virtue of its motion.
  For a non-rotating object of mass m moving at speed v, the kinetic energy is one-half
  the product of the mass and the square of the speed, valid for speeds much less
  than the speed of light (Newtonian regime).
