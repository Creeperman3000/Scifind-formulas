description: "Mass flow rate is the mass of a fluid passing through a cross-section per unit time, commonly denoted ṁ. For a uniform flow through a pipe or duct it equals the fluid density times the cross-sectional area times the flow velocity. It is a central quantity in fluid dynamics, the continuity equation, and engine performance calculations such as those used in aerospace propulsion."
