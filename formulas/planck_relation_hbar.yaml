description: "Relates the energy of a photon to its angular frequency through the reduced Planck constant (h-bar, h divided by two pi), the form of the Planck–Einstein relation most often used in quantum mechanics. It is the temporal component of the relativistic four-momentum carried by a photon and underlies quantization across quantum theory."
