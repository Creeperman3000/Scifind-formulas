description: Percent yield compares the amount of product actually obtained from a
  chemical reaction to the maximum amount predicted from stoichiometry (the theoretical
  yield). It is a key practical measure of reaction efficiency, accounting for losses
  from side reactions, incomplete conversion, and product purification.
