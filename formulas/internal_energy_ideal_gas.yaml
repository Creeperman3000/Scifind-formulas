description: "For an ideal monatomic gas, the internal energy depends only on temperature, scaling linearly with the amount of substance. It follows from the kinetic theory that each translational degree of freedom contributes (1/2)k_BT per molecule, giving (3/2)nRT for three translational modes. Polyatomic gases with rotational and vibrational modes require additional terms."
