description: An Atwood machine consists of two masses connected by a light string
  over an ideal frictionless pulley; the heavier mass accelerates downward while the
  lighter one rises. The magnitude of that acceleration is set by the imbalance of
  the two weights relative to the total inertia being accelerated. The result assumes
  a massless, inextensible string and a massless, frictionless pulley.
equation: acceleration eq standard_gravity mul ((mass sub mass) frac mass add mass
  )
