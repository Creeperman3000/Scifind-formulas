description: "An annulus is the ring-shaped region between two concentric circles. Its area equals the area of the outer disk minus that of the inner disk, so it depends only on the two radii. Used in geometry and engineering for washers, pipes, and circular rings."
equation: area eq pi mul ((length pow 2) sub length pow 2 )
