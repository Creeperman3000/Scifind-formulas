description: "The lateral (transverse) magnification produced by a mirror equals the negative ratio of the image distance to the object distance. The sign convention makes positive magnification indicate an upright image and negative magnification an inverted image; the same expression governs both mirrors and thin lenses under the real-is-positive convention."
