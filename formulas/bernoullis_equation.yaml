description: "Bernoulli's equation is the statement of conservation of mechanical energy for a flowing fluid: the sum of static pressure, dynamic pressure, and hydrostatic pressure is the same at any two points along a streamline. It holds for steady, incompressible, inviscid flow and underlies analyses of pipe flow, venturi meters, and airfoil lift."
