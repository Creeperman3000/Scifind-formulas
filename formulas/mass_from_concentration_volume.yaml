description: "The mass of a solute dissolved in a solution can be recovered from its molar concentration, the solution volume, and the solute's molar mass. Multiplying molarity by volume gives moles of solute, and multiplying by molar mass converts moles to grams. This relation underlies solution preparation, dilution calculations, and stoichiometric work in analytical chemistry."
