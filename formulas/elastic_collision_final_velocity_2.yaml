description: Gives the post-collision velocity of the second object in a head-on,
  perfectly elastic one-dimensional collision between two bodies, in terms of both
  initial velocities and the two masses. It is obtained by solving conservation of
  momentum and conservation of kinetic energy simultaneously, and is symmetric to
  the corresponding expression for object one under exchange of labels 1 and 2.
