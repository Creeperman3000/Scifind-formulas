description: When a DC voltage is suddenly applied to a series RL circuit, the current
  rises exponentially from zero toward its steady-state value V/R with time constant
  τ = L/R. This transient growth arises because the inductor opposes changes in current,
  and it characterizes the delay before circuits reach steady operation.
