description: When a perfectly polarized beam of light of irradiance I₀ passes through an ideal linear polarizer whose transmission axis makes an angle θ with the beam's polarization direction, the transmitted irradiance is reduced by a factor of cos²θ. It is the basis for crossed-polarizer extinction and for quantitative polarimetry.
