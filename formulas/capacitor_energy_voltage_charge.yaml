description: "This form of the stored-energy relation uses both the charge held on the plates and the final voltage between them. The energy is half of their product because the capacitor's voltage builds up gradually from zero during charging, so each increment of charge is moved through a lower potential difference than the last. It is useful when a capacitor's charge and operating voltage are both known."
equation: energy eq charge mul (electric_potential) frac 2
