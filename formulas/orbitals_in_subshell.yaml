description: >-
  A subshell designated by the azimuthal quantum number ℓ contains 2ℓ+1 orbitals
  (one for each allowed value of the magnetic quantum number mℓ from −ℓ to +ℓ).
  This underlies the periodic table's blocks of 2, 6, 10, and 14 elements for the
  s, p, d, and f subshells, and reflects the fact that each orbital can hold at
  most two electrons of opposite spin.
