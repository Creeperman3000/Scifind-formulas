description: "Gives the electric field magnitude at a perpendicular distance from an infinitely long straight wire carrying uniform linear charge density, directed radially away from (or toward) the wire. Obtained from Gauss's law with a cylindrical surface; it also approximates a very long finite wire when the distance is small compared with its length."
