description: "Light focused through a circular aperture does not form a perfect point but a diffraction pattern whose bright central spot is the Airy disk. The angular radius measures the angle from the pattern's center to the first dark ring, and it sets the diffraction-limited resolving power of telescopes, microscopes, and cameras via the Rayleigh criterion. Valid in the far field with the small-angle approximation."
