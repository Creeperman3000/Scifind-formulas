description: Central relation of chemical kinetics, giving the temperature dependence of a reaction's rate constant. It combines the collision frequency with an exponential Boltzmann-type factor for the fraction of molecules able to surmount the activation energy barrier, so rates rise steeply with temperature. Assumes a constant activation energy and pre-exponential factor over the temperature range considered.
