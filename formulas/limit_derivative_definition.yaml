description: The limit definition of the derivative expresses the derivative of a
  real-valued function at a point as the limit of the slope of a secant line through
  two points on its graph as the second point approaches the first. The defining limit
  exists only when the function is differentiable at that point, in which case its
  value equals the slope of the tangent line and the instantaneous rate of change
  of the function. This definition is the foundation of differential calculus and
  is the starting point for deriving all standard differentiation rules and the derivatives
  of elementary functions.
