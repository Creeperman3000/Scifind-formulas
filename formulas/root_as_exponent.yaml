description: An nth root can be rewritten as a fractional power, with the index of
  the radical becoming the denominator of the exponent on the base. This equivalence,
  introduced in modern notation by Michel Rolle in 1690, allows the usual laws of
  exponents to be applied to radical expressions and vice versa.
