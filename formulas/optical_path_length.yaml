description: "Optical path length is the product of the geometric length of a light ray's path through a medium and the refractive index of that medium, giving the equivalent distance light would travel in vacuum in the same time. It is the fundamental quantity that sets the phase accumulated by a wave, so it underlies thin-film interference, diffraction, and Fermat's principle."
