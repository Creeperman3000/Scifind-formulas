description: "The standard enthalpy of reaction is the enthalpy change when a reaction proceeds under standard-state conditions, with all reactants and products in their reference states. It is calculated from tabulated standard enthalpies of formation as the difference between the sum over products and the sum over reactants (each weighted by stoichiometric coefficients), in line with Hess's law."
