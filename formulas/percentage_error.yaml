description: Percentage error quantifies the difference between an experimental measurement
  and a theoretical (accepted) value, normalised by the magnitude of the theoretical
  value and expressed as a percentage. It is widely used in experimental sciences
  to express the accuracy of a measurement, and its sign convention preserves the
  direction of the deviation (positive when the experimental value exceeds the accepted
  value). The formula is undefined when the theoretical value is exactly zero.
