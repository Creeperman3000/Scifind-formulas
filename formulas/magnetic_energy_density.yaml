description: Energy per unit volume stored in a magnetic field in free space (or a
  linear medium), expressed in terms of the magnetic flux density B and the permeability
  of the medium. It is the magnetic analogue of the electric-field energy density
  u_E = ε₀E²/2 and follows from Poynting's theorem.
