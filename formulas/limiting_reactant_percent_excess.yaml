description: "Percent excess quantifies how much more of a reactant was supplied than the stoichiometric amount required to react completely with the limiting reactant. It is computed as the surplus amount divided by the theoretical amount needed and expressed as a percentage; values above zero indicate an excess reagent, while zero indicates a stoichiometric mixture."
