description: "Radiocarbon dating determines the age of an organic sample by measuring how much carbon-14 remains relative to the original amount. The technique, developed by Willard Libby, relies on the fact that a living organism exchanges carbon with the atmosphere and so maintains a known C-14 fraction, but after death the C-14 decays with its characteristic half-life. Calibrated against tree-ring and other records, the formula is foundational to archaeology and Quaternary geology."
