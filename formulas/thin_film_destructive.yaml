description: "Condition for destructive interference of light reflected from a thin film, accounting for the half-wavelength phase shift that occurs upon reflection at a boundary where light enters a medium of higher refractive index. This form applies when reflection at both film boundaries produces a 180° phase shift (such as an anti-reflection coating on a substrate of higher index), so the optical path difference for destructive interference is a half-integer multiple of the wavelength."
