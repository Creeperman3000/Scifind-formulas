description: "Counts the total number of rings plus pi bonds in an organic molecule from its molecular formula, comparing the hydrogen count against a fully saturated acyclic reference. Each ring or double bond contributes one degree and each triple bond two; oxygen and sulfur are ignored. Halogens are omitted here; subtracting them too gives the modern index of hydrogen deficiency."
