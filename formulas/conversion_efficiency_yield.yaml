description: Percent yield measures the efficiency of a chemical reaction by comparing
  the amount of product actually obtained (actual yield) to the maximum amount predicted
  by stoichiometry from the limiting reactant (theoretical yield). It is used to assess
  how much material is lost to side reactions, incomplete conversion, or losses during
  purification. Actual and theoretical yields must be expressed in the same units.
