description: "Matrix multiplication of a 2-by-2 matrix A by a 2-by-2 matrix B requires that the number of columns of A equals the number of rows of B; the product is then computed as the dot product of the i-th row of A with the j-th column of B for each entry. The operation is associative and distributive over addition but is generally not commutative. Shown here is the c₁₁ element of the product, obtained from the first row of A and the first column of B."
