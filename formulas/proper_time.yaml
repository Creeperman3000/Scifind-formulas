description: "Proper time is the elapsed time measured by a clock traveling between two events along its own world line, making it a Lorentz-invariant scalar. In special relativity, the proper-time interval between two events is always less than or equal to the coordinate time measured in any inertial frame, with the difference captured by the Lorentz factor. This relation underlies phenomena such as time dilation, the twin paradox, and muon lifetime extension observed in cosmic-ray experiments."
