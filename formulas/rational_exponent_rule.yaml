description: 'The rational exponent rule expresses a power with a fractional exponent
  equivalently as a radical: a^(m/n) is the same as the n-th root of a raised to the
  m-th power, or equivalently the n-th root of a^m. It links fractional exponents
  to radicals and is the basis for simplifying expressions that mix roots and powers.'
