description: The horizontal range of a projectile launched and landing at the same
  height depends on launch angle through the sine of twice that angle, scaled by its
  maximum value. The two complementary angles that sum to 90° produce the same range.
  Assumes vacuum and uniform gravity.
equation: length frac length eq sin (2 mul angle)
