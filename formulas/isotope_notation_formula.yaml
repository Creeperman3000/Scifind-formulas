description: "Isotope notation labels a specific nuclide by its mass number A (the total count of protons and neutrons in the nucleus), its atomic number Z (the proton count), and the element symbol E. Isotopes of the same element share Z but differ in neutron number N, so A = Z + N determines the nucleon composition."
