description: "Converts the molar concentration of a dissolved substance into its mass concentration by way of its molar mass, letting chemists switch between moles-per-liter and grams-per-liter when preparing solutions or running stoichiometry. Note it counts only solute mass per liter of solution, so it equals the solution's density only for a pure substance."
