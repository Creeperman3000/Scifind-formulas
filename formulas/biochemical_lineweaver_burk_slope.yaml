description: The slope of the Lineweaver-Burk plot, the double-reciprocal linearization
  of the Michaelis-Menten equation used in enzyme kinetics. It relates the Michaelis
  constant to the maximum reaction velocity and lets both parameters be read off a
  straight line fitted to rate data; how inhibitors change this slope helps classify
  competitive, uncompetitive, and mixed inhibition.
