description: The rate of a chemical reaction is defined as the change in concentration
  of a reactant or product per unit time, with the sign chosen so that the rate is
  always positive. It is typically expressed using the negative time derivative of
  a reactant concentration, or the positive time derivative of a product concentration,
  and serves as the basis for the rate law in chemical kinetics.
