description: Locates the point exactly halfway between two given points on a coordinate axis or in Cartesian space, expressed as the arithmetic mean of their coordinates. Generalizes to higher dimensions by averaging each coordinate independently and to a weighted version for division of a segment in any ratio.
equation: length eq (length add length) frac 2
