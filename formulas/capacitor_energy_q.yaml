description: This form of the capacitor energy relation applies when the charge on
  the plates is known directly rather than the voltage between them. It shows that
  for fixed charge, a larger capacitance stores less energy, since the same charge
  spreads over a lower potential difference. It follows from combining the definition
  of capacitance with the general work done charging a capacitor.
equation: energy eq (charge pow 2) frac 2 mul capacitance
