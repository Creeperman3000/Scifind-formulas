description: Describes how the equilibrium constant of a reaction changes with temperature,
  derived by combining the Gibbs free energy relation with thermodynamics. For an
  endothermic reaction (positive enthalpy change) the equilibrium constant increases
  as temperature rises, while for an exothermic reaction it decreases. The integrated
  two-temperature form assumes the standard enthalpy change stays constant over the
  temperature range.
