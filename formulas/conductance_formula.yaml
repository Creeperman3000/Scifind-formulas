description: "Electrical conductance measures how easily electric current passes through a component or circuit element. It is the reciprocal of resistance and offers the opposite viewpoint of the same property: high conductance means low opposition to current flow. Its SI unit is the siemens (S), formerly called the mho."
equation: conductance eq 1 frac resistance
