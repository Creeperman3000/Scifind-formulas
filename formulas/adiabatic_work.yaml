description: Gives the work done by an ideal gas during a reversible adiabatic process,
  obtained by integrating the adiabatic pressure-volume condition. Because no heat
  is exchanged, this work equals the decrease in the gas's internal energy; it is
  positive for expansion and negative for compression.
