description: "The simplified gravitational potential energy in the uniform-field limit is proportional to the mass, the local gravitational acceleration, and the height above a reference, neglecting the radial dependence of the true inverse-square law. It is the work needed to lift the mass quasi-statically from the reference level against the constant gravitational force."
