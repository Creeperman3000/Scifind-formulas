description: "The Faraday-Lenz law states that the electromotive force induced in a closed conducting loop equals the negative time-rate-of-change of the magnetic flux through the loop. The negative sign (Lenz's law) makes the induced emf oppose the change in flux that produces it. For a coil of N turns, the emf is multiplied by N."
