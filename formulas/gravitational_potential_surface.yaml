description: "The gravitational potential at the surface of a spherically symmetric body equals the value of the point-mass potential evaluated at the body's radius R. It is the negative of the work per unit mass needed to move a test mass from the surface to infinity, and provides a quick estimate of how strongly a body retains nearby objects."
