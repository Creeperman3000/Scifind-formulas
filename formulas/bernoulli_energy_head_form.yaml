description: This is the head form of Bernoulli's equation, obtained by dividing each
  energy term by the fluid's specific weight so that every term has dimensions of
  length (energy per unit weight). The three heads are the pressure head, velocity
  head, and elevation head, and their sum — the total head — stays constant along
  a streamline for steady, incompressible, inviscid flow. It is widely used in hydraulics
  and civil engineering, e.g. for the energy grade line.
equation: length eq pressure frac (density mul acceleration ) add (velocity pow 2
  ) frac (2 mul acceleration ) add length
