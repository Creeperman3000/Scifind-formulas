name: Bernoulli energy head form
id: bernoulli_energy_head_form
topic: bernoulli_equation
difficulty: 7
description: Valid for steady, incompressible, inviscid flow; expressed as energy
  per unit weight (head).
equation: length eq pressure frac (density mul acceleration ) add ((velocity pow 2
  ) frac (2 mul acceleration )) add length
