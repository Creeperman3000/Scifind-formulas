description: "Absorbance is the common (base-10) logarithm of the ratio of incident to transmitted radiant power through a sample. It is widely used in ultraviolet–visible absorption spectroscopy, where it is linearly proportional to the concentration of the absorbing species and to the optical path length under the Beer–Lambert law (valid for dilute, non-scattering samples)."
