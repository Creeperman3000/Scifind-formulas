description: When reactant amounts are expressed in moles, the limiting reactant is
  identified by computing each reactant's amount of substance divided by its stoichiometric
  coefficient. The reactant with the smallest such scaled-mole value is the limiting
  reactant, since it is the first species to be driven to zero as the reaction proceeds.
