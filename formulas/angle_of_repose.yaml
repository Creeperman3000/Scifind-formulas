description: "The angle of repose is the steepest inclination of a plane at which a body resting on it remains stationary, with static friction exactly balancing the downhill pull of gravity. It depends only on the coefficient of static friction between the surfaces and is used to characterize slopes of granular piles and the onset of sliding; cohesive or wet materials deviate from this ideal result."
