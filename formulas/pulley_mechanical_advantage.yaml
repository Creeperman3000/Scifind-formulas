description: "Mechanical advantage quantifies how much a pulley system multiplies the input effort force to lift or move a load. For an ideal frictionless pulley, the mechanical advantage equals the number of supporting rope sections sharing the load, while the actual (measured) value is reduced by friction, rope mass, and pulley inertia. This relation underlies the design of block-and-tackle hoists, cranes, and other lifting rigs."
