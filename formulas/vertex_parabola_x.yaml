description: "The vertex of a parabola is the point at which it attains its maximum or minimum value, lying on the axis of symmetry. The vertex x-coordinate is found by completing the square or by setting the first derivative of the quadratic to zero, depending only on the linear and quadratic coefficients of the parabola."
