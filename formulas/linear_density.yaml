description: "Linear mass density describes the mass per unit length of a one-dimensional object such as a string, rod, cable, or fibre, and is conventionally denoted μ in the context of mechanical waves on strings. It governs the wave speed on a stretched string and is widely used in textile engineering to characterize yarns and fibres."
