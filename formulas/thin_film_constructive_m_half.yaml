description: "When one of the two reflections at a thin film undergoes a 180° phase change (such as light reflecting off a soap film in air), the constructive interference condition shifts so that the round-trip optical path equals a half-integer number of wavelengths. The full relation for normal incidence is 2 n t = (m + 1/2) λ; the entry isolates the geometric factors for clarity."
