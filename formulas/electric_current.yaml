description: "Electric current is the net rate at which electric charge flows through a cross-section of a conductor, such as the rate at which charge passes a point in a circuit. Its SI unit is the ampere, corresponding to one coulomb of charge passing per second, and it is measured with an ammeter. This defining relation applies to steady flow; for time-varying flow the instantaneous current is the corresponding derivative."
