description: The half-life of a zero-order reaction is the time required for the reactant
  concentration to fall to half of its initial value. Unlike first-order kinetics,
  the half-life depends on the initial concentration and the zero-order rate constant
  k, so it lengthens as the reaction proceeds. Zero-order behavior typically arises
  when a catalyst or surface is saturated, such as in many enzyme-catalyzed reactions
  at high substrate concentration.
