description: "The impedance of free space, also called the wave impedance of a vacuum, is the constant ratio of the electric field strength to the magnetic field strength for a plane electromagnetic wave traveling through vacuum, equal to about 376.7 ohms. It follows from Maxwell's equations and is often approximated in engineering as 120 pi ohms."
