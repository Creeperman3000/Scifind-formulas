description: "Ionization energy is the minimum energy required to remove the most loosely bound electron from a neutral gaseous atom, ion, or molecule. It is computed as the difference between the energy of the resulting positive ion and the energy of the neutral atom, and exhibits periodic trends across the periodic table."
