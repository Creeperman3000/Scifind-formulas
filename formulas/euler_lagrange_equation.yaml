description: 'The central condition of the calculus of variations and of Lagrangian
  mechanics: a function that makes the action functional stationary must satisfy this
  differential equation relating the Lagrangian, the generalized coordinate, and the
  generalized velocity. It is used to derive the equations of motion for mechanical
  systems and to solve optimization problems over functions, taking the same form
  in any choice of generalized coordinates.'
