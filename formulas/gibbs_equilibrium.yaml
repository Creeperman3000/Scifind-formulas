description: "The standard Gibbs free energy change of a reaction is related to its equilibrium constant by the negative of the gas constant times absolute temperature times the natural logarithm of the equilibrium constant. A reaction with K greater than one has a negative standard free energy change and is product-favored at equilibrium."
