description: "The mass balance equation expresses conservation of mass (or moles) for a chemical species across all forms in which it appears in a system. For a monoprotic weak acid HA that dissociates into H⁺ and A⁻, the total analytical concentration equals the sum of the equilibrium concentrations of each species. It is a foundational relation in acid–base equilibrium calculations, reactor design, and process engineering."
