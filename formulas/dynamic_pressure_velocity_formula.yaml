description: "Dynamic pressure is the kinetic energy per unit volume of a flowing fluid, i.e. the pressure associated with the bulk motion of the flow rather than its random thermal motion. It equals the pressure rise that would occur if the flow were brought to rest (stagnation), appears as a term in Bernoulli's equation, and is widely used in aerodynamics to compute lift, drag, and airspeed."
