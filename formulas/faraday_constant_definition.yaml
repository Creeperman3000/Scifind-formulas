description: "The Faraday constant represents the magnitude of electric charge carried by one mole of elementary charge carriers such as electrons or protons, expressed in coulombs per mole. Following the 2019 SI redefinition it has an exact value derived from the elementary charge and the Avogadro constant. It is widely used in electrolysis calculations to relate the amount of substance transformed to the charge passed through an electrochemical cell."
