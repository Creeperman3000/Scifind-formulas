description: "Motional EMF is the electromotive force induced in a conductor that moves through a magnetic field, generated by the magnetic component of the Lorentz force separating charges along the conductor. It is the physical mechanism behind electrical generators and is a special case of Faraday's law of induction. The formula assumes the velocity, magnetic field, and conductor length are mutually perpendicular."
