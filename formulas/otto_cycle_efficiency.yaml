description: The Otto cycle models an idealized spark-ignition internal combustion
  engine with two isentropic and two constant-volume (isochoric) processes, and its
  thermal efficiency depends only on the compression ratio r and the heat capacity
  ratio γ of the working gas. Real gasoline engines approach but cannot exceed this
  efficiency, and higher compression ratios give higher efficiency until knock limits
  the allowable ratio.
