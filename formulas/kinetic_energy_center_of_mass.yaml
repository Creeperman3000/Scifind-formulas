description: The total kinetic energy of a system of particles decomposes into the
  kinetic energy of the center of mass plus the kinetic energy of the motion of the
  particles relative to the center of mass. This separation, sometimes known as Křiženecký's
  theorem or König's theorem, makes it convenient to treat a many-body system as a
  single point mass at the CM for translational dynamics.
equation: energy eq (mass mul (velocity pow 2) frac 2) add energy
