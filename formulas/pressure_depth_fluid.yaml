description: "The hydrostatic pressure exerted by a fluid at rest at depth h below its surface equals the product of the fluid's density, gravitational acceleration, and depth. This relation holds for incompressible fluids with a free surface, neglecting variations of g with position."
equation: pressure eq density mul (acceleration) mul length
