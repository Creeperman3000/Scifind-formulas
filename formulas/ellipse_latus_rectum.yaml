description: "The latus rectum of an ellipse is the chord that passes through a focus perpendicular to the major axis, and an ellipse has two such chords of equal length. Its length depends only on the semi-major axis a and semi-minor axis b, and it measures the width of the ellipse at the focus. This quantity appears in conic-section geometry and in the analysis of elliptical orbits."
