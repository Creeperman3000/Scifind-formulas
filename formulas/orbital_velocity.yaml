description: "For a small body in a circular orbit around a much more massive central body, the orbital velocity is the square root of the gravitational parameter divided by the orbital radius. It equals the circular speed at that radius and is the speed required for centripetal force to balance gravitational attraction in a closed circular orbit."
equation: velocity eq sqrt (gravitational_constant mul mass frac length) 2
