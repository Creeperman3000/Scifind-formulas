description: "Determines a reaction's activation energy from kinetic measurements taken at just two temperatures, eliminating the need to know the pre-exponential factor or draw an Arrhenius plot. It follows by subtracting the linearized Arrhenius expressions at the two conditions, so both temperatures must be in kelvin and distinct. Widely used in chemical kinetics to characterize the energy barrier of a reaction."
