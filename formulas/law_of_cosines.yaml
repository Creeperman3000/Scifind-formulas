description: The law of cosines generalizes the Pythagorean theorem to all triangles,
  relating the lengths of the three sides to the cosine of one of the included angles.
  It is used to solve a triangle when two sides and the included angle (SAS) or all
  three sides (SSS) are known, and reduces to the Pythagorean relation when the included
  angle is a right angle.
