description: For a given principal quantum number n, the azimuthal (orbital angular momentum) quantum number ℓ takes integer values from 0 to n−1, so the maximum allowed value is n−1. These ℓ values are commonly labelled s, p, d, f, ... and describe the shape of an electron's atomic orbital.
