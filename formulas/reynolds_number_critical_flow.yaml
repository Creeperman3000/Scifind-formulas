description: "The critical (or transitional) Reynolds number marks the threshold above which pipe flow becomes unstable and transitions from laminar to turbulent. The value is geometry-dependent, typically Re_D ≈ 2300 for flow in a circular pipe, and is widely used to predict flow regime in engineering design."
