description: "The common difference is the constant that defines an arithmetic sequence: it is what each term exceeds the previous term by, and it must be identical for every consecutive pair of terms. A positive value gives a growing sequence, a negative value a decreasing one, and zero a constant sequence. Finding it from two neighboring terms is the first step in most arithmetic progression problems."
