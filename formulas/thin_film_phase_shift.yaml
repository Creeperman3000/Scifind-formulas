description: Interference condition for light reflected from a thin film when a 180°
  phase change occurs on reflection, shifting the condition by a half-wavelength so
  the optical path difference equals a half-integer multiple of the wavelength. This
  is the situation for a film whose refractive index exceeds that of the medium on
  at least one side, and it underlies the colors of soap bubbles and oil films on
  water.
