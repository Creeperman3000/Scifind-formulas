description: "Optical transmittance is the dimensionless ratio of radiant flux transmitted through a material to the incident flux, indicating the fraction of light that passes through. It depends on the angle of incidence, polarization, and the refractive indices of the materials at each interface, and is closely related to reflectance and absorptance by energy conservation."
