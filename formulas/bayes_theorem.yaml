description: "Bayes' theorem describes how to update the probability of a hypothesis when new evidence is observed, relating the posterior probability to the likelihood, the prior, and the total probability of the evidence. It is the foundation of Bayesian inference and is widely used in statistics, medical diagnosis, spam filtering, and machine learning. The denominator acts as a normalizing constant and must be nonzero."
