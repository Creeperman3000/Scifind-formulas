description: "The instantaneous position of an undamped simple harmonic oscillator, expressed as a cosine of the angular frequency times elapsed time. With the standard choice of zero phase, the oscillator starts at maximum displacement; an arbitrary initial phase can be absorbed into the time origin for any equivalent sinusoidal description."
