description: When two coherent waves of the same frequency superpose in phase, their
  amplitudes combine in quadrature, giving a resultant amplitude equal to the square
  root of the sum of the squares of the individual amplitudes. This in-phase (constructive)
  result is a special case of the more general interference law that includes a phase-dependent
  cross term.
