description: "The Froude number is a dimensionless ratio of flow inertia to gravitational forces in free-surface or stratified flows, named after William Froude. It is widely used in naval architecture to compare wave-making resistance between ships of different sizes, in open-channel hydraulics to distinguish subcritical from supercritical flow, and in studies of animal locomotion."
