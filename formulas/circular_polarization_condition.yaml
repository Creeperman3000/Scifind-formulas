description: 'One of the two requirements for a monochromatic plane wave to be circularly
  polarized: the magnitudes of its two orthogonal transverse electric-field components
  must match, so neither axis of rotation is favored. The second requirement is a
  relative phase shift of a quarter cycle between the components; together they make
  the field vector rotate with constant magnitude.'
