description: The complete electromagnetic force on a point charge q moving with velocity
  v through electric field E and magnetic field B, given by the Lorentz force law.
  The electric component accelerates the particle along E, while the magnetic component
  qv×B deflects it perpendicular to both v and B. Together with Maxwell's equations
  it forms the foundation of classical electrodynamics.
