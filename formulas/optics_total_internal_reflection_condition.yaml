description: "Total internal reflection occurs when a wave traveling in an optically denser medium strikes a boundary with a less dense medium at an angle of incidence greater than the critical angle. Beyond this threshold Snell's law cannot be satisfied, so the wave is entirely reflected back into the denser medium, with only an evanescent field penetrating across the interface."
