description: "For a coil of N tightly wound turns in a changing magnetic field, Faraday's law states that the induced emf equals the negative of the total flux linkage rate of change. The negative sign is Lenz's law, expressing that the induced emf opposes the change producing it. This is the foundation of transformers, generators, and induction-based motors."
