description: The total translational kinetic energy of an ideal gas depends only on
  its amount of substance n and its absolute temperature T. Per molecule the average
  translational kinetic energy is three halves k_B T; for n moles, multiplying by
  Avogadro's number gives the same expression with the gas constant R.
