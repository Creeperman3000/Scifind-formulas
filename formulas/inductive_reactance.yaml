description: "Inductive reactance is the opposition that an inductor presents to alternating current. It is proportional to both the angular frequency and the inductance, increasing linearly with frequency. Inductive reactance stores energy in the magnetic field during part of each AC cycle and returns it during the next quarter cycle, so no net power is dissipated."
equation: resistance eq (pi mul 2) mul (frequency) mul inductance
