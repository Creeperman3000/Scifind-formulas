description: Gives the slow average velocity that charge carriers (such as free electrons) acquire along a conductor when a current flows, superimposed on their much faster random thermal motion. For a conductor of uniform cross-section, the drift speed depends on the current, the carrier number density, and the cross-sectional area. It explains why electrical signals travel fast even though individual electrons move only fractions of a millimetre per second.
