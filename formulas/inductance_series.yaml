description: "For non-coupled inductors connected in series, the equivalent inductance is the sum of the individual inductances, because the same current flows through every inductor and the total voltage is the sum of the individual voltage drops. The rule requires mutual inductance to be negligible; otherwise mutual-coupling terms appear in the expression."
