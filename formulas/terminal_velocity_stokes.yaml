description: "Stokes' law gives the drag force on a small sphere moving through a viscous fluid at very low Reynolds number, and equating it to the gravitational (and optional buoyancy) force gives the terminal settling velocity. The simplified form here is valid for a sphere whose effective mass m already accounts for buoyancy, or for a sphere in vacuum-like conditions where buoyancy is negligible."
equation: velocity eq mass mul (standard_gravity) frac ((dynamic_viscosity mul (length)
  mul 6) mul pi)
