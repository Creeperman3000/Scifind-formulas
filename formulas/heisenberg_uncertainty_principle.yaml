description: The position-momentum Heisenberg uncertainty relation states that the
  product of the uncertainty in position and the uncertainty in momentum of a quantum
  particle is bounded below by a constant of order the reduced Planck constant. It
  reflects the non-commutativity of the position and momentum operators and is the
  formal expression of the wave-particle duality of matter.
