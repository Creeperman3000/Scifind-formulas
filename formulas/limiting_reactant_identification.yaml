description: "The limiting reactant is the reactant that is fully consumed first and therefore caps the amount of product formed. For two reactants A and B, the one whose amount-of-substance divided by its stoichiometric coefficient is smallest is the limiting reactant, because that ratio equals the extent of reaction needed to drive that reagent to zero."
