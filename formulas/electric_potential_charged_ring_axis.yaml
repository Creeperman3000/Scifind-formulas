description: Gives the electric potential at a point on the symmetry axis of a thin
  ring carrying charge uniformly distributed around its circumference. Because every
  charge element is the same distance from an axial point, all contributions add equally;
  the potential is taken as zero at infinity and reduces to the point-charge value
  far from the ring.
