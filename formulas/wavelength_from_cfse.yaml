description: "The wavelength of light absorbed by a transition-metal complex is set by the energy gap between split d-orbitals. Reading this wavelength from the visible spectrum gives the crystal field splitting energy directly, and the spectrochemical series is built by ranking ligands according to this absorption wavelength."
