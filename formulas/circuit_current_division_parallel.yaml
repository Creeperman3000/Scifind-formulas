description: The current divider rule gives the share of a total current that flows
  through one of two parallel resistors. Because each branch sees the same voltage,
  the branch current is inversely proportional to its resistance, so the smaller resistor
  draws the larger current and the formula uses the opposite branch's resistance in
  the numerator. It applies to linear resistive networks with exactly two parallel
  branches.
