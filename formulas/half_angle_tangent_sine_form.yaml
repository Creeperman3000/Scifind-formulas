description: The tangent half-angle identity expresses tan(θ/2) in terms of the full-angle
  sine and cosine. It is widely used in calculus (Weierstrass/tangent half-angle substitution)
  to convert trigonometric integrals into rational form, and in geometry to relate
  rational values of the half-angle tangent to Pythagorean triples.
