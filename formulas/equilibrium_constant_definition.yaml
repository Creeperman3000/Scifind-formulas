description: 'Defines the equilibrium constant of a reversible reaction as the value
  the reaction quotient takes once equilibrium is reached: product concentrations
  appear in the numerator and reactant concentrations in the denominator, each raised
  to its stoichiometric coefficient. For a given temperature it is independent of
  the starting concentrations, making it the key quantity for predicting how far a
  reaction proceeds.'
