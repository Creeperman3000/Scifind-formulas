description: Molar conductivity is the conductivity of an electrolyte solution divided by its molar concentration of electrolyte, with SI units of S m² mol⁻¹. It is used to compare the conducting ability of different electrolytes and forms the basis of Kohlrausch's law of independent ionic migration.
