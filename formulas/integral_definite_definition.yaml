description: "A definite integral represents the signed area under the curve of a function between two bounds. In the Riemann-sum formulation the area is approximated as a finite sum of rectangles whose heights are the function values and whose widths are the subinterval widths; the integral is the limit of such sums as the partition becomes finer."
