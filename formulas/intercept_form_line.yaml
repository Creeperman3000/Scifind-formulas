description: "The intercept form expresses the equation of a non-vertical, non-horizontal straight line in the Cartesian plane that crosses both coordinate axes, using the x- and y-intercepts as parameters. The form is convenient for reading the two axis-intersection points directly and for computing the area of the right triangle formed by the line and the axes. It is derived from the two-point form and applies only when neither intercept is zero, i.e. the line does not pass through the origin and is not parallel to either axis."
