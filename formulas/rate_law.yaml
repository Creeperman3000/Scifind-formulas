description: "A rate law (or rate equation) expresses the rate of a chemical reaction as proportional to a rate constant times the concentrations of the reactants raised to empirically determined powers called reaction orders. The exponents and overall order cannot in general be deduced from stoichiometry and must be found experimentally, then used to infer information about the reaction mechanism."
