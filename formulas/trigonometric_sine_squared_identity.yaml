description: "This power-reduction identity rewrites the square of the sine of an angle in terms of the cosine of twice the angle. It is the sine form of the half-angle / power-reduction formulas, and is used in calculus for integrating powers of sine and in physics for expressing time-averaged values of squared sinusoidal functions."
equation: sin angle pow 2 eq (1 sub cos (angle mul 2) ) frac 2
