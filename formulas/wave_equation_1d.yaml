description: The one-dimensional wave equation is a second-order linear partial differential
  equation that governs the displacement of a vibrating string and many other one-dimensional
  wave phenomena. The second time derivative of the displacement is proportional to
  the second space derivative, with the proportionality constant being the square
  of the wave speed; its general solution is a superposition of left- and right-traveling
  waves known as d'Alembert's formula.
