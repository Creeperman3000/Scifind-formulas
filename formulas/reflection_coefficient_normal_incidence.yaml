description: The reflectance at normal incidence from a single interface between two
  non-absorbing media, derived from the Fresnel equations. It gives the fraction of
  incident optical power reflected; for example, an air-glass interface (n ≈ 1.5)
  reflects about 4% of normally incident light per surface.
equation: reflectance eq pow (frac (refractive_index sub refractive_index) (refractive_index
  add refractive_index) ) 2
