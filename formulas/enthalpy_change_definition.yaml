description: "Relates the enthalpy change of a system to its internal energy change plus the expansion work against a constant external pressure. This relation follows from the definition of enthalpy and holds for processes at fixed pressure, the usual condition for laboratory chemistry. It shows why enthalpy changes, not internal energy changes, are tabulated for reactions open to the atmosphere."
