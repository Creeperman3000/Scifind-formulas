description: The lateral (side) surface area of a right circular conical frustum with
  top radius, bottom radius, and height. It is computed as the product of the average
  of the two base circumferences and the slant height. The two circular bases are
  excluded; the total surface area additionally includes the two base disks.
equation: ((area) eq (pi mul ((length add length) mul (((length pow 2) add ((length
  sub length) pow 2)) sqrt 2))))
