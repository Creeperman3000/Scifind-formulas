description: The moment of inertia of a thin rectangular plate about the central axis
  perpendicular to the plate equals one-twelfth of the mass times the sum of the squares
  of the two side lengths. The plate is treated as flat (negligible thickness) and
  the axis passes through the geometric center.
equation: moment_of_inertia eq mass mul ((length pow 2) add length pow 2 ) frac 12
