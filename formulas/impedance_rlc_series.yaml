description: "The impedance of a series combination of a resistor, inductor, and capacitor is the magnitude of the vector sum of the resistance and the net reactance. At resonance X_L equals X_C so the impedance collapses to R; off-resonance it grows with the reactance difference."
equation: resistance eq ( ( resistance pow 2 add ( resistance sub resistance ) pow 2 ) sqrt 2 )
