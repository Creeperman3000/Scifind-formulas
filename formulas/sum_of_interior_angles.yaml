description: For any simple polygon with n sides, the interior angles sum to 180(n
  − 2) degrees or (n − 2)π radians, equivalent to partitioning the polygon into n
  − 2 triangles. The corresponding sum of exterior angles (one per vertex) is 360
  degrees.
