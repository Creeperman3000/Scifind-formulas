description: "The energy-time uncertainty relation bounds the product of the uncertainty in the energy of a quantum state and the characteristic time interval over which that state evolves. A short-lived excited state therefore has a large energy width, which is the basis for the natural linewidth of spectral lines and the lifetime-broadening observed in particle decays and resonances."
