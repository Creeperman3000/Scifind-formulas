description: "General form of the Doppler effect for sound, covering a source and an observer both moving along the line joining them. Signs are chosen by direction of motion: motion toward each other raises the observed pitch, motion apart lowers it. It assumes non-relativistic speeds relative to the wave speed in the medium and breaks down as the source speed approaches the speed of sound."
