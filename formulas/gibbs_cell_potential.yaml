description: "The maximum non-expansion work obtainable from an electrochemical reaction equals the change in Gibbs free energy, which is related to the cell potential by the negative of the number of moles of electrons transferred times the Faraday constant times the cell potential. A positive cell potential corresponds to a spontaneous reaction with negative Gibbs free energy change."
