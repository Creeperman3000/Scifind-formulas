description: "The surface area of a ring torus equals the product of the circumference of its generating circle and the circumference traced by the circle's centre, a direct consequence of Pappus's centroid theorem. \nThe formula assumes R greater than r (a non-self-intersecting ring torus) and is used in engineering analyses of pipes, gaskets, and toroidal coils."
equation: area eq 4 mul ((pi pow 2) mul (length) mul length )
