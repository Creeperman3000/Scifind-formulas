description: The moment of inertia of a thin uniform rod about a perpendicular axis
  through its center equals one-twelfth of the mass times the squared length. The
  rod is idealized as a one-dimensional wire of negligible thickness, so the result
  applies to batons, baseball bats (approximately), and slender beams in torsional
  analyses.
equation: moment_of_inertia eq mass mul (length pow 2) frac 12
