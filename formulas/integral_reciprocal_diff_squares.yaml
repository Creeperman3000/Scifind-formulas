description: The antiderivative of 1/(a²-x²) is a logarithm of the ratio (a+x)/(a-x),
  divided by 2a. The integrand is typically handled by partial fractions after factoring
  the difference of squares, and the result is defined on each open interval between
  the poles at x = ±a.
