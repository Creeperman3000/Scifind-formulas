description: "The Rayleigh–Jeans law is the classical low-frequency approximation to the spectral energy density of blackbody radiation, derived from the equipartition theorem applied to standing electromagnetic waves. It agrees with measurements at long wavelengths (low frequencies) but diverges at short wavelengths, the failure known as the ultraviolet catastrophe that motivated Planck's quantum hypothesis."
