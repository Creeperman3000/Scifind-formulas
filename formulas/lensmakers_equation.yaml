description: The thin-lens form of the lensmaker's equation gives the reciprocal focal
  length of a thin spherical lens in air as a function of its refractive index and
  the radii of curvature of its two surfaces. It assumes negligible lens thickness
  and paraxial rays, and is widely used to design and analyse optical instruments.
equation: wavenumber eq (dimensionless sub 1) mul ((1 frac length) sub 1 frac length
  )
