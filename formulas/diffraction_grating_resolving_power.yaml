description: "The resolving power measures a grating's ability to separate two closely spaced spectral lines, defined as the average wavelength divided by the smallest resolvable wavelength difference under the Rayleigh criterion. It grows with both the diffraction order and the number of illuminated grooves, and it is a key specification for spectrometer design."
