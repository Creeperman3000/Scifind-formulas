description: "The standard cell potential is connected to the equilibrium constant of the underlying redox reaction through the Gibbs free energy. Because the cell can do electrical work only when the reaction is spontaneous, this relation lets one determine tabulated E° values from thermodynamic equilibrium data (and vice versa) at any reference temperature, normally 298 K."
