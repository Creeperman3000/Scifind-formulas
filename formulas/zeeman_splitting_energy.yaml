description: "In the weak-field (anomalous) Zeeman effect, an external magnetic field shifts atomic energy levels by an amount proportional to the Bohr magneton, the magnetic field strength, the Landé g-factor, and the magnetic quantum number for the total electronic angular momentum. This splitting of degenerate atomic states into multiple sublevels is the basis for techniques such as electron spin resonance and for measuring stellar and laboratory magnetic fields."
