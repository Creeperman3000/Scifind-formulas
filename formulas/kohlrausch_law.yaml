description: "Kohlrausch's law of independent migration of ions states that at infinite dilution the limiting molar conductivity of an electrolyte equals the sum of the limiting molar ionic conductivities of its cation and anion, each multiplied by the number of such ions in the formula unit. The contributions of different ions are additive and independent of the partner ion."
