description: "Mass-to-mass stoichiometry uses the balanced chemical equation and molar masses to convert the known mass of one substance into the mass of another participating in the reaction. The conversion chains the mass of reactant A through grams-to-moles, the mole ratio from stoichiometric coefficients, and moles-to-grams using molar mass. It assumes the reaction proceeds as written and that A is the limiting reactant."
