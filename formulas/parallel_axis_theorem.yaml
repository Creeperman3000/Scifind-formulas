description: "The parallel axis theorem (Huygens-Steiner) relates the moment of inertia of a rigid body about any axis to its moment of inertia about a parallel axis through the center of mass, adding the body's mass times the squared perpendicular distance between the axes. It is used to compute the inertia of composite bodies from a catalog of standard shapes."
equation: moment_of_inertia eq moment_of_inertia add mass mul length pow 2
