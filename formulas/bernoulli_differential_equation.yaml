description: The Bernoulli differential equation is a first-order ordinary differential
  equation, named after Jacob Bernoulli, that is nonlinear unless the exponent on
  the dependent variable is zero or one. It is solved by the substitution u = y^(1-n),
  which converts it into a linear differential equation solvable with an integrating
  factor. The logistic equation is a notable special case.
