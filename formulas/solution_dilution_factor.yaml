description: "The dilution factor expresses how much a solution has been diluted, defined as the ratio of the final (diluted) solution volume to the volume of the original concentrated stock solution. Together with the dilution equation c1V1 = c2V2, it is the basis for serial-dilution protocols used in microbiology, pharmacology, and analytical chemistry."
