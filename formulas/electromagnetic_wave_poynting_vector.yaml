description: "The Poynting vector gives the directional energy flux of an electromagnetic field, that is, the power transported per unit area, measured in watts per square meter. Its magnitude equals the product of the electric and magnetic field magnitudes divided by the vacuum permeability, valid when the fields are perpendicular as in a plane wave; its direction is the direction of energy flow."
