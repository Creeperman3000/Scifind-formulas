description: "The activity of a radioactive sample is its rate of decay, measured in becquerels (decays per second). It is directly proportional to the number of undecayed radioactive nuclei present, with the decay constant as the proportionality factor representing the per-nucleus decay probability per unit time. As nuclei decay, both their number and the sample's activity fall off exponentially together."
