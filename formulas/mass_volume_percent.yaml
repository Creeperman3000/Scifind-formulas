description: "Mass/volume percent is a common way to express the concentration of a solute in a solution, defined as the mass of solute per 100 mL of solution. It is widely used in clinical and pharmaceutical contexts (e.g. mg/mL is equivalent to 1% m/v) where the solute is a solid dissolved in a liquid. The expression is not the same as mass percent (m/m) or volume percent (v/v)."
