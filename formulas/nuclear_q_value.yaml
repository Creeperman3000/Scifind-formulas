description: The Q-value of a nuclear reaction is the energy released or absorbed as a result of the reaction, computed from the difference between the rest masses of the initial reactants and final products via E=mc². A positive Q indicates an exothermic reaction, while a negative Q indicates an endothermic one.
equation: energy eq (mass sub mass ) mul speed_of_light pow 2
symbol_overrides:
  - energy: Q
  - mass: m_{initial}
  - mass: m_{final}
name_overrides:
  - energy: Reaction Q-value
  - mass: Initial [mass]
  - mass: Final [mass]
