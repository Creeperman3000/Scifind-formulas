description: "The Clausius statement says heat cannot spontaneously flow from a colder body to a hotter body; any such transfer requires external work and produces changes elsewhere in the system. It is one of the classic equivalent formulations of the second law of thermodynamics and is equivalent to the Kelvin-Planck statement."
