description: "The centroid of a triangle is the point where its three medians intersect, and it acts as the triangle's center of mass for a uniform lamina. In coordinates it is found by averaging the vertices' positions separately in each direction. The centroid always lies inside the triangle and divides each median in a 2:1 ratio."
