description: "The relative approach velocity is the velocity of one colliding body as seen from the other, measuring how quickly the two bodies close on each other along the line of impact. A positive value indicates they are approaching; it is a key input for the coefficient-of-restitution relation used to analyze one-dimensional collisions."
