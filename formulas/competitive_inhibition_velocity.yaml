description: This modified Michaelis-Menten relation gives the initial reaction rate
  of an enzyme when a competitive inhibitor competes with the substrate for binding
  at the active site. The inhibitor raises the apparent Michaelis constant while leaving
  the maximum velocity unchanged, so inhibition can be overcome at high substrate
  concentration. It is widely used to analyze enzyme kinetics and to characterize
  inhibitor drugs.
