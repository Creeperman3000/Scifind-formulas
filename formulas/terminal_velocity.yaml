description: The constant speed reached by a falling object when the downward gravitational
  force balances the upward drag force from the surrounding fluid, neglecting buoyancy.
  It depends on the object's mass and projected area as well as the fluid's density
  and the drag coefficient, and is widely applied in skydiving, aerosol and sediment
  transport, and meteorology.
equation: ((velocity) eq (((2 mul mass mul standard_gravity) frac (density mul area
  mul dimensionless)) sqrt 2))
