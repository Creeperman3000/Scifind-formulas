description: "A statement of the second law of thermodynamics: evaluated over any complete cycle, the net heat delivered to a system divided by the temperature at which it is exchanged cannot be positive. The equality holds only for fully reversible cycles, while real (irreversible) cycles give a negative value. This inequality underlies the definition of entropy and limits the performance of engines and refrigerators."
equation: oint drop drop (energy frac temperature) leq 0
