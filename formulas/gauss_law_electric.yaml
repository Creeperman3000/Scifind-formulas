description: Gauss's law for electricity, one of Maxwell's equations, states that
  the net electric flux through any closed surface (a Gaussian surface) is proportional
  to the total electric charge enclosed by that surface. It provides a powerful symmetry-based
  method for computing electric fields of highly symmetric charge configurations and
  is equivalent to Coulomb's law.
