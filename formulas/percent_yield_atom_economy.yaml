description: "Atom economy, introduced by Barry Trost in 1991, is a measure of how efficiently a chemical reaction incorporates the atoms of its reactants into the desired product. It is a key metric of green chemistry and complements percent yield, because even a high-yielding reaction can produce large amounts of unwanted byproducts. The ideal value is 100%, achieved only when every reactant atom ends up in the target molecule."
