description: "Known as Jurin's law, this relation gives the height to which a wetting liquid climbs (or is depressed) in a narrow tube due to surface tension acting against the weight of the liquid column. The rise grows with surface tension and shrinks as the tube gets wider or the liquid denser; a contact angle beyond ninety degrees flips the effect to a depression, as with mercury in glass. It assumes a thin cylindrical tube and a static equilibrium meniscus."
