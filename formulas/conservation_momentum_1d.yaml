  - https://ocw.mit.edu/courses/16-07-dynamics-fall-2009/a867999737497c79fd8ffe97641c503f_MIT16_07F09_Lec09.pdf
description: "In an isolated system of two colliding bodies moving along one line, the total linear momentum before the collision equals the total after, even though each body's momentum generally changes. This holds for elastic and inelastic collisions alike and follows from Newton's third law when no net external force acts. Velocities are signed, so direction is handled by sign convention."
