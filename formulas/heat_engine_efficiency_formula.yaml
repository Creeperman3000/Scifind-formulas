description: "Heat engine efficiency is the ratio of useful work output produced by a heat engine to the heat energy supplied from the high-temperature reservoir. By the second law of thermodynamics, this efficiency is always less than one, with the Carnot efficiency (depending only on the temperatures of the hot and cold reservoirs) setting the upper bound."
