description: "In a one-dimensional perfectly elastic collision, the relative speed at which two bodies approach each other before impact equals the relative speed at which they separate afterward. This follows from conserving both momentum and kinetic energy, and it corresponds to a coefficient of restitution of one. It serves as a shortcut equation when solving elastic collision problems."
