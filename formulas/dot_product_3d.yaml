description: Computes the scalar (dot) product of two spatial vectors by multiplying
  matching Cartesian components and adding the three products. The value equals the
  product of the vectors' magnitudes and the cosine of the angle between them, so
  it vanishes for perpendicular vectors and is maximal for parallel ones. Widely used
  in physics and engineering to compute work, projections, and angles in space.
