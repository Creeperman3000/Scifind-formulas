description: "The impulse-momentum theorem states that the impulse delivered to an object equals its change in momentum. For a constant net force, this reduces to a simple product of the force and the time interval over which it acts. The general integral form expresses momentum change as the time integral of the net force and is foundational for analyzing collisions and short-duration forces."
