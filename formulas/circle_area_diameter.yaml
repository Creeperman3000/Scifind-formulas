description: "Computes the area enclosed by a circle directly from its diameter, avoiding the intermediate step of halving to get the radius. It follows from the standard radius-based area formula together with the relation that a diameter is twice a radius. Useful whenever a measured or specified size is given as a diameter, such as pipes, disks, and wheels."
equation: area eq pi mul (length pow 2) frac 4
