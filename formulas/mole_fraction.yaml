description: The mole fraction (or amount fraction) of a component in a mixture is
  the ratio of its amount of substance to the total amount of all components; it is
  a dimensionless quantity that is temperature-independent and widely used in phase
  diagrams, gas mixtures, and colligative-property calculations. Because the mole
  fractions of all components sum to one, the quantity for one component determines
  the rest in a binary mixture.
