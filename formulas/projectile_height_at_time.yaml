description: "Gives the vertical position of a projectile as a function of elapsed time, assuming launch from ground level with uniform downward gravitational acceleration and no air resistance. The first term represents the contribution of the initial vertical velocity and the second term the downward displacement due to gravity."
equation: length eq velocity mul (sin angle ) mul (time) sub acceleration mul (time pow 2 ) frac 2
symbol_overrides:
- length: y
- velocity: v_0
- angle: θ
- acceleration: g
name_overrides:
- length: Vertical position
- velocity: Initial [velocity]
- angle: Launch angle
- time: '[time]'
- acceleration: Gravitational [acceleration]
