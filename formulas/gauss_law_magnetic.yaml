description: 'Gauss''s law for magnetism, one of Maxwell''s equations, states that
  the net magnetic flux through any closed surface is zero. It is equivalent to the
  nonexistence of magnetic monopoles: magnetic field lines form closed loops with
  no sources or sinks.'
