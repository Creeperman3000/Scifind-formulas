description: "Special case of Bernoulli's equation at constant height (Bernoulli's principle); valid for steady, incompressible, inviscid flow along a horizontal streamline. With the elevation terms gone, it shows that where the fluid speed increases the static pressure must decrease. It underlies venturi meters, atomizers, and airfoil lift arguments."
