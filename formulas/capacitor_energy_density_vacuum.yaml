description: "The energy stored in an electric field is spread throughout the space the field occupies, and this quantity gives the energy per unit volume held by the field between capacitor plates in vacuum. Because it depends only on the local field strength, it applies point-by-point to any electrostatic field configuration, not just parallel-plate capacitors. A dielectric-filled gap would use the material permittivity instead."
equation: energy_density eq vacuum_permittivity mul (electric_field_strength pow 2) frac 2
