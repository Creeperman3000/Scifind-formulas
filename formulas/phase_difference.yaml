description: Converts a geometric path difference into a phase difference for two coherent waves of the same wavelength. The relation follows directly from the wave number k = 2π/λ and assumes both waves travel in the same medium.
equation: angle eq ((2 mul pi) mul length) frac length
symbol_overrides:
- angle: Δφ
- length: Δx
- length: λ
