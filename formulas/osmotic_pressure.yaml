description: >-
  Osmotic pressure is the minimum pressure that must be applied to a solution
  to stop the inward flow of pure solvent across a semipermeable membrane, and
  it is a colligative property. The van 't Hoff relation gives the pressure
  as the product of the dimensionless van 't Hoff factor (accounting for
  dissociating solutes), the molar solute concentration, the gas constant, and
  the absolute temperature, valid for dilute ideal solutions.
