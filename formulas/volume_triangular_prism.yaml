description: "The volume of any prism equals the area of its base times the perpendicular distance between the two parallel base planes. For a triangular prism the base is a triangle, so multiplying the triangle's area by the prism's length gives the volume; for a right triangular prism with equilateral bases the result further reduces to a closed form in the edge length."
equation: volume eq area mul length
