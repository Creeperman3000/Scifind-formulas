description: The standard entropy of reaction is the entropy change when a reaction
  proceeds under standard-state conditions. It is computed by taking the sum of the
  standard molar entropies of the products and subtracting the sum of those of the
  reactants (each term weighted by its stoichiometric coefficient), analogous to the
  calculation for the standard enthalpy of reaction.
