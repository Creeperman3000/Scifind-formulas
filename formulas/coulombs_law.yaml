description: 'Coulomb''s law gives the magnitude of the electrostatic force between
  two point charges at rest: it is proportional to the product of the charges, inversely
  proportional to the square of their separation, and directed along the line joining
  them. Like charges repel and opposite charges attract. It is the foundation of electrostatics,
  valid for point charges or spherically symmetric charge distributions.'
