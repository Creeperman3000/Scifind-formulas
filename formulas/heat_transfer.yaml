description: The amount of heat transferred to or from an object equals the product
  of its mass, its specific heat capacity, and the change in its temperature. This
  is the sensible-heat relation used in calorimetry and process heating/cooling calculations,
  and it applies to substances whose specific heat can be treated as approximately
  constant over the temperature interval of interest.
