description: "Thin-film interference arises when light reflected from the upper and lower surfaces of a thin transparent film recombines, producing constructive or destructive fringes depending on the optical path difference. The relation shown gives the bright (constructive) fringe condition for a film whose two reflected waves incur equal phase shifts, in which case the round-trip optical path 2nt must equal an integer number of wavelengths."
