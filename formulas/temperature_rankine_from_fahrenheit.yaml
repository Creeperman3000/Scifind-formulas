description: "Converts a Fahrenheit reading to the equivalent temperature on the absolute Rankine scale. Because Rankine uses Fahrenheit-sized degree intervals but is anchored at absolute zero, the conversion is just a constant offset of 459.67 degrees, used in engineering systems that work in Fahrenheit while still requiring an absolute thermodynamic scale."
equation: temperature eq temperature add 459.67
