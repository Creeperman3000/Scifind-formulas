description: The kinetic theory expression for the pressure of an ideal gas relates
  pressure to the number of molecules, the molecular mass, the mean-square molecular
  speed, and the volume occupied. It provides the microscopic basis for the ideal
  gas law and shows that temperature is proportional to the average translational
  kinetic energy of the molecules.
equation: pressure eq dimensionless mul (mass mul velocity pow 2) frac 3 mul volume
