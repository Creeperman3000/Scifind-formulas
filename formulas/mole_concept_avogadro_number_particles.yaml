description: "One mole of any substance contains exactly the Avogadro number of elementary entities (atoms, molecules, ions, or formula units). Multiplying an amount of substance expressed in moles by the Avogadro constant gives the number of particles in the sample; this is the defining relation of the mole as a counting unit in chemistry."
