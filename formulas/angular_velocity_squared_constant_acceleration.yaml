name: Angular velocity squared relation
id: angular_velocity_squared_constant_acceleration
topic: circular_motion
difficulty: 6
links:
  - https://phys.libretexts.org/Bookshelves/College_Physics/College_Physics_1e_(OpenStax)/10%3A_Rotational_Motion_and_Angular_Momentum/10.02%3A_Kinematics_of_Rotational_Motion
