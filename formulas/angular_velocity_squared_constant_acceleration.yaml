description: "This rotational kinematic relation connects a spinning body's initial and final angular speeds to the angle turned through, without involving the elapsed time. It holds only for constant angular acceleration and is the exact analogue of the corresponding straight-line motion equation, making it handy whenever the rotation time is unknown or irrelevant."
equation: angular_velocity pow 2 eq (angular_velocity pow 2) add dimensionless mul angular_acceleration mul angle
symbol_overrides:
- angular_velocity: ω
- angular_velocity: \omega_0
- dimensionless: '2'
name_overrides:
- angular_velocity: Final angular [velocity|velocity]
- angular_velocity: Initial angular [velocity|velocity]
- dimensionless: Two
- angle: Angle
