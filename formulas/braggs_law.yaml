description: 'Bragg''s law gives the condition for constructive interference of waves
  (typically X-rays) scattered by successive planes of atoms in a crystal: diffraction
  peaks occur only when the extra path difference between neighboring planes is a
  whole number of wavelengths. It is the basis of X-ray crystallography for determining
  crystal structures.'
