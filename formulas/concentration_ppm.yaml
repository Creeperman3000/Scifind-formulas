description: 'Parts per million expresses trace-level concentrations: how many parts
  of solute are present per million parts of solution, by mass. It is used for very
  dilute mixtures such as pollutants in water or air, where molarity would be an unwieldy
  tiny number. Both masses must be in the same units, and the mass of solution includes
  the solute itself.'
