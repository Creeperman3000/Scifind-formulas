description: "The average atomic mass of an element is the weighted mean of the masses of its naturally occurring isotopes, each weighted by its fractional abundance in nature (the fractions must sum to one). It is the decimal mass value quoted on the periodic table and is used for stoichiometry with naturally mixed samples."
