description: "In a two-dimensional collision with no net external force, each component of the total momentum is conserved independently. This is the x-axis statement of that law: it equates the sum of the objects' initial x-components of momentum with the sum of their final x-components. It is written out alongside an identical y-component equation, giving two scalar equations for analyzing glancing collisions."
