description: The relativistic invariant relating a free particle's total energy to its rest mass and momentum in special relativity. It reduces to the rest-energy relation when momentum vanishes and to E = pc for massless particles such as photons.
equation: energy pow 2 eq (momentum pow 2) mul (speed_of_light pow 2) add (mass pow 2) mul speed_of_light pow 4
