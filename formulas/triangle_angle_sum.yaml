description: "States that the three interior angles of any Euclidean plane triangle add up to a straight angle, which is pi radians or 180 degrees. It is equivalent to Euclid's parallel postulate and fails in spherical and hyperbolic geometry. The relation lets one compute a missing angle when the other two are known and underpins many theorems in Euclidean geometry and trigonometry."
