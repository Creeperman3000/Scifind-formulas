description: "The closed-form solution of the proportional-growth differential equation: a quantity grows exponentially from its initial value, with the growth rate setting how fast it multiplies over time. It applies to unconstrained population growth, continuously compounded interest, and any process whose rate of change is proportional to the amount present; it assumes the growth rate stays constant."
