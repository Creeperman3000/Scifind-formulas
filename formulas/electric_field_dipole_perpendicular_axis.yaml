description: Gives the electric field at a point on the equatorial line (perpendicular
  bisector) of an electric dipole, in the far-field limit where the point is much
  farther from the dipole than the charge separation. The field falls off as the cube
  of the distance, is half the axial field at the same distance, and points opposite
  to the dipole moment.
equation: electric_field_strength eq ( ( coulomb_constant mul charge mul length ) frac length ) pow 3
