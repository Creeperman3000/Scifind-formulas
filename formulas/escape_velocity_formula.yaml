name: Escape velocity
id: escape_velocity_formula
topic: escape_velocity
difficulty: 6
links:
  - https://en.wikipedia.org/wiki/Escape_velocity
  - https://en.wikipedia.org/wiki/Gravitational_potential_energy
description: "The minimum launch speed at which a projectile leaves a body's gravitational field and coasts to infinity without further propulsion, derived from conservation of energy by equating kinetic energy to the depth of the gravitational potential well. It depends only on the body's mass and the starting distance from its center, not on the projectile's own mass or launch direction. Assumes no atmospheric drag and no other gravitational influences."
equation: velocity eq sqrt (dimensionless mul (gravitational_constant) mul (mass)
  frac length ) 2
symbol_overrides:
- velocity: v_{esc}
- dimensionless: '2'
- mass: M
- length: r
