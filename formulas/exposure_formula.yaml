description: "Radiation exposure is a dosimetric quantity that measures the ionization produced by X-ray or gamma-ray photons in air, defined as the electric charge liberated by the radiation per unit mass of air. Its SI unit is the coulomb per kilogram (C/kg), which has largely replaced the legacy röntgen (R). Exposure is used in radiation protection as an intermediate step between source activity and quantities such as absorbed or equivalent dose that more directly describe energy deposition in tissue."
