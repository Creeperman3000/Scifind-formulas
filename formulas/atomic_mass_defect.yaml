description: "The mass defect of an atomic nucleus is the amount by which the nucleus's actual mass falls short of the combined mass of its separated protons and neutrons. This missing mass was converted to binding energy when the nucleus formed, so multiplying the defect by the speed of light squared gives the nuclear binding energy."
