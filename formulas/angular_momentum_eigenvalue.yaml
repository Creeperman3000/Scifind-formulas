description: In quantum mechanics, measurement of the projection of orbital angular
  momentum along a chosen axis yields only discrete values. Each allowed value is
  set by the magnetic quantum number and expressed in units of the reduced Planck
  constant; this quantization underlies atomic energy-level splittings such as the
  Zeeman effect.
