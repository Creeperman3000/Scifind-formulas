description: The derivative of the cosecant function is the negative product of cosecant
  and cotangent. It follows from applying the quotient rule to cosecant written as
  one over sine, and holds wherever sine is nonzero with angles measured in radians.
equation: frac rmd (frac 1 sin angle ) rmd angle eq 0 sub frac 1 sin angle mul frac
