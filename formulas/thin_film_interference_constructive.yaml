description: Condition for constructive interference in the light reflected from a
  thin film in which only one of the two boundaries introduces a 180° phase shift
  (the typical case for a film of higher refractive index than both surrounding media,
  such as a soap film in air or an oil film on water). The half-wavelength phase shift
  displaces the constructive maxima to half-integer multiples of the wavelength.
