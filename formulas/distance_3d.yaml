description: Gives the straight-line (Euclidean) distance between two points in three-dimensional
  Cartesian space, obtained by applying the Pythagorean theorem twice along the diagonal
  of a rectangular box with the points at opposite corners. It is used throughout
  coordinate geometry, physics, and computer graphics.
