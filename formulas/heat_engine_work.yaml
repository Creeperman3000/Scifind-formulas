description: "By the first law of thermodynamics, the work output of a cyclic heat engine equals the heat absorbed from the high-temperature reservoir minus the heat rejected to the low-temperature reservoir. This is a direct consequence of energy conservation for any device that returns to its initial state after one complete cycle."
