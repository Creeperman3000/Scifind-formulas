description: "Volumetric flow rate is the volume of fluid that passes through a given cross section per unit time, conventionally denoted Q. For uniform flow across a flat cross section it reduces to the product of the cross-sectional area and the flow speed; in general it is the surface integral of the velocity field through the section, a relation fundamental to fluid dynamics, hydrology, and the continuity equation."
