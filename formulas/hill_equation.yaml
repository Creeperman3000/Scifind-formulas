description: 'The Hill equation describes the cooperative binding of a ligand to a
  macromolecule with multiple binding sites. It gives the fractional occupancy (or
  normalized response) as a sigmoidal function of ligand concentration, with the Hill
  coefficient n measuring the degree of cooperativity: n > 1 indicates positive cooperativity,
  n = 1 reduces to noncooperative (Michaelis-Menten-like) binding, and n < 1 indicates
  negative cooperativity. Originally formulated by Archibald Hill in 1910 to model
  sigmoidal oxygen binding to haemoglobin, it is widely used in pharmacology and enzyme
  kinetics to construct dose-response curves.'
