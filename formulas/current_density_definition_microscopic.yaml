description: "This relation connects the macroscopic current density in a conductor to the microscopic motion of its charge carriers: it equals the carrier number density times the charge per carrier times the average drift velocity. It applies when carriers of a single type drift through the material, as in metals or doped semiconductors, and shows why even tiny drift speeds yield sizable currents given enormous carrier densities."
