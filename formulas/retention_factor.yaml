description: The retention factor is the ratio of the distance traveled by an analyte to the distance traveled by the solvent front in planar chromatography, providing a characteristic value used to identify compounds. Values lie between zero and one, and the same stationary and mobile phases should be used when comparing R_f values across experiments.
