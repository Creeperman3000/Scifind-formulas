description: "The effective nuclear charge is the net positive attraction experienced by a particular electron in a multi-electron atom, reduced from the bare nuclear charge by the screening effect of the other electrons. Slater's rules give an empirical scheme for estimating the shielding constant from the electron configuration, and the result helps explain periodic trends such as atomic radius and ionization energy."
