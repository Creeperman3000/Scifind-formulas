description: "Angular velocity measures how fast a body rotates: it is the angular displacement swept out per unit time, quoted in radians per second in SI. This ratio defines the average angular velocity over an interval; the instantaneous value is the limit of this ratio as the interval shrinks to zero. It is the rotational counterpart of linear speed and applies to wheels, gears, planets, and any spinning rigid body."
