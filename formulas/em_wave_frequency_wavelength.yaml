description: "Relates the oscillation frequency of an electromagnetic wave to its wavelength through the speed of light, which is the same for all such waves in vacuum. Frequency and wavelength are inversely proportional: short wavelengths correspond to high frequencies, as across the spectrum from radio waves to gamma rays. In a material medium the speed of light is replaced by the slower phase velocity in the medium."
