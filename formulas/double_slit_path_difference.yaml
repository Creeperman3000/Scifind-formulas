description: "Gives the extra distance one wave travels compared with the other from the two slits of a double-slit setup to a point seen at angle theta on a distant screen. Comparing this difference to the wavelength determines whether the waves arrive in phase (constructive interference, bright fringe) or out of phase (destructive, dark fringe). It relies on the far-field approximation, where the two rays are essentially parallel."
