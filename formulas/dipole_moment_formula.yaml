description: "Measures the polarity of a bond or molecule as the product of the magnitude of the separated charge and the distance between the charge centers, with SI units of coulomb-meters (often expressed in debyes). It is used to predict molecular polarity and how molecules align in electric fields; it applies to two equal and opposite charges separated by a fixed distance."
