description: "Gauge pressure is the pressure of a system measured relative to the local ambient atmospheric pressure, so it reads zero at atmospheric conditions and is positive or negative relative to that reference. It is the quantity most pressure gauges and tire-pressure meters display directly, since they are typically referenced to the surrounding atmosphere rather than to a perfect vacuum."
