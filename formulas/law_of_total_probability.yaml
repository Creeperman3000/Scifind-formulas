description: "The law of total probability expresses the marginal probability of an event as a weighted sum of its conditional probabilities over a partition of mutually exclusive and exhaustive events. It is a fundamental tool used together with Bayes' theorem to update probabilities in hierarchical or partitioned sampling situations."
