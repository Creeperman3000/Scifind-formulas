description: "Fourier's law gives the rate of conductive heat transfer through a homogeneous slab of thickness L and cross-sectional area A as the product of thermal conductivity, area, and the temperature difference across the slab, divided by the thickness. It applies to one-dimensional, steady-state conduction without internal heat generation and is the thermal analog of Ohm's law for an electrical resistor."
