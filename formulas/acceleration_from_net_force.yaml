description: "This is Newton's second law solved for acceleration: a body's acceleration is directly proportional to the net (resultant) external force acting on it and inversely proportional to its mass, pointing in the direction of that net force. It applies to any object or system of constant mass and is the standard starting point for dynamics problems. The force must be the vector sum of all external forces, not any single force."
