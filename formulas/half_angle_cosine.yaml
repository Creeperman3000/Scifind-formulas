description: "Expresses the square of the cosine of half an angle in terms of the cosine of the full angle. It follows from the angle-addition identity cos(2a) = 2cos\u00b2(a) - 1, and is widely used to evaluate trigonometric expressions at angles such as 22.5\u00b0 or 75\u00b0."
