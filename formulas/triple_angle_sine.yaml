description: "This triple-angle identity expresses the sine of three times an angle as a polynomial in the sine of that angle. It is derived from the angle-addition formulas and is closely related to the corresponding triple-angle formula for cosine. The identity is used in simplifying cubic expressions in sin θ and in solving trigonometric equations of degree three."
