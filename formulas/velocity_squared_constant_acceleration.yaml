description: 'Third kinematic equation: it relates the squares of the initial and
  final velocities of an object undergoing uniform acceleration to the displacement
  traversed. It is time-independent and is useful when the time interval is unknown.'
equation: velocity pow 2 eq (velocity pow 2) add 2 mul acceleration mul length
