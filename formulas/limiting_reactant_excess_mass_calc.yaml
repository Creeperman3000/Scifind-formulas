description: "The mass of an excess reactant that remains after a chemical reaction is complete equals its initial mass minus the mass that was consumed. The consumed mass is determined by stoichiometry from the limiting reactant, so once the limiting reagent is identified the leftover excess can be computed directly."
equation: mass eq mass sub mass
symbol_overrides:
- mass: m_{excess}
- mass: m_{initial}
- mass: m_{consumed}
