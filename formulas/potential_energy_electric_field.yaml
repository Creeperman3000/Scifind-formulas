description: "The change in electric potential energy of a charge moved a displacement in a uniform electric field equals the negative of the work done by the field, which for a displacement parallel to the field direction reduces to the simple product of charge, field strength, and distance. The sign convention reflects that work must be done against the field to move a positive charge to higher potential."
