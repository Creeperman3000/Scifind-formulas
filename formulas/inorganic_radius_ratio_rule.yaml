description: The cation-anion radius ratio is the ratio of the radius of the cation
  to that of the surrounding anions in an ionic crystal. It is used as a first-approximation
  predictor of coordination number and polyhedral geometry, with each coordination
  number (3, 4, 6, 8, ...) corresponding to a characteristic minimum ratio below which
  the structure becomes unstable.
