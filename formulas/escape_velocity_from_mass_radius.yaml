name: Escape velocity from mass and radius
id: escape_velocity_from_mass_radius
topic: escape_velocity
difficulty: 6
links:
  - https://en.wikipedia.org/wiki/Escape_velocity
  - https://en.wikipedia.org/wiki/Gravitational_potential_energy
description: "Gives the minimum speed needed to break free from the gravitational pull of a planet or other spherical body, launched from its surface, in terms of the body's mass and radius. The required speed decreases with larger radius for a fixed mass and increases with the square root of the mass. Assumes a spherically symmetric body, no atmosphere, and no propulsion after launch."
equation: velocity eq ( ( ( 2 mul gravitational_constant ) mul ( mass ) frac length ) sqrt 2 )
symbol_overrides:
- velocity: v_{esc}
- mass: M
- length: R
