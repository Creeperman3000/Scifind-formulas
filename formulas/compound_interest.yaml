description: This formula gives the future value of a sum of money earning compound
  interest, where interest is paid not only on the original principal but also on
  all previously accumulated interest. The rate is a nominal annual rate expressed
  as a decimal and applied over a whole number of compounding periods per year. It
  is standard for comparing savings accounts, investments, and loan balances.
