description: The most probable speed is the speed at which the Maxwell-Boltzmann speed
  distribution attains its maximum; it equals the square root of twice the product
  of the gas constant and absolute temperature divided by the molar mass (equivalently,
  twice the Boltzmann constant times temperature divided by the molecular mass). It
  is the simplest characteristic speed of an ideal gas in thermal equilibrium, smaller
  than the mean speed and the rms speed.
equation: ((velocity) eq (((2 mul (gas_constant mul temperature)) frac molar_mass)
  sqrt 2))
