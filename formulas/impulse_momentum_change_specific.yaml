description: "For an object of constant mass, the impulse delivered to it equals the change in its linear momentum, allowing impulse to be computed directly from the difference of the final and initial velocities multiplied by the mass. This is the specific (constant-mass) form of the impulse-momentum theorem, often used to analyze collisions where the force varies rapidly over a short contact time."
