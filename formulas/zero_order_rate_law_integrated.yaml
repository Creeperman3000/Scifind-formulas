description: "The integrated zero-order rate law expresses the concentration of a reactant as a linear function of time. Because the rate is independent of concentration, the reactant decays at a constant rate, giving a straight line on a plot of concentration versus time with slope equal to minus the rate constant. Zero-order behavior is most often observed when a catalyst or surface is saturated, such as in many enzyme-catalyzed reactions."
