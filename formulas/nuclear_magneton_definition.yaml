description: The nuclear magneton is the natural unit of magnetic dipole moment for
  heavy particles such as nucleons and nuclei, defined from the elementary charge,
  the reduced Planck constant, and the proton rest mass. It serves the same role for
  nuclear magnetic moments that the Bohr magneton serves for atomic magnetic moments.
