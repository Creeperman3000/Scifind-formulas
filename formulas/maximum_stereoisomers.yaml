description: "The Le Bel–van 't Hoff rule gives an upper bound of 2ⁿ stereoisomers for a molecule containing n stereogenic (chiral) centers. This assumes no internal symmetry; molecules with meso forms or other degeneracies will have fewer distinct stereoisomers. The bound is widely used in carbohydrate and natural-product chemistry to enumerate possible stereoisomers, for example, the 16 stereoisomers expected for an aldohexose such as glucose."
