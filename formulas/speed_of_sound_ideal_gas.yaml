description: The Newton–Laplace relation for an ideal gas expresses the speed of sound
  in terms of the adiabatic index (ratio of specific heats), the gas constant, the
  absolute temperature, and the molar mass. It assumes the medium behaves as an ideal
  gas undergoing adiabatic compression, so it is accurate at low pressures and for
  small-amplitude perturbations.
equation: velocity eq sqrt (dimensionless mul (gas_constant mul temperature) frac
  molar_mass) 2
