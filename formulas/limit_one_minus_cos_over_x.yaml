description: A small-angle limit in trigonometry. The numerator 1-cos x vanishes like
  x^2/2 near zero, which makes the ratio go to zero. The closely related limit (1-cos
  x)/x^2 = 1/2 is the more commonly used result and underlies the second-order small-angle
  approximation of cosine.
