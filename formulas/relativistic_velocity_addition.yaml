description: The relativistic velocity-addition formula combines the velocity of an
  object in one inertial frame with the relative velocity of a second frame, producing
  the object's velocity as seen from the first. The result is always subluminal, in
  agreement with the postulate that no signal can outrun light.
equation: velocity eq (velocity add velocity) frac dimensionless add (velocity mul
  velocity) frac speed_of_light pow 2
