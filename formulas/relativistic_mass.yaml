description: "Relativistic mass is the frame-dependent mass obtained by multiplying a body's rest mass by the Lorentz factor. Modern particle and nuclear physics generally avoids the term in favor of working directly with relativistic energy, but the concept is still widely used in introductory treatments and in relativistic quantum chemistry."
