description: "Defines the electric field strength at a point as the electrostatic force per unit charge experienced by a small positive test charge placed there. It is a vector quantity pointing along the force on a positive charge, measured in newtons per coulomb (or volts per meter), and assumes the test charge is small enough not to disturb the source charges."
