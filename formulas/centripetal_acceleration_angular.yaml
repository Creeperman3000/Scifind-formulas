- https://openstax.org/books/university-physics-volume-1/pages/6-3-centripetal-force
- https://openbooks.lib.msu.edu/collegephysics1/chapter/centripetal-acceleration-2/
description: Expresses the magnitude of centripetal acceleration using the angular
  velocity of the circular motion instead of the linear speed. It is equivalent to
  the speed-based form via the relation between arc length and angle, and is convenient
  for rotating systems such as wheels, centrifuges, and orbits where the rotation
  rate is known. Valid for uniform circular motion.
equation: acceleration eq length mul angular_velocity pow 2
