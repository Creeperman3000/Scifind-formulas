description: "Specific impulse measures how efficiently a reaction engine generates thrust from propellant. It is the thrust divided by the propellant mass flow rate and is also expressed in seconds by dividing further by standard gravity, so it is the time a unit mass of propellant can produce a unit of thrust."
equation: time eq force frac mass_concentration mul standard_gravity
