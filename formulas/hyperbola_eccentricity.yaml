description: The eccentricity of a hyperbola, a dimensionless number greater than
  1 that measures how open the curve is. It is defined in terms of the semi-transverse
  axis a and the semi-conjugate axis b and determines the focal distance c and the
  angle the asymptotes make with the major axis.
