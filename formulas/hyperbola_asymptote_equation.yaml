description: "The straight line that the branches of a centered hyperbola approach at large distance, used to sketch the curve and to analyze its behavior at infinity. A standard hyperbola has two symmetric asymptotes passing through the center with slope determined by the ratio of the semi-conjugate to the semi-transverse axis."
