description: The Euclidean norm (also called the 2-norm or magnitude) assigns to a
  vector in real n-dimensional space the non-negative real number that corresponds
  to its geometric length. It satisfies absolute homogeneity, the triangle inequality,
  and is zero only for the zero vector, and is the most commonly used norm on R^n.
