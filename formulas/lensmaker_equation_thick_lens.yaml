description: The thick-lens form of the lensmaker's equation gives the reciprocal
  focal length (optical power) of a spherical lens in terms of its refractive index,
  thickness, and the radii of curvature of its two surfaces. It reduces to the thin-lens
  form when the thickness is small compared to the radii of curvature.
equation: wavenumber eq (refractive_index sub 1) mul ((1 frac length) sub (1 frac
  length) add (refractive_index sub 1) mul length frac refractive_index mul length
  mul length )
