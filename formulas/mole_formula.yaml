description: "The amount of substance in a sample is obtained by dividing its mass by the molar mass of the substance, exploiting the SI definition that one mole corresponds to Avogadro's number of elementary entities. This conversion is the standard bridge between a bulk mass measurement and a chemical amount expressed in moles."
