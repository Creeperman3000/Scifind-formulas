description: The voltage divider rule gives the voltage appearing across one resistor
  of a series pair as a fraction of the total applied voltage, proportional to that
  resistor's share of the total resistance. It follows from Ohm's law and the fact
  that the same current flows through series elements. It applies to unloaded resistive
  dividers; a load connected across the output changes the ratio.
