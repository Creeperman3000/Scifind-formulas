description: The derivative of the tangent function is the secant squared, equivalently
  the reciprocal of cosine squared. It follows from applying the quotient rule to
  tangent written as sine over cosine, and holds wherever cosine is nonzero.
equation: (rmd tan angle frac rmd angle) eq (1 frac (cos angle pow 2))
