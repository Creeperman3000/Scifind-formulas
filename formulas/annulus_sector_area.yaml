description: "An annular sector is the ring-shaped wedge bounded by two concentric circular arcs and two radial edges, like a bent strip cut from a washer. Its area grows linearly with the central angle and with the difference of the squares of the outer and inner radii, assuming both arcs share the same centre and the angle is expressed in radians. This shape arises in engineering calculations for washers, flange segments, and curved structural members."
equation: area eq angle mul (length pow 2 sub length pow 2) frac 2
