name: Escape velocity from gravitational potential
id: escaping_velocity_from_gravitational_potential
topic: escape_velocity
difficulty: 7
links:
  - https://en.wikipedia.org/wiki/Escape_velocity
  - https://en.wikipedia.org/wiki/Gravitational_potential_energy
description: "Obtains the escape speed from the depth of the gravitational potential well at the starting point: the launch kinetic energy per unit mass must equal the magnitude of the gravitational potential energy per unit mass there. This energy-based view applies at any distance from the attracting body and follows directly from conservation of energy. Assumes a conservative gravitational field and no drag or other forces."
equation: velocity eq sqrt ((energy mul 2) frac mass ) 2
symbol_overrides:
