description: "The volume of a circular cylinder equals the area of its circular base multiplied by its height. The result holds for both right and oblique cylinders, and a proof without calculus follows from Cavalieri's principle by stacking disks along the axis."
equation: volume eq pi mul (length pow 2) mul length
