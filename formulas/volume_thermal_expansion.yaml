description: "The change in volume of a body due to a temperature change is approximately three times the linear expansion coefficient times the initial volume times the change in temperature, valid for isotropic solids and small temperature intervals. This comes from the fact that the volumetric expansion coefficient is roughly three times the linear one."
equation: volume eq 3 mul (coefficient_of_linear_expansion) mul (volume) mul Delta temperature
