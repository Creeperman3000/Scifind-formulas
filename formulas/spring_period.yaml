description: For an undamped mass on an ideal linear spring, the period of small oscillations
  depends only on the mass and the spring constant, not on the amplitude. The motion
  is isochronous and is the prototypical example of simple harmonic motion.
equation: ((time) eq (2 mul pi mul ((mass div spring_constant) sqrt 2)))
symbol_overrides:
- time: T
name_overrides:
- time: Period
- spring_constant: '[spring_constant]'
