description: Quantifies the entropy increase when distinct ideal gases mix at constant
  temperature and pressure. Because ideal-gas molecules do not interact, each component
  expands independently into the total volume, and the entropy gain depends only on
  the composition of the final mixture; it is always positive for genuine mixing.
