description: "Defines the entropy change of a system as the heat exchanged along a reversible path divided by the absolute temperature at which the transfer occurs. It applies directly to constant-temperature processes such as phase changes, and since entropy is a state function, the same value describes the real (possibly irreversible) change between the same states."
