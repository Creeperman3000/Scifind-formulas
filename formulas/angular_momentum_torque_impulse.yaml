description: "This is the angular impulse-momentum theorem: a net torque acting on a body over a time interval (the angular impulse) equals the resulting change in the body's angular momentum. It is the rotational analogue of the linear impulse-momentum theorem and holds exactly for constant net torque; for varying torque the torque-time product is replaced by its integral."
