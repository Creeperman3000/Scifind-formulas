description: "Gives the balance point of a system of two point masses along one axis as the mass-weighted average of their positions. The center of mass lies closer to the heavier particle, and it reduces to the plain midpoint when the two masses are equal. It is used in collision and rigid-body problems where the whole system can be treated as if its mass were concentrated at one point."
equation: length eq ( ( mass mul length add mass mul length ) frac ( mass add mass ) )
