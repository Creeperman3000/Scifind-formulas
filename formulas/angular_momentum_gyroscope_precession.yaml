description: "When a torque is applied to a spinning gyroscope, its spin axis does not tip over in the direction of the torque but sweeps sideways around a vertical axis — steady precession. The precession rate equals the applied torque divided by the spin angular momentum, valid when precession is slow compared with the spin; faster spin therefore means slower, more stable precession."
