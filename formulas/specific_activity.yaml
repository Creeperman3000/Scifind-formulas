description: "Specific activity is the activity of a radionuclide per unit mass, a fundamental property that quantifies how 'hot' a sample of a given isotope is. It depends only on the decay constant of the nuclide and (through the Avogadro constant and molar mass) on the number of radioactive atoms per gram, and is decisive in selecting radionuclides for radiopharmaceuticals and tracer studies."
