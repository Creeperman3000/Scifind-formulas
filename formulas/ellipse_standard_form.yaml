description: This is the standard form of the equation of an ellipse centered at the
  origin with its major axis along a coordinate axis, where a and b are the semi-major
  and semi-minor axes. Every point (x, y) satisfying it lies on the ellipse, whose
  foci satisfy the focal relationship with these axes. For a center at (h, k), x and
  y are simply replaced by the translated coordinates.
