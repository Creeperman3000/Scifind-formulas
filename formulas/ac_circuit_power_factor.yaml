description: "The power factor is a dimensionless measure of how effectively an AC circuit converts supplied electrical power into useful (real) power, defined as the ratio of real power to apparent power. For sinusoidal waveforms it equals the cosine of the phase angle between voltage and current; values below one indicate reactive or distorted current flow. It is used for sizing and billing in power systems and for power factor correction."
