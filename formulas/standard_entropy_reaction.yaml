description: "The standard entropy change of a reaction quantifies the change in disorder associated with converting reactants in their standard states into products in their standard states. It is computed as the difference between the sum of the standard molar entropies of the products and that of the reactants, each weighted by its stoichiometric coefficient. The sign and magnitude of this quantity indicate whether the reaction increases or decreases the disorder of the system at standard conditions."
