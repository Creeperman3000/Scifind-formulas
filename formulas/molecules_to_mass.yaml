description: "Divides a count of discrete molecules by the Avogadro number to obtain the amount of substance in moles, then multiplies by the molar mass to yield the total sample mass. It is the inverse of the particle-count from-mass conversion, and is used whenever one knows how many molecules are present (e.g. from a counting experiment) and needs the bulk mass."
