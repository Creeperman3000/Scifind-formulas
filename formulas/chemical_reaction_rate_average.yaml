description: The average reaction rate measures how quickly a species is consumed
  or produced over a finite time interval during a chemical reaction. Because rates
  are reported as positive quantities, the change in a reactant's concentration carries
  a leading minus sign (products need no sign flip). It is the basis for distinguishing
  average rates from instantaneous rates in chemical kinetics.
