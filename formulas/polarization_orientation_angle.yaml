description: The polarization orientation angle specifies the tilt of the electric
  field's oscillation direction relative to a reference axis in the plane perpendicular
  to propagation. For a linearly polarized wave written as a superposition of orthogonal
  components, the tilt is set by the ratio of the component amplitudes.
equation: angle eq atan (electric_field_strength frac electric_field_strength)
