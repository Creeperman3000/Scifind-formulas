description: "This relation expresses the electric current in a conductor in terms of the microscopic drift of its charge carriers: carrier density, carrier charge, cross-sectional area, and drift speed together determine the total charge passing a section per unit time. It applies to conductors or semiconductors with a single dominant carrier type moving at a uniform average drift speed."
