description: "The linear (transverse) magnification of an image formed by a spherical mirror is the ratio of image height to object height. With the Cartesian sign convention it is negative of the ratio of image distance to object distance, so a negative magnification indicates a real, inverted image and a positive magnification a virtual, upright image (such as the image always produced by a convex mirror)."
