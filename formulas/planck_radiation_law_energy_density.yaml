description: Gives the spectral energy density of electromagnetic radiation inside
  a blackbody cavity in thermal equilibrium as a function of frequency and temperature,
  resolving the ultraviolet catastrophe of classical Rayleigh–Jeans theory. It introduced
  energy quantization and is the foundation of quantum mechanics and modern radiation
  physics.
equation: energy_density eq (8 mul pi) mul (planck_constant mul frequency pow 3) frac
  ((speed_of_light pow 3) mul (exp ((planck_constant mul frequency) frac boltzmann_constant
  mul temperature ) sub 1) )
name_overrides:
- energy_density: Spectral [energy] density
