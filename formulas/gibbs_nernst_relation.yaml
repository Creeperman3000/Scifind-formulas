description: "The maximum non-expansion (electrical) work obtainable from a thermodynamically closed system at constant temperature and pressure equals the change in Gibbs free energy. This relation provides the thermodynamic bridge between the Gibbs free energy of a cell reaction and the measured cell potential, and underlies the derivation of the Nernst equation."
