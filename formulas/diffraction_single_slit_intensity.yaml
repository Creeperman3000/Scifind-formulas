description: Gives how the intensity of monochromatic light varies with angle across
  the pattern formed by Fraunhofer diffraction at a single narrow slit. The central
  maximum is by far the brightest, and the intensity falls to zero at the minima where
  the half phase difference is an integer multiple of pi.
