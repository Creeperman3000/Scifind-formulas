description: "The Carnot efficiency is the maximum theoretical efficiency any heat engine can achieve while operating between a hot and a cold reservoir, set by their absolute temperatures alone. By Carnot's theorem, no real engine can exceed this bound, and the limit is reached only by an ideal, fully reversible cycle. It is used as a benchmark for power plants and engines; both temperatures must be expressed on an absolute (kelvin) scale."
