description: "The period of a simple pendulum, also called the small-angle approximation, is independent of the mass of the bob and of the swing amplitude (provided the angle is small). It depends only on the pendulum length and the local gravitational acceleration, which is the basis for using pendulums as clocks and gravimeters."
