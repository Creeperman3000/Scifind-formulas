description: "An inductor carrying a current stores energy in the magnetic field it produces, and this energy can be recovered when the current falls. The stored energy grows with the square of the current, so doubling the current quadruples it, assuming constant inductance. This relation is used in RL and LC circuit analysis and in power-electronics designs such as switching converters."
equation: energy eq inductance mul (current pow 2) frac 2
