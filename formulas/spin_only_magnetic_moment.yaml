description: The spin-only formula estimates the magnetic moment of a transition-metal
  complex (inBohrmagnetons) by neglecting the orbital contribution and considering
  only the spin angular momentum of unpaired electrons. It is a good first approximation
  for high-spin complexes of first-row transition metals.
