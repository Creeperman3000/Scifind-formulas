description: "The molecular form of the ideal gas law expresses the relationship between macroscopic state variables in terms of the number of gas particles and the Boltzmann constant rather than the moles and gas constant. It is equivalent to the standard form since nR = Nk_B, and is often used in statistical mechanics."
