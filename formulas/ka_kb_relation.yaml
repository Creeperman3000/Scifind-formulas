description: "For a conjugate acid–base pair in aqueous solution, the product of the acid dissociation constant K_a and the base dissociation constant K_b equals the ion product of water K_w. This relation implies that a stronger acid has a weaker conjugate base, and equivalently pK_a + pK_b = pK_w at 25 °C."
