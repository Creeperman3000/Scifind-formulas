description: Gives the tension in the massless, inextensible string of an ideal Atwood
  machine, where two hanging masses m₁ and m₂ are connected over a frictionless pulley.
  It is derived from Newton's second law applied to each mass, and is intermediate
  between the two weights m₁g and m₂g.
