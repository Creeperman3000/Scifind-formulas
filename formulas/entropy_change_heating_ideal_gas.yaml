description: "Gives the total entropy change of a fixed quantity of ideal gas between two states, combining a temperature contribution through the constant-volume molar heat capacity and a volume contribution through the gas constant. Because entropy is a state function, this value holds for any path between the same initial and final states."
equation: entropy eq amount mul molar_energy mul ( euler_e log ( temperature frac temperature ) ) add amount mul gas_constant mul ( euler_e log ( volume frac volume ) )
