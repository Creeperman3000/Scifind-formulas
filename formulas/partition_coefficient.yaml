description: "The partition coefficient (K or P) is the ratio of concentrations of a solute between two immiscible solvents at equilibrium, typically reported as the concentration in the organic phase divided by that in the aqueous phase. It is widely used in pharmaceutical and environmental chemistry to characterize lipophilicity, with log P being the common logarithmic form."
