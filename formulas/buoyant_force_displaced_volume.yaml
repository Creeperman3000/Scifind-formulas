name: Buoyant force from displaced volume
id: buoyant_force_displaced_volume
topic: buoyancy
difficulty: 5
links:
  - https://en.wikipedia.org/wiki/Archimedes_principle
  - https://phys.libretexts.org/Bookshelves/College_Physics/College_Physics_1e_(OpenStax)/11%3A_Fluid_Statics/11.07%3A_Archimedes_Principle
  - https://physics.info/buoyancy/
  - https://www.physicsclassroom.com/tutorial/fluids/pressure/buoyant-force-and-archimedes-principle
description: "By Archimedes' principle, the upward buoyant force on an immersed object equals the weight of the fluid it pushes aside, computed here as the fluid density times gravitational acceleration times the displaced volume. For a fully submerged object the displaced volume is the object's volume; for a floater it is only the submerged part."
equation: force eq density mul (acceleration) mul volume
symbol_overrides:
- force: F_b
- density: \rho_{fluid}
- acceleration: g
- volume: V_{displaced}
name_overrides:
- force: Buoyant [force]
- density: Fluid [density]
- acceleration: Gravitational [acceleration]
- volume: '[volume] of displaced fluid'
