description: The escape speed at a given distance from a primary body is √2 times
  the speed of a circular orbit at that same distance, because the potential energy
  of an orbiting object is minus twice its kinetic energy while escape requires their
  sum to be non-negative. The escape speed is also known as the second cosmic velocity
  and is independent of direction.
