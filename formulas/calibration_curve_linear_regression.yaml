description: "In analytical chemistry, a calibration curve relates the instrument response measured for standards of known concentration to that concentration, with the straight-line fit obtained by ordinary least-squares regression. The fitted slope and intercept are then used to determine analyte concentrations in unknown samples by inverse prediction."
