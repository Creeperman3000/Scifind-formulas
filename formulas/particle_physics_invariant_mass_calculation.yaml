description: "The invariant (rest) mass of a particle is the Lorentz-invariant length of its four-momentum, obtained by combining the total energy and momentum measured in any frame. This relation underlies particle-identification techniques in collider experiments, where the invariant mass of decay products is used to determine the mass of the parent particle."
equation: (mass pow 2) mul speed_of_light pow 4 eq (energy pow 2) sub (momentum pow 2) mul speed_of_light pow 2
