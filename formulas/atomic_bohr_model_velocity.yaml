description: "Gives the orbital speed of the electron in the nth circular orbit of Bohr's model of hydrogen, obtained by combining Coulomb attraction with quantized angular momentum. The speed falls off inversely with orbit number and is largest in the ground state, remaining safely below the speed of light for hydrogen. Applies to hydrogen-like single-electron atoms within the semiclassical Bohr approximation."
equation: velocity eq (elementary_charge pow 2) frac ((vacuum_permittivity mul 2) mul
  (planck_constant) mul dimensionless )
