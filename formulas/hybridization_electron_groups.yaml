description: "The number of electron groups (also called the steric number) around a central atom equals the total count of bonded atoms (sigma-bonded groups) plus the number of non-bonding lone pairs on that atom. This sum determines the underlying electron-group geometry, which in turn fixes the hybridization of the central atom (sp, sp², sp³, sp³d, sp³d², etc.) and the predicted molecular shape by VSEPR. The relation is the basis for assigning hybridization and predicting the geometry of molecules and polyatomic ions."
