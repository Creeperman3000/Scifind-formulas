description: "On a frictionless inclined plane at angle θ above the horizontal, the component of an object's weight directed parallel to the surface (down the slope) is the gravitational force component mg sin θ. This component drives the object's acceleration along the plane when no other force opposes it."
equation: force eq mass mul (standard_gravity) mul sin angle
symbol_overrides:
  - force: F_{\parallel}
  - angle: \theta
name_overrides:
  - force: Parallel component of weight
  - angle: Incline angle
