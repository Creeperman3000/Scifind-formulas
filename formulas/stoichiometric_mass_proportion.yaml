description: "The mass ratio of two reactants (or products) in a balanced reaction is
  obtained by multiplying each species\u2019 stoichiometric coefficient by its molar
  mass. This relation underlies composition and reaction stoichiometry, allowing conversion
  between moles and grams using the molar mass as a conversion factor."
