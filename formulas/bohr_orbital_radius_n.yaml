description: Gives the radius of the electron's allowed circular orbit in Bohr's model
  of the hydrogen atom, which grows with the square of the principal quantum number.
  The innermost orbit (n = 1) equals the Bohr radius, and for hydrogen-like ions the
  orbit radii are reduced in proportion to the nuclear charge number.
