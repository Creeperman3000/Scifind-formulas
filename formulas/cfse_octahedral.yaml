description: Net energy by which a d-electron configuration in an octahedral ligand
  field is more stable than the same electrons spread evenly over all five d orbitals
  (the barycenter). Electrons in the lower t2g set stabilize the complex while electrons
  in the upper eg set destabilize it, so the balance depends on how many occupy each
  set. Used to compare complex stabilities, site preferences, and high-spin versus
  low-spin configurations; pairing energy must be accounted for separately.
