description: A fundamental dimensionless constant characterizing the strength of the
  electromagnetic interaction between elementary charged particles. Named for its
  role in explaining the fine splitting of atomic spectral lines, it also equals the
  ratio of the electron's ground-state Bohr-orbit speed to the speed of light, and
  its smallness (about one over 137) underlies the success of perturbation methods
  in quantum electrodynamics.
