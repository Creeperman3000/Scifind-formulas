description: The standard Cartesian form of a hyperbola centered at the origin with
  its transverse axis along the x-axis, where a is the semi-transverse axis and b
  is the semi-conjugate axis. Replacing x by (x-h) and y by (y-k) shifts the center
  to (h, k).
