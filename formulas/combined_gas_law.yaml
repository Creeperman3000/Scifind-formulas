description: "The combined gas law merges Boyle's, Charles's, and Gay-Lussac's laws into a single statement relating the pressure, volume, and absolute temperature of a gas sample before and after a change of state. It is used to predict how one property shifts when the other two change, and it holds for a fixed amount of ideal gas, with temperatures expressed in kelvins."
