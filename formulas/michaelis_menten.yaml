description: Models the rate of a simple enzyme-catalyzed reaction as a function of substrate concentration under steady-state (or rapid-equilibrium) assumptions, with Vmax the limiting rate at saturation and Km the substrate concentration at half-maximum velocity. Widely used in enzyme kinetics, pharmacology, and microbial growth modeling.
