description: "Young's modulus is a mechanical property of solid materials that measures tensile or compressive stiffness when force is applied along one axis. It is defined as the ratio of uniaxial stress to the resulting strain in the linear elastic region of the material, and is valid only within the Hookean (small-strain, reversible) limit."
