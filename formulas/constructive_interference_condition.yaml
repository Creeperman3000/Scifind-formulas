description: "Two waves that start out in phase reinforce each other — producing a maximum or bright fringe — whenever the extra distance traveled by one wave is a whole number of wavelengths. This condition locates the maxima in interference patterns such as Young's double-slit experiment, thin films, and diffraction gratings. The integer n is called the order number; it assumes coherent, in-phase sources."
