description: "The surface area of a sphere equals four times the area of a great circle on it, a result Archimedes first obtained by comparing a sphere with its circumscribed cylinder. \nIt is the limiting case for any closed surface of given volume and appears in physics wherever spherical geometry arises, from planetary science to bubble mechanics."
