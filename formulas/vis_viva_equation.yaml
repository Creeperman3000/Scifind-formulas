description: The vis-viva equation relates the square of an orbiting body's relative
  speed to the gravitational parameter of the central body, the instantaneous distance
  between the bodies, and the semi-major axis of the orbit. It follows directly from
  conservation of mechanical energy in a two-body Keplerian orbit and applies to elliptic,
  parabolic, hyperbolic, and radial trajectories.
