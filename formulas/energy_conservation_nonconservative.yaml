description: "Extends mechanical energy conservation to systems where friction, drag, or other nonconservative forces act. The work done by such forces accounts exactly for the change in the system's total mechanical energy: positive work adds energy (for example a person pushing a crate), while negative work removes it (as friction does). It is used to solve motion problems without applying Newton's laws force by force."
