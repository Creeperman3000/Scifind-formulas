description: "In analytical chemistry, sensitivity measures how strongly a method responds to changes in the amount of analyte: it is the slope of the calibration curve relating the instrument's measured signal to the analyte concentration. A steeper calibration line means smaller concentration differences can be distinguished. For nonlinear calibration curves the sensitivity varies with concentration and equals the local slope."
