description: The standard undamped simple harmonic oscillator equation governs the
  motion of a mass attached to an ideal spring (and, in the small-angle limit, a pendulum).
  Its solutions are sinusoidal, with the natural angular frequency set by the ratio
  of spring stiffness to mass, and form the prototype for oscillations, waves, and
  many quantum-mechanical bound states.
