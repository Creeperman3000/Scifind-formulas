description: "In the Young double-slit experiment, the equally spaced bright fringes on a distant screen are separated by a fringe spacing that increases linearly with the wavelength and the slit-to-screen distance and decreases as the slits are brought closer together. The formula applies in the small-angle, far-field (Fraunhofer) approximation where the path difference across the slits is approximately m*lambda."
