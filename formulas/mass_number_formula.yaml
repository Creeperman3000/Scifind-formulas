description: "The mass number A of an atomic nucleus equals the total count of protons and neutrons (nucleons) it contains, so A = Z + N where Z is the atomic number and N the neutron number. It is a dimensionless integer that distinguishes isotopes of the same element and is approximately equal to the isotopic mass in daltons. Mass number plays a key role in nuclear notation, radioactive decay classifications, and nuclear reaction accounting."
