description: "A Wheatstone bridge is balanced when the ratio of resistances in one leg equals the ratio in the other, so that the galvanometer reads zero current. The bridge is widely used to measure an unknown resistance with high precision, and to transduce small changes in resistance due to strain, temperature, or other physical quantities."
