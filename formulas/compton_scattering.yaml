description: The Compton shift is the increase in a photon's wavelength after it scatters
  off a loosely bound (effectively free) electron, derived from relativistic energy
  and momentum conservation. The shift depends only on the scattering angle and not
  on the incident wavelength, growing from zero for forward scattering to twice the
  electron's Compton wavelength for backscattering. Its 1923 observation was decisive
  evidence for the particle nature of light.
