description: "Gives the maximum number of electrons that can occupy an atomic subshell with azimuthal quantum number l. Each of the 2l+1 orbitals in the subshell holds at most two electrons of opposite spin (Pauli exclusion principle), so s subshells hold 2 electrons, p hold 6, d hold 10, and f hold 14. It underpins electron configurations and the structure of the periodic table."
