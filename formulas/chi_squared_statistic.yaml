description: "Pearson's chi-squared statistic quantifies how far observed category counts deviate from the counts expected under a null hypothesis, with deviations weighted by their expected sizes. It underpins chi-square tests of goodness of fit, independence, and homogeneity, and is compared against the chi-square distribution to obtain a p-value. Each expected count should be at least about five for the test to be valid."
