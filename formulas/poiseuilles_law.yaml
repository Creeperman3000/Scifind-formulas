description: "The Hagen–Poiseuille (Poiseuille's) law gives the steady-state volumetric flow rate of a viscous, incompressible, Newtonian fluid through a long cylindrical pipe under laminar flow conditions. The flow rate depends on the fourth power of the pipe radius and is inversely proportional to the fluid's dynamic viscosity and the pipe length."
