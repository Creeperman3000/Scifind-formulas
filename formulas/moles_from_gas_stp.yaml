description: "At standard temperature and pressure, one mole of any ideal gas occupies a fixed molar volume (about 22.4 L at the historical 0 °C/1 atm STP, or 22.7 L at the modern IUPAC 0 °C/1 bar standard), so the amount of gas in moles is its measured volume divided by that molar volume. The relation is exact only for ideal gases, but serves as a useful approximation for many real gases near STP."
