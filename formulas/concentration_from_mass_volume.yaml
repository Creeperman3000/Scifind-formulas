description: "Gives the molar concentration of a solution when the solute is measured by weight rather than in moles. The solute mass is first converted to an amount of substance using its molar mass, then related to the total solution volume. Widely used for preparing laboratory solutions of a target molarity from a weighed solid."
equation: concentration eq (mass frac molar_mass) frac volume
name_overrides:
- concentration: Molar [concentration]
- mass: '[mass] of solute'
- molar_mass: Molar [molar_mass|mass]
- volume: '[volume] of solution'
