description: "The semiperimeter of a triangle is half of its perimeter, equal to half the sum of the three side lengths. It appears as a building block in many triangle formulas, most notably Heron's formula for the area and the inradius relation r = A/s."
equation: length eq (length add (length) add length ) frac 2
