description: The harmonic mean of two positive numbers is the reciprocal of the arithmetic
  mean of their reciprocals, equal to twice the product divided by the sum. It is
  one of the three Pythagorean means and is the appropriate average for rates and
  ratios, such as average speed over equal distances or the equivalent resistance
  of two equal resistors in parallel.
