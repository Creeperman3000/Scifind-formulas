description: A compound (physical) pendulum is an extended rigid body swinging about
  a fixed horizontal pivot under gravity, rather than a point mass on a massless string.
  Its small-angle oscillation period is set by the moment of inertia about the pivot
  and the distance from the pivot to the center of mass. It reduces to the simple-pendulum
  result in the point-mass limit and is the basis of precision gravimeters such as
  Kater's reversible pendulum.
equation: ((time) eq (2 mul pi mul ((moment_of_inertia frac (mass mul (standard_gravity
  mul length))) sqrt 2)))
