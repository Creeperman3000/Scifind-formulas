description: "Gives the area enclosed by any triangle from the length of one side and the perpendicular distance of the opposite vertex from that side's line. It reflects that a triangle occupies exactly half of the parallelogram or rectangle sharing its base and height. The height must be measured perpendicularly to the chosen base, even when it falls outside an obtuse triangle."
