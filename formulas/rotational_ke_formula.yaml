  - https://phys.libretexts.org/Bookshelves/University_Physics/University_Physics_(OpenStax)/Book%3A_University_Physics_I_-_Mechanics_Sound_Oscillations_and_Waves_(OpenStax)/10%3A_Fixed-Axis_Rotation__Introduction/10.05%3A_Moment_of_Inertia_and_Rotational_Kinetic_Energy
description: The kinetic energy of a rigid body rotating about a fixed axis is half the product of its moment of inertia and the square of its angular velocity. This is the rotational counterpart of the linear formula, with moment of inertia acting as the rotational analogue of mass and angular velocity as the analogue of linear speed.
equation: energy eq moment_of_inertia mul (angular_velocity mul angular_velocity) frac 2
