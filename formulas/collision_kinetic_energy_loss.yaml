description: "This relation gives the net change in the internal kinetic energy of a system during a collision. In an elastic collision it is zero, while in an inelastic collision it is negative because some kinetic energy is converted into heat, sound, or deformation; its magnitude is then reported as the energy lost. It is used to quantify how much ordered motion a crash or impact dissipates."
