description: This algebraic identity, also known as the cube of a difference, expands
  the cube of a two-term binomial where one term is subtracted from the other. It
  is a special case of the binomial theorem with alternating signs and is used to
  expand expressions, factor cubics, and simplify mental arithmetic such as cubing
  numbers near round values.
