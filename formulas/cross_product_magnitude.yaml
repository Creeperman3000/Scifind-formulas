description: The magnitude of the cross product of two vectors equals the area of
  the parallelogram they span. It vanishes when the vectors are parallel or antiparallel
  and is maximal when they are perpendicular; the cross-product vector itself points
  perpendicular to both inputs with direction given by the right-hand rule.
