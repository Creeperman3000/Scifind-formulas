description: For an isobaric (constant-pressure) process the first law reduces to
  a relation between the heat added, the change in internal energy, and the pressure-volume
  work. The work done by the system at constant pressure is P times the change in
  volume, which is why the heat added at constant pressure equals the change in enthalpy.
