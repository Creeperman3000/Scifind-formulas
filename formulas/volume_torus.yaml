description: "A torus (ring shape) is the surface of revolution generated by revolving a circle about an external coplanar axis. The volume of the solid torus equals two pi squared times the major radius times the square of the minor radius, derivable from Pappus's centroid theorem applied to a disk."
equation: volume eq 2 mul (pi pow 2) mul (length) mul length pow 2
