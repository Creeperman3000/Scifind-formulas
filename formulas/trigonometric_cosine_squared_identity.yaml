description: "This power-reduction identity rewrites the square of the cosine of an angle in terms of the cosine of twice the angle. It is the cosine form of the half-angle / power-reduction formulas, and is useful in calculus for integrating powers of cosine and in signal processing for handling squared sinusoidal quantities."
equation: cos angle pow 2 eq (1 add cos (angle mul 2) ) frac 2
