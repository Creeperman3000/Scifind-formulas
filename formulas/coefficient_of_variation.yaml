description: A unitless, relative measure of dispersion that expresses the standard
  deviation as a percentage of the mean. Because it strips units away, it allows comparison
  of variability between datasets with different scales or very different averages.
  It is only meaningful for ratio-scale data with a nonzero mean well away from zero.
