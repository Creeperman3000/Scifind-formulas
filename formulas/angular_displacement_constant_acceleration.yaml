description: "A rotational kinematics equation giving the angle swept by a body rotating about a fixed axis with constant angular acceleration, starting from a known initial spin rate. It is the rotational analogue of the corresponding linear motion equation and is valid only while the angular acceleration stays constant; angles must be expressed in radians."
equation: angle eq angular_velocity mul (time) add dimensionless frac (dimensionless)
  mul (angular_acceleration) mul time pow 2
symbol_overrides:
- angular_velocity: \omega_0
- dimensionless: '1'
- dimensionless: '2'
name_overrides:
- angle: Angle
- angular_velocity: Initial angular velocity
- dimensionless: One
- dimensionless: Two
- angular_acceleration: Angular acceleration
