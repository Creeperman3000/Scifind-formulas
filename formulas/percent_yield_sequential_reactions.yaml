description: In a linear multi-step synthesis each intermediate is the product of
  one reaction and the substrate of the next, so the overall percent yield is the
  product of the individual step yields. Because each step is typically less than
  quantitative, the overall yield falls off rapidly with the number of steps—for example,
  five steps each at 80% give only about 33% overall. Convergent syntheses, which
  combine independently prepared fragments, are often favoured for complex targets
  because their effective step count is shorter.
