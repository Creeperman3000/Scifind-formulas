description: 'This relation, used in hydrostatic weighing, lets you find an object''s
  density without measuring its volume: weigh it in air and again while fully submerged
  in a fluid of known density. The difference between the two weights is the buoyant
  force, which equals the weight of displaced fluid by Archimedes'' principle.'
