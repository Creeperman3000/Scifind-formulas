description: "Carnot's theorem places an upper bound on the efficiency of any heat engine operating between two thermal reservoirs, the maximum being attained by a reversible (Carnot) cycle. The result follows from the second law of thermodynamics and depends only on the absolute temperatures of the hot and cold reservoirs."
