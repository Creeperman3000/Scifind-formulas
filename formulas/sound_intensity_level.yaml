description: "Sound intensity level is a logarithmic measure of a sound's acoustic intensity referenced to a standard threshold of audibility, expressed in decibels. Because the human ear responds to intensity on a logarithmic scale, this quantity is used to quantify loudness and is the basis of most noise-exposure standards."
