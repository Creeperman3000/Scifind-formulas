description: "Absorbed dose rate measures how quickly ionizing radiation deposits energy in matter, expressed as absorbed dose delivered per unit time (SI unit: gray per second). It is the key quantity for assessing radiation field intensity, since the total dose accumulated equals the rate multiplied by the exposure time."
