description: The law of sines states that in any triangle the ratio of each side to
  the sine of its opposite angle is constant, and this common value equals the diameter
  of the triangle's circumscribed circle. It is used to compute unknown sides or angles
  in triangulation and surveying problems, with an ambiguous case when two sides and
  a non-included angle are given.
