description: A dimensionless measure of how elastic a two-body collision is, given
  by the ratio of the relative speed of separation after impact to the relative speed
  of approach along the line of impact. It equals one for perfectly elastic collisions
  and vanishes when the bodies stick together in a perfectly inelastic one. It is
  used with momentum conservation to find post-collision velocities.
