description: "When two thin lenses are placed in contact (or very close together) the combined optical power is the sum of the individual powers, because each lens adds its own convergence or divergence. Optical power is measured in dioptres (inverse metres); the rule fails if the separation between the lenses is not negligible compared with their focal lengths."
