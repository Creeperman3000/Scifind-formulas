description: 'The first-order differential equation defining exponential growth (also
  known as the Malthusian law): a quantity changes at a rate directly proportional
  to its own current value. It models populations, compound interest, and chain reactions
  under unlimited resources; its solution is the exponential function with rate constant
  r (negative r gives decay instead).'
