description: The iodine number (or iodine value) is the mass of iodine in grams that
  is consumed by 100 grams of a chemical substance, and is a measure of the degree
  of unsaturation in fats, oils, and waxes. It is determined by reacting the sample
  with an excess of a halogen reagent such as Wijs solution and back-titrating the
  unreacted halogen.
