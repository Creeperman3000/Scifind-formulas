description: "Gives where the m-th bright interference fringe appears on a screen in Young's double-slit experiment, measured from the central maximum. It follows from the constructive-interference condition together with the small-angle approximation, so it applies when the screen is far compared with the slit separation. Bright fringes spread farther apart for longer wavelengths, wider screens, and narrower slit spacing."
