description: Gives the magnitude of the electric field produced by a point charge
  at a distance from it, directed radially away from a positive charge or toward a
  negative charge. It follows directly from Coulomb's law divided by the test charge,
  falls off with the square of the distance, and is the building block for fields
  of more complex charge distributions via superposition.
