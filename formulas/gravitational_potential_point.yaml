description: "The gravitational potential at a point is the gravitational potential energy per unit mass that would be required to bring a test mass from infinity to that point in a conservative gravitational field. By convention the potential is taken to be zero at infinity, so the value is negative everywhere outside the source. The expression applies to a true point mass and, by the shell theorem, to the exterior of any spherically symmetric body of total mass M."
