  - http://labman.phys.utk.edu/phys135core/modules/m7/center_of_mass.html
description: "The velocity of a system's center of mass is the mass-weighted average of the velocities of its parts, which also equals the total momentum of the system divided by the total mass. Because an isolated system's total momentum is conserved, its center of mass moves at constant velocity no matter how the individual particles move. This underlies collision analysis and the treatment of extended bodies as single particles."
