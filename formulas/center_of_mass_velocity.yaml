name: Velocity of the center of mass
id: center_of_mass_velocity
topic: linear_momentum
difficulty: 6
links:
  - https://phys.libretexts.org/Bookshelves/University_Physics/University_Physics_I_-_Classical_Mechanics_(Gea-Banacloche)/03%3A_Momentum_and_Inertia/3.03%3A_Extended_Systems_and_Center_of_Mass
