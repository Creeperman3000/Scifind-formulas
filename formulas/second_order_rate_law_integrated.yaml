description: For a reaction that is second order in a single reactant, the integrated
  rate law is obtained by integrating the rate law d[A]/dt = -k[A]². It gives a linear
  relation between the reciprocal of the reactant concentration and time, and is used
  to extract the second-order rate constant k from experimental concentration-versus-time
  data.
