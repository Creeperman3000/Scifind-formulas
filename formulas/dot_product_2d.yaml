description: Computes the scalar (dot) product of two planar vectors from their Cartesian
  components by multiplying matching coordinates and summing. The result is a single
  number, equal to the product of the magnitudes and the cosine of the angle between
  the vectors; it is zero exactly when the vectors are perpendicular. Used to find
  projections, angles, and work in physics.
