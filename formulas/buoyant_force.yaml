description: "The buoyant force is the upward force a fluid exerts on an immersed object, equal in magnitude to the weight of the fluid displaced (Archimedes' principle). It applies to any fluid, whether the object is partially or fully submerged, and determines whether objects float or sink."
equation: force eq density mul (standard_gravity) mul volume
symbol_overrides:
- force: F_b
name_overrides:
- force: Buoyant [force]
- density: Fluid [density]
- volume: Displaced volume
