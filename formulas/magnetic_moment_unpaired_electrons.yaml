description: The spin-only magnetic moment of a transition-metal complex or atom depends
  only on the number of unpaired electrons, in units of the Bohr magneton. It is used
  to deduce the electron configuration and high-spin vs. low-spin state of a complex
  from a measured magnetic susceptibility.
