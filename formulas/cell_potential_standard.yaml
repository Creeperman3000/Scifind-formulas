description: "The standard cell potential is the voltage of an electrochemical cell when both half-cells are in their standard states — one molar solutions, one bar gas pressures, and 25 degrees Celsius. It combines the tabulated standard reduction potentials of the two electrodes and measures the driving force of the redox reaction: a positive value indicates a spontaneous galvanic cell. It is the starting point for predicting spontaneity and calculating equilibrium constants."
