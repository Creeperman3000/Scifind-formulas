description: "The projection formula expresses one side of a triangle as the sum of the projections of the other two sides onto it, using the cosine of the adjacent angles. It is a useful rearrangement of the law of cosines that connects sides and angles in a single linear relationship."
equation: length eq length mul (cos angle ) add length mul cos angle
