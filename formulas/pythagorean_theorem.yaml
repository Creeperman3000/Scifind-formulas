description: "A cornerstone of Euclidean geometry, the Pythagorean theorem states that in any right triangle the area of the square on the hypotenuse equals the sum of the areas of the squares on the other two sides. It underlies the Euclidean distance formula, the law of cosines, and many results in analytic geometry, trigonometry, and physics."
