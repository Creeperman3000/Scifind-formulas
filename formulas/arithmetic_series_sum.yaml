description: "Gives the total when the terms of an arithmetic sequence are added together. It works by pairing terms from opposite ends of the series, a technique famously used by Gauss as a schoolboy, so the sum equals the number of terms times the average of the first and last term. Applies to any finite arithmetic series, whether the terms grow or shrink."
