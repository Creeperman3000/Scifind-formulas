description: The WKB approximation gives an estimate of the probability that a quantum
  particle tunnels through a potential barrier whose height exceeds the particle's
  energy. The result is dominated by an exponential decay with the barrier width,
  particle mass, and barrier height, and is the basis of alpha decay, field emission,
  and scanning tunneling microscopy.
