description: "The Rydberg unit of energy is the photon energy corresponding to the Rydberg constant, i.e. the ionization energy of a ground-state hydrogen atom in the Bohr model, about 13.6 eV. It serves as a convenient natural energy unit for atomic spectra and hydrogen-like atoms."
