description: This is the air-standard thermal efficiency of the ideal Diesel cycle,
  the theoretical model for compression-ignition engines with isentropic compression,
  constant-pressure heat addition, isentropic expansion, and constant-volume heat
  rejection. It depends on the compression ratio, the cutoff ratio, and the ratio
  of specific heats; for a fixed compression ratio it is always slightly below the
  Otto cycle efficiency, though real diesels compensate with much higher compression
  ratios.
