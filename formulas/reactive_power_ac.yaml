description: "Reactive power Q in a sinusoidal AC circuit equals the product of the RMS voltage, RMS current, and the sine of the phase angle between them; it represents the rate at which energy is exchanged between the source and reactive storage elements (inductors and capacitors) without net energy transfer."
equation: power eq electric_potential mul (current) mul sin angle
