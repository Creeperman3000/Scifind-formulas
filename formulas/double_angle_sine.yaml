description: "Trigonometric identity expressing the sine of twice an angle as twice the product of the sine and cosine of the angle. It is a special case of the sine addition formula with both angles equal, and it also has an equivalent form written purely in terms of the tangent. Used to simplify expressions, evaluate exact trig values, and in physics for relations such as projectile range."
equation: sin (angle mul 2) eq 2 mul (sin angle ) mul cos angle
