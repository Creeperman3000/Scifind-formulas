description: "Nodes are the fixed points of zero amplitude in a standing wave, located at integer multiples of half a wavelength from a reference node. They arise from destructive interference of the two counter-propagating waves that superpose to create the standing pattern, and they remain stationary in time. The spacing between adjacent nodes is therefore half the wavelength of the underlying traveling waves."
