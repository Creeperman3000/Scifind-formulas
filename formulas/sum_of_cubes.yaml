description: The sum of two cubes is the algebraic identity that decomposes a sum
  of two cubed terms into a product of a binomial and a quadratic trinomial. It is
  one of the standard 'recognizable patterns' used in polynomial factorization, alongside
  the difference of squares and the difference of two cubes.
