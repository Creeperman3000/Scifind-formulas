description: 'Dynamic viscosity measures a fluid''s internal resistance to flow: it
  relates the shear stress between adjacent fluid layers to the rate at which velocity
  changes across them. This definition applies to Newtonian fluids in laminar flow,
  where the stress is proportional to the velocity gradient, and it enters calculations
  of viscous drag, lubrication, and the Reynolds number.'
