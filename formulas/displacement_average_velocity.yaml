description: "One of the constant-acceleration kinematics equations: because velocity changes linearly with time under uniform acceleration, its arithmetic mean gives the average velocity over the interval. Multiplying that average by the elapsed time yields the displacement; it is most useful when both endpoint velocities and time are known but acceleration is not."
equation: length eq ((velocity add velocity ) frac 2) mul time
symbol_overrides:
- length: s
- velocity: u
- velocity: v
