description: "For an incompressible fluid flowing steadily through a pipe or channel, the volume passing any cross-section per unit time is the same everywhere along the flow. Consequently, fluid speeds up where the conduit narrows and slows where it widens — the reason water squirts faster from a pinched hose. It is the conservation-of-mass statement for fluids of constant density and assumes the pipe runs completely full."
