description: "In simple harmonic motion, the restoring acceleration is proportional to the displacement from equilibrium, so its magnitude is largest when the displacement equals the amplitude. The peak acceleration scales with the square of the angular frequency, which is why high-frequency oscillators experience much larger peak forces than low-frequency ones of the same amplitude."
equation: acceleration eq (angular_velocity pow 2) mul length
symbol_overrides:
  - acceleration: a_{max}
  - angular_velocity: ω
  - length: A
name_overrides:
  - acceleration: Maximum [acceleration]
  - angular_velocity: Angular frequency
  - length: Amplitude
