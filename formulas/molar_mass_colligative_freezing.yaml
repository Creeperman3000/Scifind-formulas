description: This cryoscopic relation gives the molar mass of an unknown solute from the freezing-point depression it produces when dissolved in a solvent of known cryoscopic constant. The method assumes a dilute ideal solution and a non-dissociating (i = 1) solute.
equation: molar_mass eq cryoscopic_constant mul mass frac (Delta temperature mul mass)
