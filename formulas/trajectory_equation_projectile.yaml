description: Describes the parabolic path of an object launched near Earth's surface
  and moving only under a constant gravitational acceleration, with air resistance
  neglected. The relationship gives the vertical height as a function of horizontal
  distance traveled from the launch point, assuming level ground and an initial height
  of zero. It is the foundation of classical ballistics, sports trajectory analysis,
  and water-jet or fountain modeling.
equation: length eq length mul (tan angle ) sub standard_gravity mul (length pow 2)
  frac 2 mul (velocity pow 2) mul cos angle pow 2
