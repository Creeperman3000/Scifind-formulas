description: "The Venturi tube pressure difference gives the static pressure drop between the wider inlet and the narrower throat of a Venturi tube, derived from Bernoulli's equation for steady, incompressible, inviscid flow. It is the operating principle behind Venturi meters, which infer volumetric flow rate from a measured pressure differential."
equation: pressure eq density mul (((velocity pow 2) sub velocity pow 2 ) frac 2)
