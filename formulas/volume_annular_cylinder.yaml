description: "An annular cylinder (cylindrical shell) is the region between two concentric right circular cylinders of the same height. Its volume is the difference between the outer and inner solid cylinder volumes, equal to the cross-sectional annular area multiplied by the height."
equation: volume eq pi mul (length) mul ((length pow 2) sub length pow 2 )
