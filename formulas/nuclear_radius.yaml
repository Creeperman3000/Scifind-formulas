description: "Empirical relation from the liquid-drop model giving the approximate radius of an atomic nucleus in terms of its mass number. The proportionality constant r_0 is typically 1.2–1.5 fm, reflecting the nearly constant nuclear matter density, and the relation holds well for heavier nuclei (A > 20)."
