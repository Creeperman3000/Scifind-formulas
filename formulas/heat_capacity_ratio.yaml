description: "The heat capacity ratio (also called the adiabatic index or Laplace's coefficient) is the ratio of the heat capacity at constant pressure to the heat capacity at constant volume. It plays a key role in the speed of sound in gases and in the characterization of reversible adiabatic processes of ideal gases."
