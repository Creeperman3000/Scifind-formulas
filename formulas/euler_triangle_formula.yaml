description: Euler's theorem in triangle geometry relates the distance between a triangle's
  circumcenter and incenter to its circumradius and inradius. The formula yields the
  well-known Euler inequality R >= 2r, with equality only for equilateral triangles,
  and is sometimes called the Euler triangle formula.
