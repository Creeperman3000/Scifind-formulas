description: 'Rule for differentiating a composite function by introducing an intermediate
  variable: rates of change multiply along the chain of dependencies. It applies whenever
  the inner and outer functions are differentiable at the relevant points and is the
  workhorse behind implicit differentiation and related-rates problems.'
