description: "The thermal efficiency of a heat engine is the fraction of the heat input from the high-temperature reservoir that is converted into useful work. By the first law of thermodynamics, the work output equals the heat input minus the heat rejected to the cold reservoir, so the efficiency can also be written as one minus the ratio of rejected to absorbed heat. The second law of thermodynamics constrains this efficiency to be less than the Carnot efficiency determined by the reservoir temperatures."
