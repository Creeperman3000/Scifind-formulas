description: "Capacitors connected in series all store the same charge while the applied voltage divides among them, and this rule gives the single equivalent capacitance that could replace the whole chain. The pattern extends to any number of capacitors by adding more reciprocal terms, and the result is always smaller than the smallest individual capacitance. It is used to simplify circuit networks before applying voltage or charge analysis."
