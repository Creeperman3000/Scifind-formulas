description: The mean free path is the average distance a gas molecule travels between
  successive collisions with other molecules in an ideal gas. For hard-sphere molecules
  of diameter d, it equals the Boltzmann constant times absolute temperature divided
  by the product of the pressure, the molecular cross-sectional area, and the square
  root of two.
equation: ((length) eq ((boltzmann_constant mul temperature) frac ((pi mul (length
  pow 2) mul pressure) mul (2 sqrt 2))))
