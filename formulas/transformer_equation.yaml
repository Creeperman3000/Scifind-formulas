description: "Relates the voltages of the secondary and primary windings of an ideal transformer to the number of turns in each winding, following directly from Faraday's law of induction. Step-up and step-down transformers are designed by choosing the appropriate turns ratio, and the same relationship holds for the equivalent inductances of the windings. It is the fundamental design equation for power and signal transformers."
