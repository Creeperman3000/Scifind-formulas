description: "In a right triangle, the sine of an acute angle is the ratio of the length of the side opposite that angle to the length of the hypotenuse. This right-triangle definition extends via the unit circle to angles of any measure and underlies the periodic trigonometric functions used throughout geometry, physics, and signal analysis."
