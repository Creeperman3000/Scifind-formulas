description: The Bohr radius is the characteristic length scale of the hydrogen atom,
  equal to the most probable distance between the nucleus and the electron in the
  ground state of Bohr's model. It serves as the atomic unit of length and fixes the
  size scale of hydrogen-like atoms.
equation: length eq vacuum_permittivity mul (planck_constant pow 2) frac ((pi mul
  mass) mul elementary_charge pow 2 )
