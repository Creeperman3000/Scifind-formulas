description: The Euclidean norm (length) of a three-dimensional vector, computed as
  the square root of the sum of the squares of its Cartesian components. It generalizes
  the Pythagorean theorem to vectors in R^3 and equals the distance from the origin
  to the point (v_x, v_y, v_z).
