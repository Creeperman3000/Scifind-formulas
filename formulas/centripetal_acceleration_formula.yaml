description: "Gives the magnitude of the center-seeking acceleration of a body following a circular or curved path in terms of its tangential speed and the radius of curvature. The acceleration is perpendicular to the velocity and points toward the center, growing with the square of the speed and shrinking as the curve widens. Used to analyze vehicles on curves, rotating machinery, and orbital motion."
equation: acceleration eq frac (velocity pow 2) length
symbol_overrides:
- acceleration: a_c
- length: r
name_overrides:
- acceleration: Centripetal [acceleration]
- velocity: Tangential [velocity]
- length: Radius of curvature
