description: "Defines pKa as the negative base-10 logarithm of the acid dissociation constant Ka, providing a convenient logarithmic scale on which stronger acids have smaller (or more negative) pKa values. It is the standard way to report and compare the strengths of weak acids in chemistry, biochemistry, and pharmacology."
