description: "Newton's law of cooling states that the rate of convective heat transfer from a body to its surroundings is proportional to the temperature difference between the body and the surrounding fluid. The proportionality constant is the convective heat transfer coefficient, which depends on the fluid properties, flow regime, and surface geometry. The law is most accurate for forced convection with small temperature differences; it is only approximate for natural (buoyancy-driven) convection and does not apply to radiative cooling."
