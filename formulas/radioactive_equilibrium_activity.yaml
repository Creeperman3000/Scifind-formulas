description: "In a parent-daughter radioactive chain, secular or transient equilibrium is reached when the daughter's production rate equals its decay rate, so its activity matches the parent's. This requires the parent to have a much longer half-life than the daughter, and it underpins radionuclide generator systems such as Mo-99/Tc-99m used in medical imaging."
