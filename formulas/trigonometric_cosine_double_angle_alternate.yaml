description: This is one of the standard double-angle identities expressing the cosine
  of twice an angle purely in terms of the cosine of that angle. It is derived from
  the angle sum formula for cosine and the Pythagorean identity, and is widely used
  to simplify products of cosines and to reduce powers of cosine in integration and
  signal-processing problems.
equation: cos (angle mul 2) eq 2 mul (cos angle pow 2) sub 1
