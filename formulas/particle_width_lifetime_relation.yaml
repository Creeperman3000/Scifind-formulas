description: "The decay width Γ of an unstable particle (resonance) is inversely related to its mean lifetime τ through the uncertainty principle. With natural units (ħ=1) the relation is τ = 1/Γ, and with conventional units Γ = h/(2πτ). Wider resonances correspond to shorter-lived particles, a relationship central to scattering and particle spectroscopy."
