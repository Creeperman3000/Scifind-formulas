description: "Relates the energy absorbed or released during a phase change (such as melting, freezing, or vaporization) to the mass of the substance and its specific latent heat. The temperature of the substance stays constant throughout the phase change, so the energy goes entirely into breaking or forming intermolecular bonds rather than raising the temperature."
