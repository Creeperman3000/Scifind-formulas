description: "The identity matrix of size n is the square n-by-n matrix with ones on the main diagonal and zeros elsewhere. It is the multiplicative identity in matrix algebra, leaving any compatible matrix unchanged under left or right multiplication, and serves as the identity element of the general linear group of invertible n-by-n matrices."
