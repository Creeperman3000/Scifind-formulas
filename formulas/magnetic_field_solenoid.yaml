description: "Relates the magnetic flux density inside a long, tightly wound solenoid to the free-space permeability, the number of turns per unit length of windings, and the current carried by the wire. It is the limiting (infinite-solenoid) result of Ampère's law and assumes an air core, ignoring end and fringing effects."
