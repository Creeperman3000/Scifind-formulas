description: "Also called the quotient law of exponents, this rule states that dividing two powers with the same base leaves a single power whose exponent is the difference of the two exponents. It follows from canceling common factors of the base (or equivalently from adding the reciprocal with a negative exponent) and requires a nonzero base."
