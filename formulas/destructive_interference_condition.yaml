description: "Destructive interference occurs when the path difference between two coherent, in-phase waves is a half-integer multiple of the wavelength, so a crest from one source arrives together with a trough from the other and the waves cancel. It is used to locate dark fringes or nodal lines in double-slit and two-source interference patterns."
