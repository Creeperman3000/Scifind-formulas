description: "Quantifies the pressure drop that occurs when a fluid speeds up through a constriction, derived from Bernoulli's principle. Valid for steady, incompressible, inviscid flow; underlies the operation of Venturi meters, carburetors, and atomizers."
equation: pressure sub pressure eq density mul ((velocity pow 2) sub velocity pow 2) frac 2
