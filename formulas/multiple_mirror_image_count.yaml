description: "When an object is placed between two plane mirrors inclined at an angle, multiple images are formed by successive reflections between the mirrors. The number of images depends on the angle between the mirrors, with smaller angles producing more images. This principle is the basis for kaleidoscopes and other optical devices that produce symmetric repeating patterns."
