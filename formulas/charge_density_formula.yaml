description: "Defines the average volume charge density of a body as its total electric charge spread over the three-dimensional space it occupies. It characterizes how much charge resides in each unit of volume and is the starting point for computing electric fields from continuous charge distributions. The result carries a sign, since charge itself may be positive or negative."
equation: charge_density eq charge frac volume
