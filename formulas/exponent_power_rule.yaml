description: "Also called the power of a power rule, this law of exponents says that raising an already-exponentiated quantity to another power multiplies the two exponents while keeping the base unchanged. It comes from counting repeated copies of the inner power and is used constantly when simplifying algebraic expressions and solving exponential equations."
