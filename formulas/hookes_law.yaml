description: "Hooke's law states that the restoring force exerted by an ideal elastic spring is linearly proportional to its displacement from equilibrium, with the negative sign indicating the force acts opposite to the displacement. The proportionality constant k is the spring's stiffness, and the law holds only for small deformations within the elastic limit; beyond that, real materials depart from linear behavior and may yield or break. It is the foundation of the simple harmonic oscillator and underlies devices from spring scales and manometers to balance wheels in mechanical clocks."
