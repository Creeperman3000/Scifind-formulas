description: "Converts a temperature on the Rankine scale to kelvins. Since one Rankine degree equals 5/9 of a kelvin, dividing the Rankine value by 1.8 (or 9/5) yields the equivalent kelvin reading, preserving the absolute scale since both begin at absolute zero."
equation: temperature eq temperature frac 1.8
