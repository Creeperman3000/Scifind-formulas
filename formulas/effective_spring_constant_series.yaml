- https://study.com/skill/learn/how-to-find-the-effective-spring-constant-of-a-set-of-springs-in-series-explanation.html
description: Springs connected end-to-end in series all carry the same force while
  their individual extensions add, so the combination behaves like a single spring
  that is softer than the softest spring in the chain. This relation is used to reduce
  multi-spring arrangements to one effective stiffness for Hooke's-law analysis.
