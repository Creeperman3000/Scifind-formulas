description: "The molar mass of a compound equals the sum of the atomic molar masses of its constituent elements, each weighted by the number of atoms of that element appearing in one formula unit. This is how a chemical formula is converted into a mass per mole, e.g. for water the molar mass is roughly twice the atomic mass of hydrogen plus the atomic mass of oxygen."
