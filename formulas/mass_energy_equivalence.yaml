description: "Mass–energy equivalence, expressed as E = mc², states that the rest energy of a body equals its mass multiplied by the speed of light squared. Introduced by Einstein in 1905, it implies that mass and energy are interchangeable manifestations of the same physical quantity. The relation underlies nuclear reactions, where small mass deficits release enormous energies, and is the conceptual basis for nuclear power and stellar energy production."
