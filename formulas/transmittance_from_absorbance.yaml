description: "Gives the fractional transmittance of light through a sample directly from its decadic absorbance, equivalent to rearranging the definition A = -log10(T). It is widely used in UV-Vis and infrared spectrophotometry to convert between the two common ways of expressing light attenuation. The relation holds for monochromatic light and samples that obey the Beer-Lambert law."
